          "+ Добавить цель")
      ),
      // Completed goals history section
      doneGoals.length>0&&h("div",{style:{marginTop:8}},
        h("div",{style:{fontFamily:F,fontSize:11,fontWeight:700,color:"#B0B7C3",letterSpacing:2,textTransform:"uppercase",marginBottom:10}},"ВЫПОЛНЕННЫЕ · "+doneGoals.length),
        ...doneGoals.map(g=>h("div",{key:"done-"+g.id,style:{background:C.card,borderRadius:18,border:"1px solid "+C.bdr,padding:"14px 16px",marginBottom:8,opacity:.75}},
          h("div",{style:{display:"flex",alignItems:"center",gap:12}},
            h("div",{style:{width:42,height:42,borderRadius:12,background:C.grBg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}},g.emoji),
            h("div",{style:{flex:1}},
              h("div",{style:{fontFamily:F,fontSize:14,fontWeight:700,color:C.ink,display:"flex",alignItems:"center",gap:6}},g.name,h("span",{style:{fontSize:14}},"🎉")),
              h("div",{style:{fontSize:12,color:C.ink2,marginTop:2}},compactFmt(g.saved)+" сум · "+(g.doneDate||"завершено"))
            ),
            h("span",{style:{fontSize:10,fontWeight:700,padding:"4px 10px",borderRadius:8,background:C.grBg,color:C.gr}},"✓ 100%")
          )
        ))
      ),
      h("div",{style:{height:20}})
    ),
    // Create BottomSheet
    h(GoalBottomSheet,{open:showCreate,onClose:()=>setShowCreate(false)},
      h(GoalCreateForm,{onClose:()=>setShowCreate(false),onSubmit:addGoal})
    ),
    // Delete confirm overlay
    deleteConfirm&&h("div",{className:"overlay",style:{zIndex:200}},
      h("div",{className:"msheet",style:{padding:"24px 20px"}},
        h("div",{style:{fontSize:20,fontWeight:800,color:C.ink,marginBottom:8}},"Удалить цель?"),
        h("div",{style:{fontSize:14,color:C.ink2,marginBottom:20,lineHeight:1.5}},
          deleteConfirm.goal.name+(deleteConfirm.goal.saved>0?` · накоплено ${fmt(deleteConfirm.goal.saved)} сум`:"")),
        deleteConfirm.goal.saved>0&&h("div",{className:"btn btn-ink",style:{width:"100%",marginBottom:10},
          onClick:()=>{deleteGoal(deleteConfirm.goal.id,true);setDeleteConfirm(null);}},
          "💰 Вернуть "+fmt(deleteConfirm.goal.saved)+" на баланс"),
        h("div",{className:"btn",style:{width:"100%",marginBottom:10,background:"#FEF2F2",color:"#DC2626"},
          onClick:()=>{deleteGoal(deleteConfirm.goal.id,false);setDeleteConfirm(null);}},
          "🗑 Удалить без возврата"),
        h("div",{className:"btn btn-gray",style:{width:"100%"},
          onClick:()=>setDeleteConfirm(null)},"Отмена")
      )
    )
  );
}

function GoalCreateForm({onClose,onSubmit}){
  const EMOJIS=["✈️","📱","🛡️","🏠","🚗","💍","📚","🎓","🏋️","🌍","💻","🎯"];
  const[emoji,setEmoji]=useState("🎯");
  const[name,setName]=useState("");
  const[target,setTarget]=useState("");
  const[duration,setDuration]=useState(6);
  const[customDur,setCustomDur]=useState("");
  const[useCustom,setUseCustom]=useState(false);
  const dur=useCustom?parseInt(customDur)||1:duration;
  const monthly=dur>0&&parseInt(target)>0?Math.ceil(parseInt(target)/dur):0;

  return h("div",{style:{overflowY:"auto",maxHeight:"88vh",padding:"0 20px 36px"}},
    h("div",{className:"mhandle",style:{marginTop:14}}),
    h("div",{style:{fontFamily:F,fontSize:18,fontWeight:800,color:C.ink,marginBottom:18}},"Новая цель"),
    h("label",{className:"flabel"},"ЗНАЧОК"),
    h("div",{style:{display:"flex",flexWrap:"wrap",gap:6,marginBottom:16}},
      EMOJIS.map(ic=>h("div",{key:ic,onClick:()=>setEmoji(ic),
        style:{width:44,height:44,borderRadius:12,background:emoji===ic?C.ink:C.bg,
          display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,cursor:"pointer",transition:"all .12s"}},ic))
    ),
    h("label",{className:"flabel"},"НАЗВАНИЕ"),
    h("input",{className:"finput sm",style:{marginBottom:14},placeholder:"Например: Путешествие в Дубай",
      value:name,onChange:e=>setName(e.target.value)}),
    h("label",{className:"flabel"},"СУММА ЦЕЛИ (СУМ)"),
    h("input",{className:"finput",style:{marginBottom:14},inputMode:"numeric",placeholder:"0",
      value:target,onChange:e=>setTarget(e.target.value)}),
    h("label",{className:"flabel"},"СРОК"),
    h("div",{style:{display:"flex",gap:6,marginBottom:14}},
      [3,6,12].map(d=>h("div",{key:d,onClick:()=>{setDuration(d);setUseCustom(false);},
        style:{flex:1,padding:"11px 4px",borderRadius:12,textAlign:"center",cursor:"pointer",
          background:!useCustom&&duration===d?C.ink:C.bg,
          color:!useCustom&&duration===d?C.sur:C.ink,
          fontFamily:F,fontSize:13,fontWeight:700,transition:"all .12s"}},d+"мес")),
      h("div",{onClick:()=>setUseCustom(true),
        style:{flex:1,padding:"11px 4px",borderRadius:12,textAlign:"center",cursor:"pointer",
          background:useCustom?C.ink:C.bg,
          color:useCustom?C.sur:C.ink,
          fontFamily:F,fontSize:13,fontWeight:700,transition:"all .12s"}},"Своя")
    ),
    useCustom&&h("input",{className:"finput sm",style:{marginBottom:14},inputMode:"numeric",
      placeholder:"Количество месяцев",value:customDur,onChange:e=>setCustomDur(e.target.value)}),
    // Monthly preview
    monthly>0&&h("div",{style:{background:"#111318",borderRadius:16,padding:"14px 16px",marginBottom:20,display:"flex",justifyContent:"space-between",alignItems:"center"}},
      h("div",{style:{fontFamily:F,fontSize:11,fontWeight:700,color:"rgba(255,255,255,0.45)",letterSpacing:1,textTransform:"uppercase"}},"В МЕСЯЦ"),
      h("div",{style:{fontFamily:F,fontSize:20,fontWeight:800,color:"#F59E0B"}},compactFmt(monthly)+" сум")
    ),
    h("div",{style:{display:"flex",gap:10}},
      h("div",{className:"btn btn-gray",style:{flex:1},onClick:onClose},"Отмена"),
      h("div",{className:"btn btn-ink",style:{flex:2},onClick:()=>{
        if(!name.trim()||!target)return;
        onSubmit({emoji,name:name.trim(),target,duration:dur});
      }},"Создать цель")
    )
  );
}

/* ── PROFILE ── */
/* ── BUDGET PLAN SCREEN ── */
function BudgetSplitterScreen({data, onBack, initialTab}){
  const{txs}=data;
  const[tab,setTab]=useState(initialTab||"overview");
  const[days,setDays]=useState(()=>{
    try{const p=JSON.parse(localStorage.getItem("finly_budget_plan")||"null");return p?.days?String(p.days):"30";}catch{return "30";}
  });
  const[activated,setActivated]=useState(()=>!!localStorage.getItem("finly_budget_plan"));
  const[plan,setPlan]=useState(()=>{try{return JSON.parse(localStorage.getItem("finly_budget_plan")||"null");}catch{return null;}});

  // ── Shared calculations ──
  const deletedAccNames=(()=>{try{return new Set(JSON.parse(localStorage.getItem("finly_deleted_accounts")||"[]").map(a=>a.name));}catch{return new Set();}})();
  const activeTxs=txs.filter(t=>!t.account||!deletedAccNames.has(t.account));
  const customAccsInitial=(()=>{try{return JSON.parse(localStorage.getItem("finly_accounts")||"[]");}catch{return[];}})()
    .filter(a=>!deletedAccNames.has(a.name)).reduce((s,a)=>s+(a.initial||0),0);
  const income=activeTxs.filter(t=>t.type==="income").reduce((a,b)=>a+b.amount,0);
  const expense=activeTxs.filter(t=>t.type==="expense").reduce((a,b)=>a+b.amount,0);
  const savingsTotal=(data.savingsJars||[]).reduce((s,j)=>s+(j.balance||0),0);
  const balance=Math.max(0,income-expense+customAccsInitial+savingsTotal);

  const daysNum=Math.max(1,parseInt(days)||1);
  const daily=Math.floor(balance/daysNum);

  // ── Prediction calculations (all-time history) ──
  const allExp=activeTxs.filter(t=>t.type==="expense"&&t.dateStr);
  const sortedDates=[...new Set(allExp.map(t=>t.dateStr))].sort();
  const firstDate=sortedDates[0]||new Date().toISOString().slice(0,10);
  const activeDays=Math.max(1,sortedDates.length);
  const catHistMap={};
  allExp.forEach(t=>{
    const name=t.catName||"Прочее";
    if(!catHistMap[name]) catHistMap[name]={icon:t.catIcon||"💬",name,total:0};
    catHistMap[name].total+=t.amount;
  });
  const catHistRows=Object.values(catHistMap).sort((a,b)=>b.total-a.total).slice(0,8);

  // ── Excluded transactions (Вне бюджета) ──
  const excludedTxIds=new Set(JSON.parse(localStorage.getItem("budget_excluded_txs")||"[]"));
  const includedCatMap={};
  activeTxs.filter(t=>t.type==="expense"&&!excludedTxIds.has(t.id)).forEach(t=>{
    const name=t.catName||"Прочее";
    if(!includedCatMap[name]) includedCatMap[name]={icon:t.catIcon||"💬",name,total:0};
    includedCatMap[name].total+=t.amount;
  });
  const includedCatRows=Object.values(includedCatMap).sort((a,b)=>b.total-a.total).slice(0,8);
  const includedActiveDays=new Set(activeTxs.filter(t=>t.type==="expense"&&!excludedTxIds.has(t.id)).map(t=>t.dateStr)).size||1;
  const excludedAmount=activeTxs.filter(t=>t.type==="expense"&&excludedTxIds.has(t.id)).reduce((s,t)=>s+t.amount,0);

  // Prediction for the active plan period (or chosen days in settings)
  const predDays=plan?.days||daysNum;
  const predictRows=includedCatRows.map(r=>({...r,predicted:Math.round(r.total/includedActiveDays*predDays)}));
  const totalPredicted=predictRows.reduce((s,r)=>s+r.predicted,0);

  // ── Activate / Deactivate ──
  async function activate(){
    const newPlan={daily,days:daysNum,activatedAt:new Date().toISOString()};
    localStorage.setItem("finly_budget_plan",JSON.stringify(newPlan));
    setActivated(true); setPlan(newPlan);
    try{await fetch(API_URL+"/api/budget_plan",{method:"POST",headers:{"Content-Type":"application/json","X-Init-Data":window.Telegram?.WebApp?.initData||""},body:JSON.stringify({active:true,days:daysNum,daily})});}catch{}
    setTab("overview");
  }
  async function deactivate(){
    localStorage.removeItem("finly_budget_plan");
    setActivated(false); setPlan(null);
    try{await fetch(API_URL+"/api/budget_plan",{method:"POST",headers:{"Content-Type":"application/json","X-Init-Data":window.Telegram?.WebApp?.initData||""},body:JSON.stringify({active:false})});}catch{}
  }

  // ── Shared header ──
  const Header=()=>h("div",{style:{flexShrink:0}},
    h("div",{style:{display:"flex",alignItems:"center",padding:"12px 16px 0",gap:12}},
      h("div",{onClick:onBack,style:{width:36,height:36,borderRadius:12,background:C.card,border:"1px solid "+C.bdr,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",fontSize:18}},"←"),
      h("div",{style:{flex:1}},
        h("div",{style:{fontFamily:F,fontSize:22,fontWeight:800,color:C.ink}},"Бюджет"),
        activated&&plan&&h("div",{style:{fontSize:11,color:C.gr,fontWeight:700}},"● Активен · "+fmt(plan.daily)+" сум/день")
      ),
      activated&&h("div",{onClick:deactivate,style:{fontSize:11,fontWeight:700,color:C.rd,cursor:"pointer",padding:"6px 10px",background:C.rdBg,borderRadius:20}},"Отключить")
    ),
    // Tab bar
    h("div",{style:{display:"flex",gap:4,padding:"10px 16px 0"}},
      [["overview","📊 Обзор"],["forecast","🔮 Прогноз"],["settings","⚙ Настройки"]].map(([id,label])=>
        h("div",{key:id,onClick:()=>setTab(id),
          style:{flex:1,padding:"10px 4px",borderRadius:12,textAlign:"center",cursor:"pointer",
            fontFamily:F,fontSize:11,fontWeight:700,transition:"all .15s",
            background:tab===id?C.ink:C.card,color:tab===id?C.sur:C.ink2,
            border:"1.5px solid "+(tab===id?C.ink:C.bdr)}},label)
      )
    )
  );

  // ── TAB: OVERVIEW ──
  const TabOverview=()=>{
    if(!activated||!plan) return h("div",{style:{padding:"24px 16px",textAlign:"center"}},
      h("div",{style:{fontSize:48,marginBottom:12}},"💡"),
      h("div",{style:{fontFamily:F,fontSize:20,fontWeight:800,color:C.ink,marginBottom:8}},"Нет активного плана"),
      h("div",{style:{fontSize:14,color:C.ink3,marginBottom:24,lineHeight:1.6}},"Настройте бюджет и Finly будет отслеживать ваши траты каждый день"),
      h("div",{onClick:()=>setTab("settings"),className:"btn btn-ink",style:{display:"inline-block",padding:"14px 32px",borderRadius:16,fontFamily:F,fontSize:15,fontWeight:800,cursor:"pointer"}},"Создать план")
    );

    const now=new Date();
    const todayStr=now.toISOString().slice(0,10);
    const weekStart=new Date(now.getFullYear(),now.getMonth(),now.getDate()-now.getDay()||7);
    const weekStartStr=weekStart.toISOString().slice(0,10);
    const monthStartStr=now.toISOString().slice(0,8)+"01";

    const todayExp=activeTxs.filter(t=>t.type==="expense"&&t.dateStr===todayStr).reduce((s,t)=>s+t.amount,0);
    const weekExp=activeTxs.filter(t=>t.type==="expense"&&t.dateStr>=weekStartStr).reduce((s,t)=>s+t.amount,0);
    const monthExp=activeTxs.filter(t=>t.type==="expense"&&t.dateStr>=monthStartStr).reduce((s,t)=>s+t.amount,0);

    const weekLimit=plan.daily*7;
    const monthLimit=plan.daily*30;

    const daysElapsed=plan.activatedAt?Math.floor((Date.now()-new Date(plan.activatedAt).getTime())/(86400000)):0;
    const daysLeft=Math.max(0,(plan.days||30)-daysElapsed);

    function ProgressBar({spent,limit,label}){
      const pct=limit>0?Math.min(Math.round(spent/limit*100),100):0;
      const over=spent>limit;
      return h("div",{style:{marginBottom:16}},
        h("div",{style:{display:"flex",justifyContent:"space-between",marginBottom:6}},
          h("div",{style:{fontSize:13,fontWeight:600,color:C.ink}},label),
          h("div",{style:{fontFamily:F,fontSize:13,fontWeight:700,color:over?C.rd:C.ink2}},fmt(spent)+" / "+fmt(limit))
        ),
        h("div",{style:{height:8,borderRadius:8,background:C.bdr,overflow:"hidden"}},
          h("div",{style:{height:"100%",borderRadius:8,background:over?C.rd:pct>=80?"#F59E0B":C.gr,width:pct+"%",transition:"width .5s"}})),
        h("div",{style:{display:"flex",justifyContent:"space-between",marginTop:4}},
          h("div",{style:{fontSize:10,color:over?C.rd:C.ink3,fontWeight:600}},over?"Перерасход: "+fmt(spent-limit)+" сум":"Осталось: "+fmt(Math.max(0,limit-spent))+" сум"),
          h("div",{style:{fontSize:10,color:C.ink3}},pct+"%")
        )
      );
    }

    // ── Smart categorization: essential vs discretionary ──
    const ESSENTIAL_KEYWORDS=["аренда","жильё","коммунал","продукты","транспорт","здоровье","связь","интернет","лекарство","аптека","ипотека","rent","utility","groceries","transport","health","медицин"];
    const isEssential=name=>ESSENTIAL_KEYWORDS.some(kw=>name.toLowerCase().includes(kw));
    // Excluded transactions (marked as "Вне бюджета")
    const excludedTxIds=new Set(JSON.parse(localStorage.getItem("budget_excluded_txs")||"[]"));
    const includedActiveTxs=activeTxs.filter(t=>!excludedTxIds.has(t.id));
    // Recalculate catHistRows excluding marked transactions
    const includedCatMap={};
    includedActiveTxs.filter(t=>t.type==="expense").forEach(t=>{
      const k=t.catName||"Прочее";
      if(!includedCatMap[k]) includedCatMap[k]={name:k,total:0};
      includedCatMap[k].total+=t.amount;
    });
    const includedCatRows=Object.values(includedCatMap).sort((a,b)=>b.total-a.total);
    const includedActiveDays=new Set(includedActiveTxs.filter(t=>t.type==="expense").map(t=>t.dateStr)).size||1;
    // Monthly avg spend by category (from all history, scaled to 30 days)
    const essentialDailyAvg=includedCatRows.filter(r=>isEssential(r.name)).reduce((s,r)=>s+r.total/includedActiveDays,0);
    const discretionaryDailyAvg=includedCatRows.filter(r=>!isEssential(r.name)).reduce((s,r)=>s+r.total/includedActiveDays,0);
    const freeBudget=Math.max(0,plan.daily-essentialDailyAvg);
    const excludedAmount=activeTxs.filter(t=>t.type==="expense"&&excludedTxIds.has(t.id)).reduce((s,t)=>s+t.amount,0);

    return h("div",{style:{padding:"16px 16px 24px"}},
      // Status hero
      h("div",{style:{background:C.ink,borderRadius:20,padding:"18px 20px",marginBottom:12,display:"flex",gap:16}},
        h("div",{style:{flex:1}},
          h("div",{style:{fontSize:10,color:"rgba(255,255,255,.5)",fontWeight:700,letterSpacing:2,textTransform:"uppercase",marginBottom:4}},"ЛИМИТ В ДЕНЬ"),
          h("div",{style:{fontFamily:F,fontSize:28,fontWeight:800,color:C.sur}},fmt(plan.daily)),
          h("div",{style:{fontSize:11,color:"rgba(255,255,255,.4)"}},"сум")
        ),
        h("div",{style:{textAlign:"right"}},
          h("div",{style:{fontSize:10,color:"rgba(255,255,255,.5)",fontWeight:700,letterSpacing:2,textTransform:"uppercase",marginBottom:4}},"ОСТАЛОСЬ"),
          h("div",{style:{fontFamily:F,fontSize:28,fontWeight:800,color:daysLeft<=3?"#F87171":"#4ADE80"}},daysLeft),
          h("div",{style:{fontSize:11,color:"rgba(255,255,255,.4)"}},"дней")
        )
      ),
      // Smart budget split (essential vs free)
      essentialDailyAvg>0&&h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:excludedAmount>0?8:12}},
        h("div",{style:{background:"rgba(220,38,38,.06)",border:"1px solid rgba(220,38,38,.15)",borderRadius:16,padding:"12px 14px"}},
          h("div",{style:{fontSize:9,fontWeight:700,color:C.rd,letterSpacing:1.5,textTransform:"uppercase",marginBottom:4}},"ОБЯЗАТЕЛЬНЫЕ"),
          h("div",{style:{fontFamily:F,fontSize:17,fontWeight:800,color:C.rd}},fmt(Math.round(essentialDailyAvg))),
          h("div",{style:{fontSize:10,color:C.ink3,marginTop:2}},"сум/день · аренда, еда…")
        ),
        h("div",{style:{background:"rgba(74,222,128,.06)",border:"1px solid rgba(74,222,128,.15)",borderRadius:16,padding:"12px 14px"}},
          h("div",{style:{fontSize:9,fontWeight:700,color:C.gr,letterSpacing:1.5,textTransform:"uppercase",marginBottom:4}},"СВОБОДНЫЕ"),
          h("div",{style:{fontFamily:F,fontSize:17,fontWeight:800,color:freeBudget>0?C.gr:C.rd}},fmt(Math.round(freeBudget))),
          h("div",{style:{fontSize:10,color:C.ink3,marginTop:2}},"сум/день · на всё остальное")
        )
      ),
      excludedAmount>0&&h("div",{style:{background:"rgba(168,85,247,.06)",border:"1px solid rgba(168,85,247,.15)",borderRadius:16,padding:"10px 12px",marginBottom:12,display:"flex",alignItems:"center",gap:8,justifyContent:"space-between"}},
        h("div",null,
          h("div",{style:{fontSize:9,fontWeight:700,color:"#a855f7",letterSpacing:1.5,textTransform:"uppercase"}},"ВНЕ БЮДЖЕТА"),
          h("div",{style:{fontFamily:F,fontSize:14,fontWeight:800,color:"#a855f7",marginTop:2}},fmt(excludedAmount)+" сум")
        ),
        h("button",{onClick:()=>{localStorage.setItem("budget_excluded_txs","[]");setData(d=>({...d}));},style:{fontSize:11,fontWeight:700,color:"#a855f7",background:"rgba(168,85,247,.1)",border:"1px solid rgba(168,85,247,.2)",borderRadius:8,padding:"6px 10px",cursor:"pointer"}},"Включить обратно")
      ),
      // Progress section
      h("div",{className:"card",style:{padding:"16px 18px",marginBottom:12}},
        h("div",{style:{fontSize:12,fontWeight:700,color:C.ink3,letterSpacing:1.5,textTransform:"uppercase",marginBottom:14}},"ПРОГРЕСС"),
        h(ProgressBar,{spent:todayExp,limit:plan.daily,label:"Сегодня"}),
        h(ProgressBar,{spent:weekExp,limit:weekLimit,label:"Эта неделя"}),
        h(ProgressBar,{spent:monthExp,limit:monthLimit,label:"Этот месяц"})
      ),
      // Today's breakdown by category
      (()=>{
        const todayTxs=activeTxs.filter(t=>t.type==="expense"&&t.dateStr===todayStr);
        const todayCatMap={};
        todayTxs.forEach(t=>{
          const k=t.catName||"Прочее";
          if(!todayCatMap[k]) todayCatMap[k]={icon:t.catIcon||"💬",name:k,total:0,essential:isEssential(t.catName||""),txs:[]};
          todayCatMap[k].total+=t.amount;
          todayCatMap[k].txs.push(t);
        });
        const rows=Object.values(todayCatMap).sort((a,b)=>b.total-a.total);
        if(!rows.length) return null;
        return h("div",{className:"card",style:{padding:"16px 18px",marginBottom:12}},
          h("div",{style:{fontSize:12,fontWeight:700,color:C.ink3,letterSpacing:1.5,textTransform:"uppercase",marginBottom:12}},"СЕГОДНЯ ПО КАТЕГОРИЯМ"),
          rows.map(r=>h("div",{key:r.name,style:{marginBottom:10}},
            h("div",{style:{display:"flex",alignItems:"center",gap:10,marginBottom:6}},
              h("div",{style:{fontSize:18,width:26,textAlign:"center",flexShrink:0}},r.icon),
              h("div",{style:{flex:1,fontSize:13,fontWeight:600,color:C.ink}},r.name),
              r.essential&&h("div",{style:{fontSize:9,fontWeight:700,color:C.rd,background:"rgba(220,38,38,.08)",padding:"2px 6px",borderRadius:6,flexShrink:0}},"обяз."),
              h("div",{style:{fontFamily:F,fontSize:13,fontWeight:700,color:C.ink2}},fmt(r.total)+" сум")
            ),
            r.txs.length>1&&h("div",{style:{fontSize:10,color:C.ink3,paddingLeft:36}},r.txs.length+" транзакций"),
            r.txs.length===1&&h("div",{style:{fontSize:10,color:C.ink3,paddingLeft:36,display:"flex",alignItems:"center",justifyContent:"space-between"}},
              r.txs[0].note||"—",
              h("button",{onClick:()=>{const ex=new Set(JSON.parse(localStorage.getItem("budget_excluded_txs")||"[]"));ex.add(r.txs[0].id);localStorage.setItem("budget_excluded_txs",JSON.stringify([...ex]));setData(d=>({...d}));},style:{fontSize:9,fontWeight:600,color:"#a855f7",background:"rgba(168,85,247,.1)",border:"1px solid rgba(168,85,247,.2)",borderRadius:6,padding:"2px 6px",cursor:"pointer",whiteSpace:"nowrap"}},"✕ Вне бюджета")
            )
          ))
        );
      })(),
      h("div",{onClick:()=>setTab("settings"),style:{textAlign:"center",fontSize:13,fontWeight:600,color:C.ink3,cursor:"pointer",paddingTop:4}},"Изменить план →")
    );
  };

  // ── TAB: FORECAST ──
  const TabForecast=()=>{
    const hasHistory=catHistRows.length>0;
    if(!hasHistory) return h("div",{style:{padding:"40px 16px",textAlign:"center"}},
      h("div",{style:{fontSize:48,marginBottom:12}},"📊"),
      h("div",{style:{fontSize:14,color:C.ink3}},"Недостаточно данных для прогноза. Добавьте записи расходов.")
    );
    const fromDate=new Date(firstDate).toLocaleDateString("ru-RU",{month:"long",year:"numeric"});
    return h("div",{style:{padding:"16px 16px 24px"}},
      h("div",{style:{fontSize:12,fontWeight:700,color:C.ink3,marginBottom:16,lineHeight:1.6}},
        "Прогноз на "+predDays+" дней · на основе "+activeDays+" дней записей (с "+fromDate+")"),
      h("div",{className:"card",style:{padding:"16px 18px"}},
        ...predictRows.map((r,i)=>{
          const maxP=predictRows[0].predicted||1;
          return h("div",{key:r.name,style:{display:"flex",alignItems:"center",gap:12,marginBottom:i<predictRows.length-1?14:0}},
            h("div",{style:{fontSize:18,width:28,textAlign:"center",flexShrink:0}},r.icon),
            h("div",{style:{flex:1,minWidth:0}},
              h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:5}},
                h("div",{style:{fontSize:14,fontWeight:600,color:C.ink,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},r.name),
                h("div",{style:{fontFamily:F,fontSize:14,fontWeight:700,color:C.ink,flexShrink:0,marginLeft:8}},fmt(r.predicted)+" сум")
              ),
              h("div",{style:{height:5,borderRadius:5,background:C.bdr,overflow:"hidden"}},
                h("div",{style:{height:"100%",borderRadius:5,background:"#6366F1",width:Math.round(r.predicted/maxP*100)+"%",transition:"width .4s"}}))
            )
          );
        }),
        // Total row
        h("div",{style:{marginTop:16,paddingTop:14,borderTop:"2px solid "+C.bdr,display:"flex",justifyContent:"space-between",alignItems:"center"}},
          h("div",null,
            h("div",{style:{fontFamily:F,fontSize:15,fontWeight:800,color:C.ink}},"Итого на "+predDays+" дней"),
            h("div",{style:{fontSize:12,color:totalPredicted>balance?C.rd:C.gr,fontWeight:600,marginTop:2}},
              totalPredicted>balance?"⚠️ Может превысить баланс":"✓ Вписывается в баланс")
          ),
          h("div",{style:{textAlign:"right"}},
            h("div",{style:{fontFamily:F,fontSize:22,fontWeight:800,color:totalPredicted>balance?C.rd:"#6366F1"}},fmt(totalPredicted)),
            h("div",{style:{fontSize:11,color:C.ink3}},"сум")
          )
        )
      )
    );

function EditProfileScreen({displayName,setDisplayName,nickname,setNickname,onBack,API_URL,rankVisible,setRankVisible,setData}){
  const[nameVal,setNameVal]=useState(displayName||"");
  const[nickVal,setNickVal]=useState(nickname||"");
  const[nickError,setNickError]=useState("");
  const[saving,setSaving]=useState(false);
  const[saved,setSaved]=useState(false);
  const[localRank,setLocalRank]=useState(rankVisible||"everyone");

  async function save(){
    if(saving)return;
    setSaving(true);setNickError("");
    const n=nameVal.trim();
    if(n){setDisplayName(n);localStorage.setItem("finly_display_name",n);}
    if(nickVal.trim()&&nickVal.trim()!==nickname){
      try{
        const r=await fetch(API_URL+"/api/user",{
          method:"PATCH",
          headers:{"Content-Type":"application/json","X-Init-Data":window.Telegram?.WebApp?.initData||""},
          body:JSON.stringify({nickname:nickVal.trim()})
        });
        if(r.status===409){setNickError("Этот никнейм уже занят, попробуй другой");setSaving(false);return;}
        if(r.ok){setNickname(nickVal.trim());localStorage.setItem("finly_nickname",nickVal.trim());}
        else{setNickError("Ошибка сохранения никнейма");setSaving(false);return;}
      }catch{setNickError("Ошибка сети, попробуй снова");setSaving(false);return;}
    }
    setSaving(false);setSaved(true);
    setTimeout(()=>onBack(),800);
  }

  return h("div",{className:"screen anim-fade"},
    h("div",{className:"ph"},
      h("div",{className:"back",onClick:onBack},"←"),
      h("div",{className:"ph-title"},"Редактировать профиль"),
      h("div",{className:"ph-action"})
    ),
    h("div",{className:"scroll",style:{padding:"0 16px"}},
      // Avatar preview
      h("div",{style:{display:"flex",alignItems:"center",gap:16,background:C.card,borderRadius:20,padding:"18px 16px",marginBottom:20,border:"1px solid "+C.bdr}},
        h("div",{style:{width:60,height:60,borderRadius:18,background:C.ink,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:F,fontSize:26,fontWeight:800,color:C.bg,flexShrink:0}},
          (nameVal.trim()||(displayName||"А"))[0].toUpperCase()),
        h("div",null,
          h("div",{style:{fontFamily:F,fontSize:17,fontWeight:800,color:C.ink}},nameVal.trim()||displayName||"—"),
          h("div",{style:{fontSize:13,color:C.ink3,marginTop:3}},nickVal.trim()?"@"+nickVal.trim():nickname?"@"+nickname:"никнейм не задан")
        )
      ),

      h("label",{className:"flabel"},"ОТОБРАЖАЕМОЕ ИМЯ"),
      h("input",{className:"finput",style:{marginBottom:20},
        placeholder:"Как тебя называть?",
        value:nameVal,onChange:e=>setNameVal(e.target.value)}),

      h("label",{className:"flabel"},"НИКНЕЙМ"),
      h("div",{style:{fontSize:12,color:C.ink3,marginBottom:8,lineHeight:1.5}},
        "Используется в рейтинге, долгах и у друзей. Только латиница, цифры, _"),
      h("div",{style:{position:"relative",marginBottom:4}},
        h("span",{style:{position:"absolute",left:14,top:"50%",transform:"translateY(-50%)",color:C.ink2,fontFamily:F,fontSize:15,fontWeight:700,zIndex:1}},"@"),
        h("input",{className:"finput",style:{marginBottom:0,paddingLeft:34},
          placeholder:"your_nickname",
          value:nickVal,
          onChange:e=>setNickVal(e.target.value.replace(/[^a-z0-9_]/gi,"").toLowerCase().slice(0,32))})
      ),
      !nickname&&!nickVal&&h("div",{style:{fontSize:11,color:C.am,marginTop:6,marginBottom:4,display:"flex",alignItems:"center",gap:6}},
        h("span",null,"💡"),"Никнейм нужен для рейтинга, долгов и друзей"),
      nickError&&h("div",{style:{fontSize:12,color:C.rd,marginTop:6,marginBottom:4,fontWeight:600}},nickError),

      h("div",{style:{height:20}}),
      h("label",{className:"flabel"},"ЯЗЫК ПРИЛОЖЕНИЯ"),
      h("div",{style:{display:"flex",gap:8,marginBottom:16}},
        [
          {code:"ru",name:"Русский",flag:"🇷🇺"},
          {code:"uz",name:"O'zbek",flag:"🇺🇿"},
          {code:"en",name:"English",flag:"🇬🇧"},
        ].map(({code,name,flag})=>h("div",{key:code,
          onClick:()=>setLang(code),
          style:{flex:1,padding:"12px 6px",borderRadius:14,textAlign:"center",cursor:"pointer",
            border:"1.5px solid "+(_FINLY_LANG===code?C.ink:C.bdr),
            background:_FINLY_LANG===code?C.ink:C.card,transition:"all .12s"}},
          h("div",{style:{fontSize:20,marginBottom:4}},flag),
          h("div",{style:{fontSize:11,fontWeight:700,color:_FINLY_LANG===code?C.sur:C.ink}},name)
        ))
      ),

      h("div",{style:{height:28}}),
      h("div",{className:"btn btn-ink",style:{width:"100%",opacity:saving?0.6:1},onClick:save},
        saved?"✓ Сохранено!":saving?"Сохраняем...":"Сохранить"),

      h("div",{style:{height:32}})

/* ── Feedback modal — anonymous to user, attributed in admin ── */
function FeedbackPage({onClose,source}){
  const[rating,setRating]=useState(0);
  const[hover,setHover]=useState(0);
  const[text,setText]=useState("");
  const[sending,setSending]=useState(false);
  const[sent,setSent]=useState(false);
  const[xpEarned,setXpEarned]=useState(0);
  async function submit(){
    if((!text.trim()&&!rating)||sending)return;
    setSending(true);
    try{
      const res=await fetch(API_URL+"/api/feedback",{method:"POST",
        headers:{"Content-Type":"application/json","X-Init-Data":window.Telegram?.WebApp?.initData||""},
        body:JSON.stringify({text:text.trim(),rating:rating||undefined,source:source||undefined})});
      const d=await res.json().catch(()=>({}));
      setXpEarned(d.xp||50);
      setSent(true);
    }catch(e){showToast({icon:"⚠️",title:"Ошибка",sub:"Не удалось отправить"});}
    setSending(false);
  }
  return h("div",{style:{position:"fixed",inset:0,zIndex:500,background:C.bg,display:"flex",flexDirection:"column",animation:"fadeIn .18s ease"}},
    // Header
    h("div",{style:{display:"flex",alignItems:"center",padding:"16px 20px 12px",borderBottom:"1px solid "+C.bdr}},
      h("div",{onClick:onClose,style:{width:36,height:36,borderRadius:10,background:C.sur,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,cursor:"pointer",color:C.ink3}},"←"),
      h("div",{style:{fontFamily:F,fontSize:17,fontWeight:800,color:C.ink,marginLeft:14}},"Оставить отзыв"),
    ),
    sent
      ? h("div",{style:{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"40px 32px",textAlign:"center"}},
          h("div",{style:{fontSize:64,marginBottom:16}},"💜"),
          h("div",{style:{fontFamily:F,fontSize:22,fontWeight:800,color:C.ink,marginBottom:8}},"Спасибо!"),
          h("div",{style:{fontSize:14,color:C.ink2,lineHeight:1.6,marginBottom:24}},"Мы читаем каждое сообщение и делаем Finly лучше для вас"),
          xpEarned>0&&h("div",{style:{background:C.amBg,border:"1.5px solid "+C.am,borderRadius:14,padding:"12px 20px",display:"flex",alignItems:"center",gap:10,marginBottom:24}},
            h("div",{style:{fontSize:22}},"⚡"),
            h("div",null,
              h("div",{style:{fontFamily:F,fontSize:16,fontWeight:800,color:C.am}},"+"+xpEarned+" XP"),
              h("div",{style:{fontSize:11,color:C.ink3}},"за отзыв")
            )
          ),
          h("div",{onClick:onClose,className:"btn btn-ink",style:{padding:"14px 32px",borderRadius:14,cursor:"pointer"}},"Готово")
        )
      : h("div",{style:{flex:1,overflowY:"auto",padding:"24px 20px"}},
          // Star rating
          h("div",{style:{marginBottom:28}},
            h("div",{style:{fontSize:13,fontWeight:700,color:C.ink2,letterSpacing:.5,textTransform:"uppercase",marginBottom:12}},"Оценка"),
            h("div",{style:{display:"flex",gap:8}},
              [1,2,3,4,5].map(s=>
                h("div",{key:s,
                  onMouseEnter:()=>setHover(s),
                  onMouseLeave:()=>setHover(0),
                  onClick:()=>setRating(s===rating?0:s),
                  style:{fontSize:36,cursor:"pointer",transition:"transform .1s",transform:(hover||rating)>=s?"scale(1.18)":"scale(1)",
                    filter:(hover||rating)>=s?"none":"grayscale(1) opacity(.35)"}},
                  "⭐")
              )
            ),
            rating>0&&h("div",{style:{fontSize:12,color:C.ink3,marginTop:8}},[
              "","Плохо","Так себе","Нормально","Хорошо","Отлично!"
            ][rating])
          ),
          // Text
          h("div",{style:{marginBottom:20}},
            h("div",{style:{fontSize:13,fontWeight:700,color:C.ink2,letterSpacing:.5,textTransform:"uppercase",marginBottom:10}},"Комментарий"),
            h("div",{style:{fontSize:12,color:C.ink3,marginBottom:10,lineHeight:1.5}},"Что нравится, что бесит, что добавить? Честно — это анонимно."),
            h("textarea",{className:"finput",style:{width:"100%",minHeight:130,resize:"none",fontSize:15,lineHeight:1.6,marginBottom:0},
              placeholder:"Ваш отзыв...",value:text,maxLength:2000,
              onChange:e=>setText(e.target.value)})
          ),
          h("div",{style:{background:C.sur,borderRadius:14,padding:"12px 14px",display:"flex",gap:10,alignItems:"center",marginBottom:24}},
            h("div",{style:{fontSize:18}},"🎁"),
            h("div",{style:{fontSize:12,color:C.ink2,lineHeight:1.4}},"За отзыв вы получите ",h("b",{style:{color:C.am}},source==="blast"?"+100 XP":"+50 XP"))
          ),
          h("div",{onClick:submit,className:"btn btn-ink",style:{width:"100%",padding:"15px",borderRadius:14,cursor:"pointer",fontSize:15,fontWeight:700,opacity:(rating>0||text.trim())&&!sending?1:0.4}},
            sending?"Отправка...":"Отправить отзыв")
        )
  );
}

/* ── ONBOARDING WIZARD — one bulletproof flow: slides → nickname → balance ──
   Stays inline (never navigates away, so Telegram initData survives).
   Nickname PATCHes the user; balance creates a real server-side income tx
   "💰 Начальный баланс" so it persists across devices and shows in admin. */
function OnboardingScreen({isNew, onDone}){
  // phase: "slides" | "nickname" | "balance"
  const[phase,setPhase]=useState("slides");
  const[step,setStep]=useState(0);
  const slides=[
    {icon:"💰",title:"Finly — твои деньги",sub:"Записывай доходы и расходы. Понимай, куда уходят деньги. Всё в одном месте."},
    {icon:"🔥",title:"Серии и XP",sub:"Веди записи каждый день — копи серию. Зарабатывай XP и поднимайся в рейтинге."},
    {icon:"🎯",title:"Цели и бюджет",sub:"Ставь цели, следи за бюджетом. Finly напомнит, когда тратишь больше обычного."},
    {icon:"⚡",title:"Быстрый ввод",sub:"FinlyFast — запиши расход за 2 секунды прямо с виджета iPhone."},
  ];

  // ── Nickname state ──
  const[nick,setNick]=useState("");
  const[nickErr,setNickErr]=useState("");
  const[nickSaving,setNickSaving]=useState(false);

  // ── Balance state ──
  const[bal,setBal]=useState("");
  const[balSaving,setBalSaving]=useState(false);

  const initData=()=>window.Telegram?.WebApp?.initData||"";

  async function saveNickname(){
    const v=nick.trim().toLowerCase().replace(/[^a-z0-9_]/g,"");
    if(v.length<2){setNickErr("Минимум 2 символа");return;}
    setNickSaving(true);setNickErr("");
    try{
      const r=await fetch(API_URL+"/api/user",{
        method:"PATCH",
        headers:{"Content-Type":"application/json","X-Init-Data":initData()},
        body:JSON.stringify({nickname:v})
      });
      if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.detail||"Имя занято");}
      setPhase("balance");
    }catch(e){setNickErr(e.message||"Имя занято, попробуйте другое");}
    setNickSaving(false);
  }

  async function saveBalance(skip){
    const amt=skip?0:(parseInt((bal||"").replace(/\D/g,""))||0);
    setBalSaving(true);
    try{
      if(amt>0){
        // Create a real income transaction so the balance persists server-side
        const now=new Date();
        const ds=now.toISOString().slice(0,10);
        const ts=now.toTimeString().slice(0,5);
        await fetch(API_URL+"/api/transactions",{
          method:"POST",
          headers:{"Content-Type":"application/json","X-Init-Data":initData()},
          body:JSON.stringify({type:"income",cat_icon:"💰",cat_name:"Начальный баланс",
            note:"Стартовый баланс при регистрации",amount:amt,date_str:ds,time_str:ts,
            currency:"UZS",account:"Наличка"})
        });
      }
    }catch(e){console.error("balance setup failed",e);}
    try{localStorage.setItem('finly_onboarding_done','1');}catch{}
    setBalSaving(false);
    onDone(); // reloads app
  }

  // ── RENDER: info slides (dark) ──
  if(phase==="slides"){
    const slide=slides[step];
    const last=step===slides.length-1;
    return h("div",{id:"app",style:{display:"flex",flexDirection:"column",height:"100%",background:"#0C0D0F",overflow:"hidden"}},
      h("div",{style:{display:"flex",justifyContent:"center",gap:6,padding:"52px 0 0"}},
        slides.map((_,i)=>h("div",{key:i,style:{width:i===step?20:6,height:6,borderRadius:3,transition:"all .3s",background:i===step?"#7C3AED":"rgba(255,255,255,0.2)"}}))
      ),
      h("div",{style:{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"0 32px",textAlign:"center"}},
        h("div",{key:step,style:{animation:"fadeIn .3s ease",display:"flex",flexDirection:"column",alignItems:"center",gap:24}},
          h("div",{style:{fontSize:72,lineHeight:1}},slide.icon),
          h("div",{style:{fontFamily:"'Space Grotesk',sans-serif",fontSize:26,fontWeight:800,color:"#fff",lineHeight:1.2,letterSpacing:-0.5}},slide.title),
          h("div",{style:{fontSize:15,color:"rgba(255,255,255,0.55)",lineHeight:1.6,maxWidth:280}},slide.sub)
        )
      ),
      h("div",{style:{padding:"0 24px 48px",display:"flex",flexDirection:"column",gap:12}},
        h("div",{onClick:()=>{ if(last){setPhase("nickname");} else setStep(s=>s+1); },
          style:{background:"linear-gradient(135deg,#8B5CF6,#6D28D9)",color:"#fff",borderRadius:16,padding:"16px",textAlign:"center",fontFamily:"'Space Grotesk',sans-serif",fontSize:14,fontWeight:800,letterSpacing:1,textTransform:"uppercase",cursor:"pointer",boxShadow:"0 8px 24px rgba(109,40,217,0.4)"}},
          last?"Продолжить":"Далее →"),
        !last&&h("div",{onClick:()=>setPhase("nickname"),style:{textAlign:"center",fontSize:13,color:"rgba(255,255,255,0.35)",cursor:"pointer",padding:"4px 0"}},"Пропустить")
      )
    );
  }

  // ── RENDER: nickname (light) ──
  if(phase==="nickname"){
    return h("div",{id:"app",style:{display:"flex",flexDirection:"column",height:"100%",background:"#F4F5F7",overflow:"hidden"}},
      h("div",{style:{display:"flex",justifyContent:"center",gap:6,padding:"52px 0 0"}},
        [0,1].map(i=>h("div",{key:i,style:{width:i===0?20:6,height:6,borderRadius:3,background:i===0?"#7C3AED":"#D1D5DB"}}))
      ),
      h("div",{style:{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"0 24px"}},
        h("div",{style:{fontSize:48,marginBottom:16}},"✏️"),
        h("div",{style:{fontFamily:"'Space Grotesk',sans-serif",fontSize:22,fontWeight:800,color:"#111318",marginBottom:6,textAlign:"center"}},"Придумайте имя"),
        h("div",{style:{fontSize:14,color:"#8A8F9E",marginBottom:32,textAlign:"center",lineHeight:1.5,maxWidth:300}},"Это имя будут видеть друзья в рейтинге и совместных целях"),
        h("div",{style:{width:"100%",maxWidth:320}},
          h("div",{style:{position:"relative",marginBottom:8}},
            h("span",{style:{position:"absolute",left:14,top:"50%",transform:"translateY(-50%)",fontSize:15,color:"#8A8F9E",pointerEvents:"none"}},"@"),
            h("input",{className:"finput",style:{width:"100%",paddingLeft:30,fontSize:16,fontWeight:600},
              placeholder:"ваш_никнейм",value:nick,
              onChange:e=>{setNick(e.target.value.toLowerCase().replace(/[^a-z0-9_]/g,""));setNickErr("");},
              onKeyDown:e=>{if(e.key==="Enter")saveNickname();},autoFocus:true,maxLength:32})
          ),
          nickErr&&h("div",{style:{fontSize:12,color:"#EF4444",marginBottom:8,paddingLeft:4}},nickErr),
          h("div",{style:{fontSize:11,color:"#B0B7C3",marginBottom:20,paddingLeft:4}},"Только латиница, цифры и _ · не менее 2 символов"),
          h("div",{className:"btn btn-ink",style:{width:"100%",opacity:nickSaving?.6:1},onClick:saveNickname},nickSaving?"Сохранение...":"Далее →")
        )
      )
    );
  }

  // ── RENDER: starting balance (light) ──
  return h("div",{id:"app",style:{display:"flex",flexDirection:"column",height:"100%",background:"#F4F5F7",overflow:"hidden"}},
    h("div",{style:{display:"flex",justifyContent:"center",gap:6,padding:"52px 0 0"}},
      [0,1].map(i=>h("div",{key:i,style:{width:i===1?20:6,height:6,borderRadius:3,background:i===1?"#7C3AED":"#D1D5DB"}}))
    ),
    h("div",{style:{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"0 24px"}},
      h("div",{style:{fontSize:48,marginBottom:16}},"💰"),
      h("div",{style:{fontFamily:"'Space Grotesk',sans-serif",fontSize:22,fontWeight:800,color:"#111318",marginBottom:6,textAlign:"center"}},"Сколько у вас сейчас денег?"),
      h("div",{style:{fontSize:14,color:"#8A8F9E",marginBottom:32,textAlign:"center",lineHeight:1.5,maxWidth:300}},"Введите текущий баланс наличными и на картах. Это ваша стартовая точка — потом всё считается автоматически."),
      h("div",{style:{width:"100%",maxWidth:320}},
        h("div",{style:{position:"relative",marginBottom:8}},
          h("input",{className:"finput",inputMode:"numeric",style:{width:"100%",fontSize:24,fontWeight:800,fontFamily:"'Space Grotesk',sans-serif",textAlign:"center",paddingRight:54},
            placeholder:"0",value:bal,
            onChange:e=>{const raw=e.target.value.replace(/\D/g,"");setBal(raw?parseInt(raw).toLocaleString("ru-RU").replace(/,/g," "):"");},
            onKeyDown:e=>{if(e.key==="Enter")saveBalance(false);},autoFocus:true}),
          h("span",{style:{position:"absolute",right:16,top:"50%",transform:"translateY(-50%)",fontSize:14,color:"#8A8F9E",pointerEvents:"none",fontWeight:600}},"сум")
        ),
        h("div",{style:{fontSize:11,color:"#B0B7C3",marginBottom:20,paddingLeft:4,textAlign:"center"}},"Можно изменить в любой момент в разделе «Счета»"),
        h("div",{className:"btn btn-ink",style:{width:"100%",opacity:balSaving?.6:1,marginBottom:10},onClick:()=>saveBalance(false)},balSaving?"Сохранение...":"Готово · Начать 🎉"),
        h("div",{onClick:()=>!balSaving&&saveBalance(true),style:{textAlign:"center",fontSize:13,color:"#B0B7C3",cursor:"pointer",padding:"4px 0"}},"Пропустить — начать с нуля")
      )
    )
  );
}

/* ── Standalone nickname setup (legacy fallback, kept for safety) ── */

function NicknameSetupScreen({onDone}){
  const[nick,setNick]=useState("");
  const[saving,setSaving]=useState(false);
  const[err,setErr]=useState("");
  async function save(){
    const v=nick.trim().toLowerCase().replace(/[^a-z0-9_]/g,"");
    if(v.length<2){setErr("Минимум 2 символа");return;}
    setSaving(true);setErr("");
    try{
      await fetch(API_URL+"/api/user",{
        method:"PATCH",
        headers:{"Content-Type":"application/json","X-Init-Data":window.Telegram?.WebApp?.initData||""},
        body:JSON.stringify({nickname:v})
      }).then(r=>{if(!r.ok)return r.json().then(d=>{throw new Error(d.detail||"Ошибка");});return r.json();});
      onDone(v);
    }catch(e){setErr(e.message||"Имя занято, попробуйте другое");}
    setSaving(false);
  }
  return h("div",{id:"app",style:{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100%",padding:"0 24px",background:"#F4F5F7",gap:0}},
    h("div",{style:{fontSize:48,marginBottom:16}},"✏️"),
    h("div",{style:{fontFamily:"'Space Grotesk',sans-serif",fontSize:22,fontWeight:800,color:"#111318",marginBottom:6,textAlign:"center"}},"Придумайте имя"),
    h("div",{style:{fontSize:14,color:"#8A8F9E",marginBottom:32,textAlign:"center",lineHeight:1.5}},"Это имя будут видеть друзья в рейтинге и совместных целях"),
    h("div",{style:{width:"100%",maxWidth:320}},
      h("div",{style:{position:"relative",marginBottom:8}},
        h("span",{style:{position:"absolute",left:14,top:"50%",transform:"translateY(-50%)",fontSize:15,color:"#8A8F9E",pointerEvents:"none"}},"@"),
        h("input",{className:"finput",style:{width:"100%",paddingLeft:30,fontSize:16,fontWeight:600},
          placeholder:"ваш_никнейм",value:nick,
          onChange:e=>{setNick(e.target.value.toLowerCase().replace(/[^a-z0-9_]/g,""));setErr("");},
          onKeyDown:e=>{if(e.key==="Enter")save();},
          autoFocus:true,maxLength:32})
      ),
      err&&h("div",{style:{fontSize:12,color:"#EF4444",marginBottom:8,paddingLeft:4}},err),
      h("div",{style:{fontSize:11,color:"#B0B7C3",marginBottom:20,paddingLeft:4}},"Только латиница, цифры и _ · не менее 2 символов"),
      h("div",{className:"btn btn-ink",style:{width:"100%",opacity:saving?.6:1},onClick:save},saving?"Сохранение...":"Продолжить →")
    )
  );
}

/* ── APP ROOT ── */
function App(){
  const[loading,setLoading]=useState(true);
  const[error,setError]=useState(null);
  const[needsNickname,setNeedsNickname]=useState(false);
  const[showOnboarding,setShowOnboarding]=useState(false);
  const[isNewUser,setIsNewUser]=useState(false);
  const[authTick,setAuthTick]=useState(0);
  const[data,setData]=useState({
    txs:[],drafts:[],budgets:[],
    streak:0,xp:0,level:1,achievements:[],
    notifs:true,weekly:false,
    exp_cats:[...EXP_CATS],inc_cats:[...INC_CATS],
    xp_log:[],streak_record:0,last_log_date:null,
    personalGoals:[],personalDebts:[],savingsJars:[]
  });
  const[tab,setTab]=useState("home");
  const[toast,setToast]=useState(null);
  const[successInfo,setSuccessInfo]=useState(null);
  const[detailTx,setDetailTx]=useState(null);
  const[editTx,setEditTx]=useState(null);
  const[repeatPrefill,setRepeatPrefill]=useState(null);
  const[deepSection,setDeepSection]=useState(null);
  const[showFeedback,setShowFeedback]=useState(false);
  const[darkMode,setDarkMode]=useState(()=>{try{return localStorage.getItem("finly_dark")==="1";}catch{return false;}});
  const[alerts,setAlerts]=useState({friends:0,debts:0,goals:0,total:0});

  // Wire global toast
  useEffect(()=>{_setToast=setToast;return()=>{_setToast=null;};},[setToast]);

  // Apply color tokens and dark class on every render
  Object.assign(C,darkMode?C_DARK:C_LIGHT);
  useEffect(()=>{
    try{localStorage.setItem("finly_dark",darkMode?"1":"0");}catch{}
    const el=document.getElementById("app");
    if(el){el.classList.toggle("dark",darkMode);el.style.background=darkMode?"#111318":"#F4F5F7";}
    document.body.style.background=darkMode?"#111318":"#F4F5F7";
  },[darkMode]);

  // ── Fetch version from health endpoint (writes to global APP_VERSION) ──
  useEffect(()=>{
    fetch(API_URL+"/api/health").then(r=>r.ok?r.json():null).then(d=>{if(d&&d.version)APP_VERSION=d.version;}).catch(()=>{});
  },[]);

  // ── Bootstrap: load all data on open ──
  // authTick is incremented by the retry button to re-run this effect.
  useEffect(()=>{
    let cancelled=false;
    const doAuth=(attempt=0)=>{
      // Wait for Telegram SDK to be fully ready: need non-empty initData AND user id.
      // Guards against iOS where initData exists but isn't signed yet.
      const hasData=_getInitData()&&window.Telegram?.WebApp?.initDataUnsafe?.user?.id;
      if(!hasData){
        if(attempt<20){setTimeout(()=>{if(!cancelled)doAuth(attempt+1);},300);return;}
        // After 6 seconds of waiting, show a clear error — never call auth with empty data
        setError("Откройте Finly через кнопку в Telegram боте");
        setLoading(false);
        return;
      }
      API.auth()
        .then(res=>{
          if(cancelled)return;

          // SERVER-SIDE SIGNAL: needs_onboarding = user has no nickname yet.
          // This is authoritative — never trust localStorage alone.
          // Covers: new users, referral users created by bot, device switches.
          if(res.needs_onboarding){
            // Always clear stale local state so the new user gets a fresh start
            try{
              ['finly_onboarding_done','finly_accounts','finly_goals','finly_debts',
               'finly_display_name','finly_nickname','finly_default_account',
               'finly_currency','finly_hidden_accounts','finly_deleted_accounts',
               'finly_dark','finly_migration_nalichka'
              ].forEach(k=>localStorage.removeItem(k));
            }catch{}
            setIsNewUser(res.is_new);
            setShowOnboarding(true);
            setLoading(false);
            return;
          }
          // Existing user — mark onboarding done (handles new devices where localStorage is empty)
          try{localStorage.setItem('finly_onboarding_done','1');}catch{}
          setData(d=>({
            ...d,
            txs:          res.txs          || [],
            drafts:       res.drafts        || [],
            budgets:      res.budgets       || [],
            achievements: res.achievements  || [],
            exp_cats:     res.exp_cats      || EXP_CATS,
            inc_cats:     res.inc_cats      || INC_CATS,
            xp_log:       res.xp_log        || [],
            streak:       res.user.streak,
            streak_record:res.user.streak_record,
            xp:           res.user.xp,
            level:        res.user.level,
            notifs:       res.user.notifs,
            weekly:       res.user.weekly_report,
            last_log_date:res.user.last_log_date,
            rank_visible: res.user.rank_visible || "everyone",
            notif_overtake: res.user.notif_overtake!==false,
            ref_code:     res.user.ref_code || "",
            user:         res.user,
            balance:      res.balance!=null?res.balance:null,
          }));
          setLoading(false);
          // Deep-link: open specific tab from ?page= or Telegram start_param
          const deepPage=(new URLSearchParams(location.search).get("page"))||window.Telegram?.WebApp?.initDataUnsafe?.start_param||"";
          const VALID_TABS=["home","add","analytics","rewards","profile"];
          if(deepPage==="feedback"){setShowFeedback(true);}
          else if(deepPage==="cards"||deepPage.indexOf("cards")===0){setTab("profile");setDeepSection("bankcards");}
          else if(deepPage==="donate"){setTab("profile");setDeepSection("donate");}
          else if(VALID_TABS.includes(deepPage)){setTab(deepPage);}
          if(window.POSTHOG_READY&&res.user){
            phIdentify(res.user.id,{
              name: res.user.first_name||"",
              username: res.user.username||"",
              nickname: res.user.nickname||"",
              level: res.user.level||1,
              xp: res.user.xp||0,
              streak: res.user.streak||0,
            });
            track("app_opened",{level:res.user.level,xp:res.user.xp});
          }
          fetch(API_URL+"/api/alerts",{headers:{"X-Init-Data":_getInitData()}})
            .then(r=>r.ok?r.json():null).then(d=>{if(d)setAlerts(d);}).catch(()=>{});
          fetch(API_URL+"/api/personal_goals",{headers:{"X-Init-Data":_getInitData()}})
            .then(r=>r.ok?r.json():[]).then(d=>{setData(prev=>({...prev,personalGoals:d||[]}));}).catch(()=>{});
          fetch(API_URL+"/api/personal_debts",{headers:{"X-Init-Data":_getInitData()}})
            .then(r=>r.ok?r.json():[]).then(d=>{setData(prev=>({...prev,personalDebts:d||[]}));}).catch(()=>{});
          fetch(API_URL+"/api/savings",{headers:{"X-Init-Data":_getInitData()}})
            .then(r=>r.ok?r.json():[]).then(d=>{setData(prev=>({...prev,savingsJars:d||[]}));}).catch(()=>{});
          fetch(API_URL+"/api/bank_cards",{headers:{"X-Init-Data":_getInitData()}})
            .then(r=>r.ok?r.json():[]).then(d=>syncCardAccounts(d||[])).catch(()=>{});
        })
        .catch(e=>{
          if(cancelled)return;
          console.error("Auth failed (attempt "+attempt+"):",e);
          const is401=e.message&&e.message.includes("401");
          // On 401: Telegram initData invalid — usually a timing issue on iOS.
          // Retry aggressively (up to 8 times) with increasing delays.
          // Do NOT show error until all retries exhausted.
          const maxAttempts=is401?8:6;
          if(attempt<maxAttempts){setTimeout(()=>{if(!cancelled)doAuth(attempt+1);},800+attempt*300);return;}
          // After all retries, show user-friendly message
          const msg=is401
            ?"Откройте Finly через Telegram (нажмите кнопку в боте)"
            :(API_URL?e.message:null);
          setError(msg);
          setLoading(false);
        });
    };
    doAuth();
    return()=>{cancelled=true;};
  },[authTick]);

  useEffect(()=>{if(!toast)return;const id=setTimeout(()=>setToast(null),2800);return()=>clearTimeout(id);},[toast]);

  // ── Auto-refresh: keep data current while app is open ──
  useEffect(()=>{
    if(loading||error||showOnboarding||needsNickname)return;
    const refresh=()=>{
      // Silently refresh balance + recent transactions
      API.auth().then(res=>{
        if(res.needs_onboarding)return;
        setData(d=>({
          ...d,
          txs:          res.txs          || d.txs,
          budgets:      res.budgets       || d.budgets,
          achievements: res.achievements  || d.achievements,
          xp_log:       res.xp_log        || d.xp_log,
          streak:       res.user.streak   ?? d.streak,
          streak_record:res.user.streak_record ?? d.streak_record,
          xp:           res.user.xp       ?? d.xp,
          level:        res.user.level    ?? d.level,
          balance:      res.balance!=null ? res.balance : d.balance,
          user:         res.user          || d.user,
        }));
      }).catch(()=>{});
      // Refresh goals, debts, savings in parallel
      fetch(API_URL+"/api/personal_goals",{headers:{"X-Init-Data":_getInitData()}})
        .then(r=>r.ok?r.json():[]).then(d=>{setData(p=>({...p,personalGoals:d||[]}));}).catch(()=>{});
      fetch(API_URL+"/api/personal_debts",{headers:{"X-Init-Data":_getInitData()}})
        .then(r=>r.ok?r.json():[]).then(d=>{setData(p=>({...p,personalDebts:d||[]}));}).catch(()=>{});
      fetch(API_URL+"/api/savings",{headers:{"X-Init-Data":_getInitData()}})
        .then(r=>r.ok?r.json():[]).then(d=>{setData(p=>({...p,savingsJars:d||[]}));}).catch(()=>{});
    };
    // Refresh every 45 seconds
    const iv=setInterval(refresh,45000);
    // Also refresh instantly when app becomes visible again (user switches back to Telegram)
    const onVisible=()=>{if(document.visibilityState==="visible")refresh();};
    document.addEventListener("visibilitychange",onVisible);
    return()=>{clearInterval(iv);document.removeEventListener("visibilitychange",onVisible);};
  },[loading,error,showOnboarding,needsNickname]);

  // ── Transaction handlers ──
  async function handleSaved(tx,xp_earned,total_xp){
    setSuccessInfo({tx,xp:xp_earned,totalXp:total_xp});
    setData(d=>({...d,txs:[tx,...d.txs],xp:total_xp}));
    setToast({icon:"🔥",title:"Серия × "+data.streak+"!",sub:"Запись добавлена · +"+xp_earned+" XP",pts:"+"+xp_earned});
    track("transaction_added",{type:tx.type,amount:tx.amount,category:tx.catName,account:tx.account||"Наличка",xp_earned});
  }
  async function handleDeleteTx(id){
    try{ await API.delTx(id); }catch(e){ console.error(e); }
    setData(d=>({...d,txs:d.txs.filter(t=>t.id!==id)}));
    setDetailTx(null);
  }
  async function handleEditSave(updated){
    try{
      const res=await API.editTx(updated.id,{
        type:updated.type,cat_icon:updated.cat,cat_name:updated.catName,
        note:updated.note,amount:updated.amount,date_str:updated.dateStr,
        time_str:updated.time,currency:updated.currency,
        recurring:updated.recurring,account:updated.account
      });
      setData(d=>({...d,txs:d.txs.map(t=>t.id===res.id?res:t)}));
    }catch(e){ console.error(e); }
  }

  // ── Draft handlers ──
  async function handleDraftDelete(id){
    try{ const r=await API.delDraft(id); if(r.xp_earned) setData(d=>({...d,xp:d.xp+r.xp_earned})); }
    catch(e){ console.error(e); }
    setData(d=>({...d,drafts:d.drafts.filter(dr=>dr.id!==id)}));
  }

  // ── Settings sync ──
  async function handlePatchUser(patch){
    try{ await API.patchUser(patch); }catch(e){ console.error(e); }
    setData(d=>({...d,...patch}));
  }

  function setTabSafe(t){
    setTab(t);
    if(t!=="add")setSuccessInfo(null);
    if(t==="profile"){setAlerts(prev=>({...prev,total:0}));}
    track("tab_viewed",{tab:t});
  }

  const hasDraft=data.drafts.length>0;

  // Loading screen
  if(loading)return h("div",{id:"app",style:{display:"flex",alignItems:"center",justifyContent:"center",height:"100%",flexDirection:"column",gap:16}},
    h("div",{style:{fontSize:32}},"💰"),
    h("div",{style:{fontFamily:"'Space Grotesk',sans-serif",fontSize:18,fontWeight:800,color:"#111318"}},"Finly"),
    h("div",{style:{fontSize:13,color:"#B0B7C3",marginTop:4}},"Загрузка...")
  );

  // Error screen
  if(error){
    const isTgError=error.includes("Telegram")||error.includes("401")||error.includes("initData");
    return h("div",{id:"app",style:{display:"flex",alignItems:"center",justifyContent:"center",height:"100%",flexDirection:"column",gap:12,padding:24}},
      h("div",{style:{fontSize:40}},isTgError?"🔐":"⚠️"),
      h("div",{style:{fontFamily:"'Space Grotesk',sans-serif",fontSize:16,fontWeight:700,color:"#111318",textAlign:"center"}},
        isTgError?"Нужен Telegram":"Не удалось подключиться"),
      h("div",{style:{fontSize:13,color:"#6B7280",textAlign:"center",lineHeight:1.6,maxWidth:280}},
        isTgError
          ?"Открывайте Finly только через кнопку в боте @FinlyBot — не через браузер и не по прямой ссылке."
          :error),
      !isTgError&&h("div",{className:"btn btn-ink",style:{marginTop:8},onClick:()=>{setError(null);setLoading(true);setAuthTick(t=>t+1);}},"Попробовать снова"),
      isTgError&&h("div",{style:{marginTop:8,fontSize:12,color:"#B0B7C3",textAlign:"center"}},"Если проблема повторяется — напишите @support_finly")
    );
  }

  // Onboarding wizard handles slides → nickname → balance inline (never redirects).
  // onDone reloads the app with fresh data (nickname + starting-balance tx now saved).
  if(showOnboarding)return h(OnboardingScreen,{isNew:isNewUser,onDone:()=>{
    setShowOnboarding(false);
    try{localStorage.setItem('finly_onboarding_done','1');}catch{}
    setLoading(true);
    setAuthTick(t=>t+1);
  }});

  // Legacy fallback: existing user who somehow needs only a nickname
  if(needsNickname)return h(NicknameSetupScreen,{onDone:(nick)=>{
    try{localStorage.setItem('finly_onboarding_done','1');}catch{}
    setNeedsNickname(false);
    setLoading(true);
    setAuthTick(t=>t+1);
  }});

  if(tab==="add"&&successInfo)return h("div",{id:"app",style:{display:"flex",flexDirection:"column",height:"100%"}},
    h(SuccessScreen,{tx:successInfo.tx,xp:successInfo.xp,totalXp:successInfo.totalXp,onDone:()=>setSuccessInfo(null),setTab:setTabSafe})
  );

  return h("div",{id:"app",className:darkMode?"dark":""},
    toast&&h(Toast,{toast}),
    h("div",{style:{flex:1,overflow:"hidden",display:"flex",flexDirection:"column"}},
      tab==="home"&&h(HomeScreen,{data,setTab:setTabSafe,onTxTap:(tx)=>setDetailTx(tx),alerts}),
      tab==="add"&&h(AddScreen,{key:repeatPrefill?JSON.stringify(repeatPrefill):"add",data,setData,onSaved:handleSaved,setTab:setTabSafe,prefill:repeatPrefill,onPrefillUsed:()=>setRepeatPrefill(null)}),
      tab==="analytics"&&h(AnalyticsScreen,{data,onTxTap:(tx)=>setDetailTx(tx)}),
      tab==="rewards"&&h(RewardsScreen,{data,setData}),
      tab==="profile"&&h(ProfileScreen,{data,setData,onPatchUser:handlePatchUser,darkMode,setDarkMode,alerts,onOpenFeedback:()=>setShowFeedback(true),deepSection,onDeepSectionUsed:()=>setDeepSection(null)})
    ),
    h(NavBar,{tab,setTab:setTabSafe,hasDraft,badges:{profile:alerts.total}}),
    detailTx&&!editTx&&h(TxDetailModal,{tx:detailTx,onClose:()=>setDetailTx(null),onDelete:handleDeleteTx,onEdit:(tx)=>{setEditTx(tx);setDetailTx(null);}}),
    editTx&&h(TxEditModal,{tx:editTx,onClose:()=>setEditTx(null),onSave:handleEditSave,onRepeat:(prefill)=>{setEditTx(null);setRepeatPrefill(prefill);setTabSafe("add");}}),
    showFeedback&&h(FeedbackPage,{onClose:()=>setShowFeedback(false),source:showFeedback==="blast"?"blast":undefined})
  );
}
// Safety: ensure DOM is ready before mounting
if (document.getElementById("app")) {
  ReactDOM.createRoot(document.getElementById("app")).render(h(App,null));
} else {
  document.addEventListener("DOMContentLoaded", function() {
    ReactDOM.createRoot(document.getElementById("app")).render(h(App,null));
  });
}
</script>
</body>

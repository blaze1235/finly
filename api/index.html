function DonateScreen({onBack}){
  const API_URL=window.FINLY_API_URL||"";
  const getInitData=()=>window.Telegram?.WebApp?.initData||"";
  const DONATE_INFO=window.FINLY_DONATE_INFO||{};
  const[me,setMe]=useState(null);
  const[stats,setStats]=useState(null);
  const[loading,setLoading]=useState(true);
  const[showPledge,setShowPledge]=useState(false);
  const[pledgeInput,setPledgeInput]=useState("");
  const[showReport,setShowReport]=useState(false);
  const[reportAmount,setReportAmount]=useState("");
  const[saving,setSaving]=useState(false);

  function load(){
    Promise.all([
      fetch(API_URL+"/api/donations/me",{headers:{"X-Init-Data":getInitData()}}).then(r=>r.ok?r.json():null),
      fetch(API_URL+"/api/donations/stats",{headers:{"X-Init-Data":getInitData()}}).then(r=>r.ok?r.json():null),
    ]).then(([m,s])=>{setMe(m);setStats(s);setLoading(false);}).catch(()=>setLoading(false));
  }
  useEffect(()=>{load();},[]);

  async function savePledge(){
    const amount=parseInt(pledgeInput)||0;
    if(amount<=0){alert("Введите сумму больше нуля");return;}
    setSaving(true);
    try{
      const r=await fetch(API_URL+"/api/donations/pledge",{
        method:"POST",headers:{"Content-Type":"application/json","X-Init-Data":getInitData()},
        body:JSON.stringify({monthly_amount:amount,active:true})
      });
      if(r.ok){const d=await r.json();setMe(d);setShowPledge(false);setPledgeInput("");}
    }catch{}
    setSaving(false);
  }

  async function reportDonation(){
    const amount=parseInt(reportAmount)||0;
    if(amount<100){alert("Введите сумму пожертвования");return;}
    setSaving(true);
    try{
      const r=await fetch(API_URL+"/api/donations/report",{
        method:"POST",headers:{"Content-Type":"application/json","X-Init-Data":getInitData()},
        body:JSON.stringify({amount})
      });
      if(r.ok){
        const d=await r.json();setMe(d);setShowReport(false);setReportAmount("");
        load();
      }
    }catch{}
    setSaving(false);
  }

  if(loading)return h("div",{className:"screen anim-fade",style:{background:C.bg}},
    h("div",{className:"ph"},h("div",{className:"back",onClick:onBack},"←"),h("div",{className:"ph-title"},"Пожертвования")),
    h("div",{style:{textAlign:"center",padding:60,color:C.ink3}},"Загрузка…")
  );

  const streakLbl=n=>n===1?"месяц":n<5?"месяца":"месяцев";

  return h("div",{className:"screen anim-fade",style:{background:C.bg}},
    h("div",{className:"ph"},
      h("div",{className:"back",onClick:onBack},"←"),
      h("div",{className:"ph-title"},"Пожертвования")
    ),
    h("div",{className:"scroll",style:{padding:"0 16px 32px"}},

      // Transparency / impact card
      h("div",{style:{background:"linear-gradient(135deg,#D4537E,#993556)",borderRadius:20,padding:"20px",marginBottom:14,position:"relative",overflow:"hidden"}},
        h("div",{style:{position:"absolute",top:-20,right:-20,width:120,height:120,borderRadius:"50%",background:"rgba(255,255,255,0.08)"}}),
        h("div",{style:{position:"relative",zIndex:1}},
          h("div",{style:{fontSize:11,fontWeight:700,color:"rgba(255,255,255,0.65)",letterSpacing:1,textTransform:"uppercase",marginBottom:6}},"Всего собрано на благотворительность"),
          h("div",{style:{fontFamily:F,fontSize:30,fontWeight:800,color:"#fff",marginBottom:12}},fmt(stats?.lifetime_total||0)+" сум"),
          h("div",{style:{display:"flex",gap:20}},
            h("div",null,
              h("div",{style:{fontFamily:F,fontSize:16,fontWeight:800,color:"#fff"}},fmt(stats?.this_month_total||0)),
              h("div",{style:{fontSize:11,color:"rgba(255,255,255,0.6)"}},"в этом месяце")
            ),
            h("div",null,
              h("div",{style:{fontFamily:F,fontSize:16,fontWeight:800,color:"#fff"}},stats?.donor_count||0),
              h("div",{style:{fontSize:11,color:"rgba(255,255,255,0.6)"}},"донора")
            )
          )
        )
      ),

      // My pledge / status card
      h("div",{className:"card",style:{marginBottom:14,padding:"16px"}},
        h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14}},
          h("div",null,
            h("div",{style:{fontSize:11,color:C.ink3,fontWeight:700,letterSpacing:1,textTransform:"uppercase",marginBottom:4}},"МОЙ ПЛАН"),
            h("div",{style:{fontFamily:F,fontSize:20,fontWeight:800,color:C.ink}},
              me?.pledge_amount?fmt(me.pledge_amount)+" сум/мес":"Не настроен")
          ),
          h("div",{onClick:()=>{setPledgeInput(String(me?.pledge_amount||""));setShowPledge(true);},
            style:{padding:"7px 12px",borderRadius:10,background:C.bg,fontFamily:F,fontSize:11,fontWeight:700,color:C.ink,cursor:"pointer"}},
            me?.pledge_amount?"✏️ Изменить":"+ Настроить")
        ),
        me?.streak>=1&&h("div",{style:{display:"flex",alignItems:"center",gap:8,marginBottom:10,padding:"8px 12px",background:"#FAF5FF",borderRadius:12}},
          h("div",{style:{fontSize:18}},"🎗"),
          h("div",{style:{fontSize:12,fontWeight:700,color:"#534AB7"}},`${me.streak} ${streakLbl(me.streak)} подряд`)
        ),
        h("div",{style:{display:"flex",justifyContent:"space-between",fontSize:12,color:C.ink3,marginBottom:14}},
          h("div",null,"Всего от тебя: ",h("b",{style:{color:C.ink}},fmt(me?.lifetime_total||0)+" сум")),
          me?.paid_this_month&&h("div",{style:{color:"#639922",fontWeight:700}},"✓ Оплачено")
        ),
        h("div",{className:"btn btn-ink",style:{width:"100%",background:"#D4537E"},onClick:()=>{setReportAmount(String(me?.pledge_amount||""));setShowReport(true);}},
          "💜 Я оплатил(а)")
      ),

      // Payment instructions
      h("div",{style:{background:C.card,border:"1px solid "+C.bdr,borderRadius:16,padding:"14px",marginBottom:14}},
        h("div",{style:{fontFamily:F,fontSize:12,fontWeight:800,color:C.ink,marginBottom:8}},"Как оплатить"),
        h("div",{style:{fontSize:12,color:C.ink2,lineHeight:1.6,marginBottom:8}},
          "Переведи любую сумму напрямую и отметь платёж кнопкой выше — всё уходит на благотворительность."),
        DONATE_INFO.card&&h("div",{style:{fontSize:12,color:C.ink2}},"💳 Карта: ",h("b",{style:{color:C.ink}},DONATE_INFO.card)),
        DONATE_INFO.click&&h("div",{style:{fontSize:12,color:C.ink2}},"Click: ",h("b",{style:{color:C.ink}},DONATE_INFO.click)),
        DONATE_INFO.payme&&h("div",{style:{fontSize:12,color:C.ink2}},"Payme: ",h("b",{style:{color:C.ink}},DONATE_INFO.payme))
      ),

      // Top donors
      stats?.top_donors?.length>0&&h("div",null,
        h("div",{style:{fontFamily:F,fontSize:10,fontWeight:700,color:C.ink3,letterSpacing:2,textTransform:"uppercase",marginBottom:10}},"ТОП ДОНОРЫ"),
        h("div",{className:"card",style:{padding:"4px 0",marginBottom:10}},
          stats.top_donors.map((d,i)=>h("div",{key:i,style:{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",borderTop:i>0?"1px solid "+C.bdr:"none"}},
            h("div",{style:{width:22,fontFamily:F,fontSize:12,fontWeight:800,color:C.ink3}},i+1),
            h("div",{style:{flex:1,fontFamily:F,fontSize:13,fontWeight:700,color:d.is_you?"#D4537E":C.ink}},d.name+(d.is_you?" (ты)":"")),
            h("div",{style:{fontFamily:F,fontSize:13,fontWeight:800,color:C.ink}},fmt(d.total)+" сум")
          ))
        )
      )
    ),

    // Pledge bottom sheet
    showPledge&&h("div",{style:{position:"fixed",inset:0,zIndex:200}},
      h("div",{onClick:()=>setShowPledge(false),style:{position:"absolute",inset:0,background:"rgba(0,0,0,0.6)"}}),
      h("div",{style:{position:"absolute",bottom:0,left:0,right:0,background:C.card,borderRadius:"24px 24px 0 0",padding:"0 20px 40px",maxHeight:"70vh",overflowY:"auto"}},
        h("div",{className:"mhandle",style:{marginTop:14}}),
        h("div",{style:{fontFamily:F,fontSize:18,fontWeight:800,color:C.ink,marginBottom:6,marginTop:8}},"Ежемесячный план"),
        h("div",{style:{fontSize:13,color:C.ink3,marginBottom:18,lineHeight:1.5}},"Сколько ты планируешь жертвовать каждый месяц? Это ориентир — платить можно любую сумму."),
        h("label",{className:"flabel"},"СУММА В МЕСЯЦ (СУМ)"),
        h("input",{className:"finput",placeholder:"50000",inputMode:"numeric",value:pledgeInput,
          onChange:e=>setPledgeInput(e.target.value.replace(/\D/g,"")),style:{marginBottom:22}}),
        h("div",{className:"btn btn-ink",style:{width:"100%",background:"#D4537E"},onClick:savePledge},
          saving?"Сохранение…":"Сохранить")
      )
    ),

    // Report-payment bottom sheet
    showReport&&h("div",{style:{position:"fixed",inset:0,zIndex:200}},
      h("div",{onClick:()=>setShowReport(false),style:{position:"absolute",inset:0,background:"rgba(0,0,0,0.6)"}}),
      h("div",{style:{position:"absolute",bottom:0,left:0,right:0,background:C.card,borderRadius:"24px 24px 0 0",padding:"0 20px 40px",maxHeight:"70vh",overflowY:"auto"}},
        h("div",{className:"mhandle",style:{marginTop:14}}),
        h("div",{style:{fontFamily:F,fontSize:18,fontWeight:800,color:C.ink,marginBottom:6,marginTop:8}},"Отметить пожертвование"),
        h("div",{style:{fontSize:13,color:C.ink3,marginBottom:18,lineHeight:1.5}},"Отметь только после того, как перевёл(а) деньги. Записывается сразу — доверяем тебе 💜"),
        h("label",{className:"flabel"},"СКОЛЬКО ТЫ ПЕРЕВЁЛ(А)"),
        h("input",{className:"finput",placeholder:"50000",inputMode:"numeric",value:reportAmount,
          onChange:e=>setReportAmount(e.target.value.replace(/\D/g,"")),style:{marginBottom:22}}),
        h("div",{className:"btn btn-ink",style:{width:"100%",background:"#D4537E"},onClick:reportDonation},
          saving?"Сохранение…":"💜 Подтвердить")
      )
    )
  );
}

function AccountsScreen({data,onBack}){
  const{txs}=data;
  const[showAdd,setShowAdd]=useState(false);
  const[editAcc,setEditAcc]=useState(null);
  const[newName,setNewName]=useState("");
  const[newBal,setNewBal]=useState("");

  const[customAccs,setCustomAccs]=useState(()=>{
    try{return JSON.parse(localStorage.getItem("finly_accounts")||"[]");}catch{return [];}
  });
  const[defAcc,setDefAcc]=useState(()=>localStorage.getItem("finly_default_account")||"Наличка");

  // Deleted accounts: [{name, icon, initial, deletedAt (ISO string)}]
  const[deletedAccs,setDeletedAccs]=useState(()=>{
    try{
      const all=JSON.parse(localStorage.getItem("finly_deleted_accounts")||"[]");
      const week=7*24*60*60*1000;
      // Purge permanently deleted (>7 days)
      const fresh=all.filter(a=>Date.now()-new Date(a.deletedAt).getTime()<week);
      if(fresh.length!==all.length)localStorage.setItem("finly_deleted_accounts",JSON.stringify(fresh));
      return fresh;
    }catch{return [];}
  });

  const accMap={};
  txs.forEach(t=>{
    const acc=t.account||"Наличка";
    accMap[acc]=(accMap[acc]||0)+(t.type==="income"?t.amount:-t.amount);
  });

  const hiddenAccs=new Set((()=>{try{return JSON.parse(localStorage.getItem("finly_hidden_accounts")||"[]");}catch{return[];}})());
  const allNames=new Set(["Наличка",...Object.keys(accMap),...customAccs.map(a=>a.name)]);
  const accList=[...allNames].filter(n=>!hiddenAccs.has(n)).map(name=>{
    const custom=customAccs.find(a=>a.name===name);
    return{name,icon:custom?.icon||"💳",balance:(custom?.initial||0)+(accMap[name]||0)};
  });
  const total=accList.reduce((s,a)=>s+a.balance,0);

  function setDefault(name){
    setDefAcc(name);
    localStorage.setItem("finly_default_account",name);
  }
  function deleteAcc(name){
    // Remove from custom accounts
    const custom=customAccs.find(a=>a.name===name);
    const upd=customAccs.filter(a=>a.name!==name);
    setCustomAccs(upd);
    localStorage.setItem("finly_accounts",JSON.stringify(upd));
    // Add to hidden so tx-history accounts also disappear
    const hidden=(()=>{try{return JSON.parse(localStorage.getItem("finly_hidden_accounts")||"[]");}catch{return[];}})();
    if(!hidden.includes(name)){localStorage.setItem("finly_hidden_accounts",JSON.stringify([...hidden,name]));}
    // Track deletion with timestamp for 7-day restore
    const week=7*24*60*60*1000;
    const prev=(()=>{try{return JSON.parse(localStorage.getItem("finly_deleted_accounts")||"[]");}catch{return[];}})()
      .filter(a=>Date.now()-new Date(a.deletedAt).getTime()<week);
    if(!prev.find(a=>a.name===name)){
      const entry={name,icon:custom?.icon||"💳",initial:custom?.initial||0,deletedAt:new Date().toISOString()};
      const upd2=[...prev,entry];
      localStorage.setItem("finly_deleted_accounts",JSON.stringify(upd2));
      setDeletedAccs(upd2);
    }
    if(defAcc===name)setDefault("Наличка");
  }
  function restoreAcc(name){
    const rec=deletedAccs.find(a=>a.name===name);
    if(!rec)return;
    // Remove from hidden
    const hidden=(()=>{try{return JSON.parse(localStorage.getItem("finly_hidden_accounts")||"[]");}catch{return[];}})();
    localStorage.setItem("finly_hidden_accounts",JSON.stringify(hidden.filter(n=>n!==name)));
    // Add back to custom accounts if not there
    if(!customAccs.find(a=>a.name===name)){
      const upd=[...customAccs,{name:rec.name,icon:rec.icon,initial:rec.initial}];
      setCustomAccs(upd);
      localStorage.setItem("finly_accounts",JSON.stringify(upd));
    }
    // Remove from deleted
    const upd2=deletedAccs.filter(a=>a.name!==name);
    setDeletedAccs(upd2);
    localStorage.setItem("finly_deleted_accounts",JSON.stringify(upd2));
  }
  function addAccount(){
    if(!newName.trim())return;
    const upd=[...customAccs,{name:newName.trim(),icon:"💳",initial:parseInt(newBal)||0}];
    setCustomAccs(upd);
    localStorage.setItem("finly_accounts",JSON.stringify(upd));
    setNewName("");setNewBal("");setShowAdd(false);
  }
  async function updateAccount(){
    if(!editAcc)return;
    const{origName,name,icon,initial,cardId}=editAcc;
    const trimmed=name.trim()||origName;
    const upd=customAccs.map(a=>a.name===origName?{...a,name:trimmed,icon,initial:parseInt(initial)||0}:a);
    const exists=customAccs.find(a=>a.name===origName);
    const final=exists?upd:[...customAccs,{name:trimmed,icon:editAcc.icon,initial:parseInt(editAcc.initial)||0,...(cardId?{cardId}:{})}];
    setCustomAccs(final);
    localStorage.setItem("finly_accounts",JSON.stringify(final));
    if(defAcc===origName&&trimmed!==origName){
      setDefault(trimmed);
    }
    // Bank-card-linked account: keep the card's alias in sync so future
    // forwarded transactions still land under the (renamed) account.
    if(cardId&&trimmed!==origName){
      try{
        const API_URL=window.FINLY_API_URL||"";
        const initData=window.Telegram?.WebApp?.initData||"";
        await fetch(API_URL+"/api/bank_cards/"+cardId,{
          method:"PATCH",headers:{"Content-Type":"application/json","X-Init-Data":initData},
          body:JSON.stringify({alias:trimmed})
        });
      }catch{}
    }
    setEditAcc(null);
  }

  return h("div",{className:"screen anim-fade"},
    h("div",{className:"ph"},
      h("div",{className:"back",onClick:onBack},"←"),
      h("div",{className:"ph-title"},"Счета"),
      h("div",{className:"ph-action",onClick:()=>setShowAdd(true),style:{cursor:"pointer"}},"+")
    ),
    h("div",{className:"scroll",style:{padding:"0 16px"}},
      h("div",{className:"wallet",style:{marginBottom:10}},
        h("div",{style:{fontFamily:F,fontSize:10,fontWeight:700,color:"rgba(255,255,255,.35)",letterSpacing:2,textTransform:"uppercase",marginBottom:4}},"ОБЩИЙ БАЛАНС"),
        h("div",{style:{fontFamily:F,fontSize:32,fontWeight:800,color:total>=0?"#fff":C.rd,lineHeight:1.1,marginBottom:4}},
          fmt(Math.abs(total))," ",h("span",{style:{fontSize:16,color:"rgba(255,255,255,.4)"}},"сум")),
        h("div",{style:{fontSize:12,color:"rgba(255,255,255,.4)",marginBottom:16}},"Все счета вместе"),
        h("div",{style:{height:1,background:"rgba(255,255,255,.08)",marginBottom:16}}),
        h("div",{style:{fontFamily:F,fontSize:9,fontWeight:700,color:"rgba(255,255,255,.3)",letterSpacing:2,textTransform:"uppercase",marginBottom:8}},"СЧЁТ ПО УМОЛЧАНИЮ"),
        h("div",{style:{fontFamily:F,fontSize:15,fontWeight:700,color:"#fff"}},defAcc)
      ),
      ...accList.map(a=>h("div",{key:a.name,className:"card",style:{marginBottom:10,padding:"16px 16px"}},
        h("div",{style:{display:"flex",alignItems:"center",gap:14,marginBottom:12}},
          h("div",{style:{width:52,height:52,borderRadius:16,background:C.bg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,flexShrink:0}},a.icon),
          h("div",{style:{flex:1}},
            h("div",{style:{fontFamily:F,fontSize:16,fontWeight:800,color:C.ink}},a.name),
            h("div",{style:{fontFamily:F,fontSize:22,fontWeight:800,color:a.balance>=0?C.ink:C.rd,marginTop:2}},fmt(Math.abs(a.balance))),
            h("div",{style:{fontSize:11,color:C.ink3,marginTop:1}},"сум"+(defAcc===a.name?" · по умолчанию":""))
          ),
          defAcc===a.name&&h("div",{style:{background:C.amBg,color:C.am,fontSize:10,fontWeight:800,padding:"4px 10px",borderRadius:10}},"★")
        ),
        h("div",{style:{display:"flex",gap:8}},
          h("div",{onClick:()=>{
              const linked=customAccs.find(c=>c.name===a.name);
              setEditAcc({origName:a.name,name:a.name,icon:a.icon,initial:linked?.initial||0,cardId:linked?.cardId||null});
            },
            style:{flex:1,padding:"9px",borderRadius:12,background:C.bg,fontFamily:F,fontSize:11,fontWeight:700,color:C.ink,textAlign:"center",cursor:"pointer"}},"✏️ Изменить"),
          h("div",{onClick:()=>setDefault(a.name),
            style:{flex:1,padding:"9px",borderRadius:12,background:defAcc===a.name?C.amBg:C.bg,fontFamily:F,fontSize:11,fontWeight:700,color:defAcc===a.name?C.am:C.ink2,textAlign:"center",cursor:"pointer"}},
            defAcc===a.name?"★ Основной":"☆ Сделать основным"),
          a.name!=="Наличка"&&!customAccs.find(c=>c.name===a.name)?.cardId&&h("div",{onClick:()=>deleteAcc(a.name),
            style:{padding:"9px 12px",borderRadius:12,background:C.rdBg,fontFamily:F,fontSize:11,fontWeight:700,color:C.rd,textAlign:"center",cursor:"pointer"}},"×")
        )
      )),
      h("div",{className:"btn btn-gray",style:{width:"100%",marginTop:4},onClick:()=>setShowAdd(true)},"+ Добавить счёт"),
      // ── Recently deleted (within 7 days) ──
      deletedAccs.length>0&&h("div",{style:{marginTop:20}},
        h("div",{style:{fontFamily:F,fontSize:10,fontWeight:700,color:C.ink3,letterSpacing:2,textTransform:"uppercase",marginBottom:8}},"НЕДАВНО УДАЛЁННЫЕ"),
        h("div",{style:{background:C.card,borderRadius:18,border:"1px solid "+C.bdr,overflow:"hidden"}},
          deletedAccs.map((a,i)=>{
            const msLeft=7*24*60*60*1000-(Date.now()-new Date(a.deletedAt).getTime());
            const daysLeft=Math.max(1,Math.ceil(msLeft/(24*60*60*1000)));
            return h("div",{key:a.name},
              h("div",{style:{display:"flex",alignItems:"center",gap:12,padding:"13px 16px"}},
                h("div",{style:{width:42,height:42,borderRadius:12,background:C.rdBg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0,opacity:0.6}},a.icon),
                h("div",{style:{flex:1,minWidth:0}},
                  h("div",{style:{fontSize:14,fontWeight:700,color:C.ink3,textDecoration:"line-through"}},a.name),
                  h("div",{style:{fontSize:11,color:C.rd,marginTop:2}},"Удалён · "+daysLeft+" дн до удаления")
                ),
                h("div",{onClick:()=>restoreAcc(a.name),
                  style:{padding:"8px 14px",borderRadius:12,background:C.grBg,color:C.gr,fontFamily:F,fontSize:11,fontWeight:700,cursor:"pointer",flexShrink:0,border:"1px solid "+C.gr}},
                  "↺ Восстановить")
              ),
              i<deletedAccs.length-1&&h("div",{style:{height:1,background:C.bdr,marginLeft:70}})
            );
          })
        )
      ),
      h("div",{style:{height:20}})
    ),
    showAdd&&h("div",{className:"overlay",onClick:e=>{if(e.target===e.currentTarget)setShowAdd(false)}},
      h("div",{className:"msheet"},
        h("div",{className:"mhandle"}),
        h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}},
          h("div",{style:{fontFamily:F,fontSize:18,fontWeight:800,color:C.ink}},"Новый счёт"),
          h("div",{onClick:()=>setShowAdd(false),style:{fontSize:20,color:C.ink3,cursor:"pointer"}},"✕")
        ),
        h("label",{className:"flabel"},"НАЗВАНИЕ"),
        h("input",{className:"finput sm",style:{marginBottom:14},placeholder:"Карта, Наличные…",value:newName,onChange:e=>setNewName(e.target.value)}),
        h("label",{className:"flabel"},"НАЧАЛЬНЫЙ БАЛАНС (СУМ)"),
        h("input",{className:"finput",style:{marginBottom:20},inputMode:"numeric",placeholder:"0",value:newBal,onChange:e=>setNewBal(e.target.value)}),
        h("div",{style:{display:"flex",gap:10}},
          h("div",{className:"btn btn-gray",style:{flex:1},onClick:()=>setShowAdd(false)},"Отмена"),
          h("div",{className:"btn btn-ink",style:{flex:2},onClick:addAccount},"Сохранить")
        )
      )
    ),
    editAcc&&h("div",{className:"overlay",onClick:e=>{if(e.target===e.currentTarget)setEditAcc(null)}},
      h("div",{className:"msheet",style:{paddingBottom:"calc(20px + env(safe-area-inset-bottom,0px))"}},
        h("div",{className:"mhandle"}),
        h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:editAcc.cardId?6:18}},
          h("div",{style:{fontFamily:F,fontSize:18,fontWeight:800,color:C.ink}},"Редактировать счёт"),
          h("div",{onClick:()=>setEditAcc(null),style:{fontSize:20,color:C.ink3,cursor:"pointer"}},"✕")
        ),
        editAcc.cardId&&h("div",{style:{fontSize:11,color:C.ink3,marginBottom:14}},"🏦 Привязан к банковской карте — переименование обновит и карту"),
        h("div",{style:{display:"flex",alignItems:"center",gap:12,background:C.bg,borderRadius:14,padding:"12px 14px",marginBottom:14}},
          h("div",{style:{width:44,height:44,borderRadius:12,background:C.card,border:"1px solid "+C.bdr,display:"flex",alignItems:"center",justifyContent:"center",fontSize:24}},editAcc.icon),
          h("input",{className:"finput",style:{flex:1,marginBottom:0,fontSize:15,fontWeight:700,background:"transparent",border:"none",padding:0},
            placeholder:"Название счёта",value:editAcc.name,
            onChange:e=>setEditAcc({...editAcc,name:e.target.value})})
        ),
        h("label",{className:"flabel"},"ЗНАЧОК"),
        h("div",{style:{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:8,marginBottom:16}},
          ACC_ICONS.map(ic=>h("div",{key:ic,onClick:()=>setEditAcc({...editAcc,icon:ic}),
            style:{aspectRatio:"1",borderRadius:12,background:editAcc.icon===ic?C.ink:C.bg,
              display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,cursor:"pointer",transition:"all .12s"}},ic))
        ),
        h("label",{className:"flabel"},"НАЧАЛЬНЫЙ БАЛАНС (СУМ)"),
        h("input",{className:"finput",style:{marginBottom:20},inputMode:"numeric",placeholder:"0",
          value:editAcc.initial,onChange:e=>setEditAcc({...editAcc,initial:e.target.value})}),
        h("div",{style:{display:"flex",gap:10}},
          h("div",{className:"btn btn-gray",style:{flex:1},onClick:()=>setEditAcc(null)},"Отмена"),
          h("div",{className:"btn btn-ink",style:{flex:2},onClick:updateAccount},"Сохранить")
        )
      )
    )
  );
}

/* ── FRIENDS SCREEN ── */
function FriendsScreen({onBack}){
  const API_URL=window.FINLY_API_URL||"";
  const[tab,setTab]=useState("friends");
  const[searchQ,setSearchQ]=useState("");
  const[searchResults,setSearchResults]=useState([]);
  const[searching,setSearching]=useState(false);
  const[friendsData,setFriendsData]=useState({friends:[],incoming:[],outgoing:[]});
  const[loading,setLoading]=useState(true);
  const[actionLoading,setActionLoading]=useState(null);
  const[profileModal,setProfileModal]=useState(null); // {name,nickname,xp,level,streak}

  useEffect(()=>{
    loadFriends();
  },[]);

  async function loadFriends(){
    setLoading(true);
    try{
      const r=await fetch(API_URL+"/api/friends",{headers:{"X-Init-Data":window.Telegram?.WebApp?.initData||""}});
      if(r.ok){const d=await r.json();setFriendsData(d);}
    }catch{}
    setLoading(false);
  }

  async function doSearch(){
    if(searchQ.trim().length<2)return;
    setSearching(true);
    try{
      const r=await fetch(API_URL+"/api/users/search?q="+encodeURIComponent(searchQ),{headers:{"X-Init-Data":window.Telegram?.WebApp?.initData||""}});

    }catch{}
    setSearching(false);

  async function sendRequest(identifier){
    setActionLoading(identifier);
    try{
      const r=await fetch(API_URL+"/api/friends",{
        method:"POST",

/* ── DEBTS SCREEN ── */
function DebtsScreen({onBack}){
  const API_URL=window.FINLY_API_URL||"";
  const getInitData=()=>window.Telegram?.WebApp?.initData||"";
  const[localDebts,setLocalDebts]=useState([]);
  const[socialDebts,setSocialDebts]=useState([]);
  const[loading,setLoading]=useState(true);
  const[showAdd,setShowAdd]=useState(false);
  const[editDebt,setEditDebt]=useState(null);
  const[form,setForm]=useState({name:"",amount:"",dueDate:"",note:"",type:"borrowed",linkedFriendId:null,linkedNick:""});
  const[formAccount,setFormAccount]=useState(()=>localStorage.getItem("finly_default_account")||"Наличка");
  const[recordBalance,setRecordBalance]=useState(true);
  const[friends,setFriends]=useState([]);
  const[saving,setSaving]=useState(false);
  const[showCustomNick,setShowCustomNick]=useState(false);
  const[actLoading,setActLoading]=useState(null);
  const[settleSheet,setSettleSheet]=useState(null); // {sd, iLent}
  const[settleAmount,setSettleAmount]=useState("");
  const[settleAccount,setSettleAccount]=useState(()=>localStorage.getItem("finly_default_account")||"Наличка");
  const[settleLocalSheet,setSettleLocalSheet]=useState(null);
  const[settleLocalAccount,setSettleLocalAccount]=useState(()=>localStorage.getItem("finly_default_account")||"Наличка");
  const[settleLocalAmount,setSettleLocalAmount]=useState("");
  const[settleLocalFromBalance,setSettleLocalFromBalance]=useState(true);
  const getAccounts=()=>[...new Set([...(()=>{try{return JSON.parse(localStorage.getItem("finly_accounts")||"[]").map(a=>a.name);}catch{return[];}})(),"Наличка"])];

  function loadSocialDebts(){
    return fetch(API_URL+"/api/social_debts",{headers:{"X-Init-Data":getInitData()}})
      .then(r=>r.ok?r.json():null).then(d=>{if(d)setSocialDebts(d);setLoading(false);}).catch(()=>setLoading(false));
  }

  useEffect(()=>{
    fetch(API_URL+"/api/friends",{headers:{"X-Init-Data":getInitData()}})
      .then(r=>r.ok?r.json():null).then(d=>{if(d)setFriends(d.friends||[]);}).catch(()=>{});
    fetch(API_URL+"/api/personal_debts",{headers:{"X-Init-Data":getInitData()}})
      .then(r=>r.ok?r.json():[]).then(d=>{if(d)setLocalDebts(d);}).catch(()=>{});
    loadSocialDebts();
    function onVis(){if(document.visibilityState==="visible")loadSocialDebts();}
    document.addEventListener("visibilitychange",onVis);
    return()=>document.removeEventListener("visibilitychange",onVis);
  },[]);

  function saveLocalDebts(list){setLocalDebts(list);}
  function openAdd(){setForm({name:"",amount:"",dueDate:"",note:"",type:"borrowed",linkedFriendId:null,linkedNick:""});setFormAccount(localStorage.getItem("finly_default_account")||"Наличка");setRecordBalance(true);setShowCustomNick(false);setEditDebt(null);setShowAdd(true);}
  function openEdit(d){setForm({name:d.name,amount:String(d.amount),dueDate:d.dueDate||"",note:d.note||"",type:d.type,linkedFriendId:d.linkedFriendId||null,linkedNick:d.linkedNick||""});setEditDebt(d);setShowAdd(true);}

  async function createBalanceTx(txType,catName,amount,name,account){
    try{
      await fetch(API_URL+"/api/transactions",{
        method:"POST",headers:{"Content-Type":"application/json","X-Init-Data":getInitData()},
        body:JSON.stringify({type:txType,cat_icon:"💸",cat_name:catName,note:name,amount,date_str:today(),time_str:nowTime(),account,currency:"UZS",recurring:false})
      });
    }catch{}
  }

  async function saveDebt(){
    if(!form.name.trim()||!form.amount||saving)return;
    setSaving(true);
    const amt=parseInt(String(form.amount).replace(/\D/g,""))||0;
    const hasLink=form.linkedFriendId||form.linkedNick.trim();
    if(hasLink){
      try{
        const r=await fetch(API_URL+"/api/social_debts",{
          method:"POST",headers:{"Content-Type":"application/json","X-Init-Data":getInitData()},
          body:JSON.stringify({counterpart_id:form.linkedFriendId||null,counterpart_nickname:form.linkedFriendId?null:form.linkedNick.trim(),amount:amt,due_date:form.dueDate||null,note:form.note.trim(),debt_type:form.type})
        });
        if(r.ok){
          if(recordBalance){
            // lent = I gave money out = expense; borrowed = I received money = income
            await createBalanceTx(form.type==="lent"?"expense":"income",form.type==="lent"?"Выдан долг":"Получен долг",amt,form.name.trim(),formAccount);
          }
          await loadSocialDebts();
        }
      }catch{}
    } else {
      if(!editDebt&&recordBalance){
        await createBalanceTx(form.type==="lent"?"expense":"income",form.type==="lent"?"Выдан долг":"Получен долг",amt,form.name.trim(),formAccount);
      }
      try{
        if(editDebt){
          const r=await fetch(API_URL+"/api/personal_debts/"+editDebt.id,{
            method:"PATCH",
            headers:{"Content-Type":"application/json","X-Init-Data":getInitData()},
            body:JSON.stringify({name:form.name.trim(),amount:amt,note:form.note.trim(),due_date:form.dueDate||null})
          });
          if(r.ok){const upd=await r.json();setLocalDebts(prev=>prev.map(d=>d.id===editDebt.id?upd:d));}
        }else{
          const r=await fetch(API_URL+"/api/personal_debts",{
            method:"POST",
            headers:{"Content-Type":"application/json","X-Init-Data":getInitData()},
            body:JSON.stringify({name:form.name.trim(),amount:amt,type:form.type,note:form.note.trim(),due_date:form.dueDate||null})
          });
          if(r.ok){const newDebt=await r.json();setLocalDebts(prev=>[...prev,newDebt]);}
        }
      }catch(e){console.error("saveDebt:",e);}
    }
    setSaving(false);setShowAdd(false);
  }

  async function handleSocialDebt(sdId,action){
    setActLoading(sdId+":"+action);
    try{
      const r=await fetch(API_URL+"/api/social_debts/"+sdId,{
        method:"PATCH",headers:{"Content-Type":"application/json","X-Init-Data":getInitData()},
        body:JSON.stringify({action})
      });
      if(r.ok){
        const newStatus=action==="approve"?"approved":action==="settle"?"settled":"rejected";
        setSocialDebts(prev=>prev.map(sd=>sd.id===sdId?{...sd,status:newStatus}:sd));
      }
    }catch{}
    setActLoading(null);
  }

  async function openSettleSheet(sd){
    const iLent=(sd.is_mine&&sd.debt_type==="lent")||(!sd.is_mine&&sd.debt_type==="borrowed");
    setSettleSheet({sd,iLent});
    setSettleAmount(String(sd.amount));
    setSettleAccount(localStorage.getItem("finly_default_account")||"Наличка");
  }

  async function confirmSettle(){
    if(!settleSheet)return;
    const{sd,iLent}=settleSheet;
    const amt=parseInt(String(settleAmount).replace(/\D/g,""))||sd.amount;
    setActLoading(sd.id+":settle");
    // Record balance movement: receiving repayment = income; paying back = expense
    await createBalanceTx(iLent?"income":"expense",iLent?"Погашен долг":"Выплата долга",amt,(sd.is_mine?sd.counterpart?.name:sd.creator?.name)||"",settleAccount);
    await handleSocialDebt(sd.id,"settle");
    setSettleSheet(null);
    setActLoading(null);
  }

  function openSettleLocal(d){
    setSettleLocalSheet(d);
    const rem=d.remaining!=null?d.remaining:d.amount;
    setSettleLocalAmount(String(rem));
    setSettleLocalFromBalance(true);
    setSettleLocalAccount(localStorage.getItem("finly_default_account")||"Наличка");
  }

  async function confirmSettleLocal(){
    if(!settleLocalSheet)return;
    const d=settleLocalSheet;
    const rem=d.remaining!=null?d.remaining:d.amount;
    const amt=Math.min(parseInt(String(settleLocalAmount).replace(/\D/g,""))||0, rem);
    if(amt<=0){setSettleLocalSheet(null);return;}
    try{
      const r=await fetch(API_URL+"/api/personal_debts/"+d.id+"/pay",{
        method:"POST",
        headers:{"Content-Type":"application/json","X-Init-Data":getInitData()},
        body:JSON.stringify({amount:amt,affects_balance:settleLocalFromBalance,account:settleLocalAccount})
      });
      if(r.ok){const upd=await r.json();setLocalDebts(prev=>prev.map(x=>x.id===d.id?upd:x));}

    setSettleLocalSheet(null);

/* ── BUDGETS SCREEN ── */
function BudgetsScreen({data,setData,onBack}){
  const[showAdd,setShowAdd]=useState(false);
  const[editB,setEditB]=useState(null);
  const budgets=data.budgets||[];
  const expCats=data.exp_cats||EXP_CATS;
  const RU_MONTHS_FULL=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
  const RU_MONTHS_SHORT_B=["ЯНВ","ФЕВ","МАР","АПР","МАЙ","ИЮН","ИЮЛ","АВГ","СЕН","ОКТ","НОЯ","ДЕК"];
  const now=new Date();
  const curMon=RU_MONTHS_FULL[now.getMonth()].toUpperCase();
  const curMonShort=RU_MONTHS_SHORT_B[now.getMonth()];

  const totalSpent=budgets.reduce((s,b)=>s+(b.spent||0),0);
  const totalLimit=budgets.reduce((s,b)=>s+(b.limit||0),0);
  const overallPct=totalLimit>0?Math.min(Math.round(totalSpent/totalLimit*100),100):0;

  async function saveBudget(b){
    try{
      if(b.id){
        const res=await API.editBudget(b.id,{name:b.name,icon:b.icon,limit_amt:b.limit,color:b.color});
        setData(d=>({...d,budgets:d.budgets.map(x=>x.id===res.id?res:x)}));
      }else{
        const res=await API.addBudget({name:b.name,icon:b.icon,limit_amt:b.limit,color:b.color});
        setData(d=>({...d,budgets:[...d.budgets,res]}));
      }
    }catch(e){
      console.error(e);
      showToast({icon:"⚠️",title:"Не удалось сохранить бюджет",sub:"Проверьте соединение"});
      if(!b.id){
        const nb={...b,id:Date.now()};
        setData(d=>({...d,budgets:[...d.budgets,nb]}));
      }
    }
    setShowAdd(false);setEditB(null);
  }
  async function deleteBudget(id){
    try{await API.delBudget(id);}catch(e){console.error(e);}
    setData(d=>({...d,budgets:d.budgets.filter(b=>b.id!==id)}));
    setEditB(null);
  }

  function BudgetBottomSheet({open,onClose,children}){
    return h("div",{style:{position:"absolute",inset:0,zIndex:100,pointerEvents:open?"auto":"none"}},
      h("div",{onClick:onClose,style:{position:"absolute",inset:0,background:"rgba(0,0,0,.55)",opacity:open?1:0,transition:"opacity .25s"}}),
      h("div",{style:{position:"absolute",left:0,right:0,bottom:0,background:C.card,borderRadius:"24px 24px 0 0",padding:"0",transform:open?"translateY(0)":"translateY(100%)",transition:"transform .3s cubic-bezier(.32,.72,0,1)",maxHeight:"90%",display:"flex",flexDirection:"column"}},
        children
      )
    );
  }

  return h("div",{className:"screen anim-fade",style:{position:"relative"}},
    h("div",{className:"ph"},
      h("div",{className:"back",onClick:onBack},"←"),
      h("div",{className:"ph-title"},"Бюджеты"),
      h("div",{className:"ph-action",onClick:()=>setShowAdd(true),style:{cursor:"pointer",fontFamily:F,fontSize:11,fontWeight:700,letterSpacing:1}},
        "+ НОВЫЙ"
      )
    ),
    h("div",{className:"scroll",style:{padding:"0 16px"}},
      // Dark summary card
      h("div",{style:{background:"#111318",borderRadius:20,padding:"18px 20px",marginBottom:12}},
        h("div",{style:{fontFamily:F,fontSize:9,fontWeight:700,color:"rgba(255,255,255,0.45)",letterSpacing:2,textTransform:"uppercase",marginBottom:6}},
          "БЮДЖЕТ · "+curMonShort),
        h("div",{style:{display:"flex",alignItems:"baseline",gap:6,marginBottom:10}},
          h("div",{style:{fontFamily:F,fontSize:38,fontWeight:800,color:"#fff",fontVariantNumeric:"tabular-nums",lineHeight:1}},
            fmt(totalSpent)),
          h("div",{style:{fontSize:16,color:"rgba(255,255,255,0.5)",fontWeight:500}},
            " / "+fmt(totalLimit)+" сум")
        ),
        h("div",{style:{height:6,background:"rgba(255,255,255,0.10)",borderRadius:3,overflow:"hidden"}},
          h("div",{style:{height:"100%",borderRadius:3,width:overallPct+"%",background:"linear-gradient(90deg,#D97706,#F59E0B)",transition:"width .4s ease"}})
        )
      ),
      // Budget items
      ...budgets.map(b=>{
        const pct=Math.min(Math.round((b.spent||0)/Math.max(b.limit,1)*100),100);
        const isRed=pct>=90,isAmb=pct>=70&&pct<90;
        const fillColor=isRed?"#DC2626":isAmb?"#D97706":"#16A34A";
        const badgeBg=isRed?C.rdBg:isAmb?C.amBg:C.grBg;
        const badgeColor=isRed?"#DC2626":isAmb?"#D97706":"#16A34A";
        return h("div",{key:b.id,style:{background:C.card,borderRadius:18,border:"1px solid "+C.bdr,padding:"14px 16px",marginBottom:8,cursor:"pointer",transition:"all .1s"},
          onClick:()=>setEditB(b)},
          h("div",{style:{display:"flex",alignItems:"center",gap:12,marginBottom:10}},
            h("div",{style:{width:42,height:42,borderRadius:12,background:C.bg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0}},b.icon),
            h("div",{style:{flex:1}},
              h("div",{style:{fontFamily:F,fontSize:15,fontWeight:700,color:C.ink}},b.name),
              h("div",{style:{fontSize:12,color:C.ink2,marginTop:2}},fmt(b.spent||0)+" / "+fmt(b.limit)+" сум")
            ),
            h("span",{style:{fontSize:11,fontWeight:700,letterSpacing:.8,padding:"5px 10px",borderRadius:20,display:"inline-block",background:badgeBg,color:badgeColor}},pct+"%")
          ),
          h("div",{style:{height:6,background:C.bdr,borderRadius:3,overflow:"hidden"}},
            h("div",{style:{height:"100%",borderRadius:3,width:pct+"%",background:fillColor,transition:"width .4s ease"}})
          )
        );
      }),
      h("div",{className:"btn btn-gray",style:{width:"100%",marginTop:4},onClick:()=>setShowAdd(true)},"+ ДОБАВИТЬ БЮДЖЕТ"),
      h("div",{style:{height:20}})
    ),
    // Add BottomSheet
    h(BudgetBottomSheet,{open:showAdd,onClose:()=>setShowAdd(false)},
      h(BudgetModal,{budget:null,expCats,onClose:()=>setShowAdd(false),onSave:saveBudget})
    ),
    // Edit BottomSheet
    h(BudgetBottomSheet,{open:!!editB,onClose:()=>setEditB(null)},
      editB&&h(BudgetModal,{budget:editB,expCats,onClose:()=>setEditB(null),onSave:saveBudget,onDelete:(id)=>{deleteBudget(id);}})
    )
  );
}

function BudgetModal({budget,expCats,onClose,onSave,onDelete}){
  const cats=expCats||EXP_CATS;
  const[selCat,setSelCat]=useState(budget?{icon:budget.icon,name:budget.name}:null);
  const[limit,setLimit]=useState(budget?String(budget.limit):"");
  return h("div",{style:{overflowY:"auto",maxHeight:"85vh",padding:"0 20px 36px"}},
    h("div",{className:"mhandle",style:{marginTop:14}}),
    h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}},
      h("div",{style:{fontFamily:F,fontSize:18,fontWeight:800,color:C.ink}},budget?"Редактировать бюджет":"Новый бюджет"),
      h("div",{onClick:onClose,style:{fontSize:20,color:C.ink3,cursor:"pointer"}},"✕")
    ),
    h("label",{className:"flabel"},"КАТЕГОРИЯ РАСХОДОВ"),
    h("div",{className:"catgrid",style:{gridTemplateColumns:"repeat(3,1fr)",marginBottom:16}},
      cats.map(c=>h("div",{key:c.name,className:"catbtn"+(selCat?.name===c.name?" sel-e":""),onClick:()=>setSelCat(c)},
        h("div",{className:"catbtn-icon"},c.icon),
        h("div",{className:"catbtn-name"},c.name)
      ))
    ),
    h("label",{className:"flabel"},"ЛИМИТ (СУМ)"),
    h("input",{className:"finput",style:{marginBottom:20},inputMode:"numeric",placeholder:"200 000",value:limit,onChange:e=>setLimit(e.target.value)}),
    h("div",{style:{display:"flex",gap:10}},
      budget&&h("div",{className:"btn btn-red-out",style:{flex:1},onClick:()=>{onDelete&&onDelete(budget.id);onClose();}},"Удалить"),
      h("div",{className:"btn btn-ink",style:{flex:2},onClick:()=>{
        if(!selCat||!limit)return;
        onSave({id:budget?.id,name:selCat.name,icon:selCat.icon,limit:parseInt(limit)||0,spent:budget?.spent||0,color:C.gr});
      }},"Сохранить")
    )
  );
}

/* ── CATEGORIES SCREEN ── */
function CategoriesScreen({data,setData,onBack}){
  const[tabType,setTabType]=useState("expense");
  const[showAdd,setShowAdd]=useState(false);
  const[catName,setCatName]=useState("");
  const[catIcon,setCatIcon]=useState("📦");
  const[saving,setSaving]=useState(false);
  const allIcons=["🛒","🏠","🚗","☕","🍕","💊","🎮","✈️","👕","📚","💻","📱","🎬","🎵","🏋️","🌿","🐕","💡","🔧","🏥","🎓","🎁","💼","📈","🛍️","🍜","🚲","⚽","🎸","🏖️","💈","📦","🤷","🎭","💇"];
  const cats=tabType==="expense"?(data.exp_cats||EXP_CATS):(data.inc_cats||INC_CATS);

  async function addCat(){
    if(!catName.trim()||saving)return;
    setSaving(true);
    const body={type:tabType,icon:catIcon,name:catName.trim()};
    try{
      const res=await API.addCategory(body);
      setData(d=>{const key=tabType==="expense"?"exp_cats":"inc_cats";return{...d,[key]:[...(d[key]||[]),{icon:res.icon,name:res.name,id:res.id}]};});
    }catch(e){
      console.error(e);
      showToast({icon:"⚠️",title:"Не удалось сохранить категорию",sub:"Проверьте соединение"});
      setData(d=>{const key=tabType==="expense"?"exp_cats":"inc_cats";return{...d,[key]:[...(d[key]||[]),{icon:catIcon,name:catName.trim(),id:Date.now()}]};});
    }finally{setSaving(false);}
    setCatName("");setCatIcon("📦");setShowAdd(false);
  }

  async function delCat(cat,idx){
    if(cat.id){try{await API.delCategory(cat.id);}catch(e){console.error(e);}}
    setData(d=>{const key=tabType==="expense"?"exp_cats":"inc_cats";return{...d,[key]:(d[key]||[]).filter((_,i)=>i!==idx)};});
  }

  return h("div",{className:"screen anim-fade"},
    h("div",{className:"ph"},
      h("div",{className:"back",onClick:onBack},"←"),
      h("div",{className:"ph-title"},"Категории"),
      h("div",{className:"ph-action",style:{cursor:"pointer",fontFamily:F,fontSize:11,fontWeight:700,letterSpacing:1},onClick:()=>setShowAdd(true)},
        "+ НОВАЯ"
      )
    ),
    h("div",{className:"scroll",style:{padding:"0 16px"}},
      // Expense / Income toggle
      h("div",{style:{background:C.card,borderRadius:16,border:"1px solid "+C.bdr,display:"flex",marginBottom:12,padding:4,gap:4}},
        ["expense","income"].map(t=>h("div",{key:t,
          onClick:()=>{setTabType(t);setShowAdd(false);setCatName("");},
          style:{flex:1,padding:"10px 6px",borderRadius:12,textAlign:"center",cursor:"pointer",transition:"all .15s",
            background:tabType===t?C.ink:"transparent",
            color:tabType===t?C.sur:C.ink2,
            fontFamily:F,fontSize:13,fontWeight:700}
        },t==="expense"?"Расходы":"Доходы"))
      ),
      // Category list card
      h("div",{style:{background:C.card,borderRadius:18,border:"1px solid "+C.bdr,overflow:"hidden",marginBottom:12}},
        cats.length===0
          ?h("div",{style:{padding:"28px 16px",textAlign:"center",color:C.ink3,fontSize:13}})
          :cats.map((c,i)=>h("div",{key:c.id||i},
            h("div",{style:{display:"flex",alignItems:"center",gap:12,padding:"13px 16px"}},
              h("div",{style:{width:42,height:42,borderRadius:12,background:C.bg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0}},c.icon),
              h("div",{style:{flex:1,fontSize:14,fontWeight:700,color:C.ink}},c.name),
              h("div",{onClick:()=>delCat(c,i),style:{fontSize:20,color:C.ink3,cursor:"pointer",padding:"4px 10px",lineHeight:1}},"×")
            ),
            i<cats.length-1&&h("div",{style:{height:1,background:C.bdr,marginLeft:54}})
          ))
      ),
      h("div",{className:"btn btn-gray",style:{width:"100%"},onClick:()=>setShowAdd(true)},"+ ДОБАВИТЬ КАТЕГОРИЮ"),
      h("div",{onClick:async()=>{
        if(!confirm("Восстановить все категории по умолчанию? Пользовательские категории будут удалены."))return;
        const key=tabType==="expense"?"exp_cats":"inc_cats";
        try{
          const cats=await fetch(API_URL+"/api/categories/reset",{
            method:"POST",
            headers:{"Content-Type":"application/json","X-Init-Data":window.Telegram?.WebApp?.initData||""},
            body:JSON.stringify({type:tabType})
          }).then(r=>r.ok?r.json():Promise.reject());

/* ── GOALS HELPERS ── */
const RU_MONTHS_SHORT=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
function monthsBetween(fromY,fromM,toY,toM){return(toY-fromY)*12+(toM-fromM);}
function compactFmt(n){if(n>=1000000)return(n/1000000).toFixed(1)+"М";if(n>=1000)return Math.round(n/1000)+"К";return String(Math.round(n));}

function GoalProgressBar({value,max,height=6,tone='ink',track}){
  const colors={ink:C.ink,green:"#16A34A",amber:"#D97706",flame:"linear-gradient(90deg,#D97706,#F59E0B)",red:"#DC2626"};
  const fill=colors[tone]||colors.ink;
  const pct=max>0?Math.min(Math.round(value/max*100),100):0;
  return h("div",{style:{height:height,background:track||C.bdr,borderRadius:height/2,overflow:"hidden"}},
    h("div",{style:{height:"100%",borderRadius:height/2,width:pct+"%",background:fill,transition:"width .4s ease"}})
  );
}

function GoalProgressRing({value,max=100,size=160,stroke=12,tone='flame',children}){
  const colors={flame:"#F59E0B",green:"#16A34A",amber:"#D97706",ink:"#111318"};
  const color=colors[tone]||colors.flame;
  const r=(size-stroke)/2;
  const c=2*Math.PI*r;
  const pct=max>0?Math.min(value/max,1):0;
  const dash=c*pct;
  return h("div",{style:{position:"relative",width:size,height:size,display:"flex",alignItems:"center",justifyContent:"center"}},
    h("svg",{width:size,height:size,style:{position:"absolute",top:0,left:0,transform:"rotate(-90deg)"}},
      h("circle",{cx:size/2,cy:size/2,r,fill:"none",stroke:"rgba(0,0,0,0.07)",strokeWidth:stroke}),
      h("circle",{cx:size/2,cy:size/2,r,fill:"none",stroke:color,strokeWidth:stroke,
        strokeDasharray:`${dash} ${c}`,strokeLinecap:"round",style:{transition:"stroke-dasharray .5s ease"}})
    ),
    h("div",{style:{position:"relative",zIndex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}},
      children
    )
  );
}

function GoalStepDots({total,done,current,tone='flame',labels}){
  const colors={flame:"#F59E0B",green:"#16A34A",amber:"#D97706",ink:"#111318"};
  const activeColor=colors[tone]||colors.flame;
  return h("div",{style:{display:"flex",alignItems:"flex-end",gap:4,flexWrap:"wrap"}},
    Array.from({length:total},(_,i)=>{
      const isDone=i<done;
      const isCur=i===done&&i===current;
      const dotSize=isCur?14:10;
      return h("div",{key:i,style:{display:"flex",flexDirection:"column",alignItems:"center",gap:3}},
        h("div",{style:{width:dotSize,height:dotSize,borderRadius:"50%",flexShrink:0,transition:"all .2s",
          background:isDone?activeColor:isCur?"#fff":"#ECEEF2",
          border:isCur?`2px solid ${activeColor}`:"none"}}),
        labels&&labels[i]&&h("div",{style:{fontSize:8,fontFamily:F,textTransform:"uppercase",color:"#B0B7C3",letterSpacing:.5,whiteSpace:"nowrap"}},labels[i])
      );
    })
  );
}

function GoalBottomSheet({open,onClose,children,height='88%'}){
  useScrollLock(open);
  if(!open)return null;
  return h("div",{style:{position:"absolute",inset:0,zIndex:50}},
    h("div",{onClick:onClose,style:{position:"absolute",inset:0,background:"rgba(0,0,0,0.55)"}}),
    h("div",{style:{position:"absolute",left:0,right:0,bottom:0,background:C.card,borderRadius:"28px 28px 0 0",
      maxHeight:height,display:"flex",flexDirection:"column"}},
      children
    )
  );
}

/* ── SAVINGS JARS SCREEN (Копилки) ── */
function SavingsScreen({data,setData,onBack}){
  const API_URL=window.FINLY_API_URL||"";
  const getInitData=()=>window.Telegram?.WebApp?.initData||"";
  const[jars,setJars]=useState(data.savingsJars||[]);
  const[showAdd,setShowAdd]=useState(false);
  const[editJar,setEditJar]=useState(null);
  const[showDeposit,setShowDeposit]=useState(null);
  const[form,setForm]=useState({name:"",emoji:"💰",note:"",target:""});
  const[depositAmt,setDepositAmt]=useState("");
  const[depositType,setDepositType]=useState("add"); // "add" | "set"
  const[saving,setSaving]=useState(false);

  // No pig, no goals-style emojis — these are money buckets
  const EMOJIS=["💰","🏦","💵","🗃️","🌴","🚗","🏠","✈️","💻","📱","👑","🎸","👶","💍","🎓","⚽"];

  async function saveJar(){
    if(!form.name.trim()||saving)return;
    setSaving(true);
    try{
      const body={name:form.name.trim(),emoji:form.emoji,note:form.note,target:parseInt(form.target.replace(/\D/g,""))||0};
      let updated;
      if(editJar){
        const r=await fetch(API_URL+"/api/savings/"+editJar.id,{
          method:"PATCH",headers:{"Content-Type":"application/json","X-Init-Data":getInitData()},
          body:JSON.stringify(body)});
        updated=await r.json();
      } else {
        const r=await fetch(API_URL+"/api/savings",{
          method:"POST",headers:{"Content-Type":"application/json","X-Init-Data":getInitData()},
          body:JSON.stringify(body)});
        updated=await r.json();
      }
      const upd=editJar
        ? (prev=>prev.map(j=>j.id===editJar.id?updated:j))
        : (prev=>[updated,...prev]);
      setJars(upd);
      setData(prev=>({...prev,savingsJars:upd(prev.savingsJars)}));
      setShowAdd(false);setEditJar(null);setForm({name:"",emoji:"💰",note:""});
    }catch(e){alert("Ошибка: "+e.message);}
    setSaving(false);
  }

  async function deleteJar(jar){
    if(!confirm(`Удалить «${jar.name}»?`))return;
    try{
      await fetch(API_URL+"/api/savings/"+jar.id,{method:"DELETE",headers:{"X-Init-Data":getInitData()}});
      const upd=prev=>prev.filter(j=>j.id!==jar.id);
      setJars(upd);setData(prev=>({...prev,savingsJars:upd(prev.savingsJars)}));
    }catch{}
  }

  async function doDeposit(){
    if(!showDeposit||saving)return;
    const amt=parseInt(depositAmt.replace(/\D/g,""))||0;
    if(amt<=0)return;
    setSaving(true);
    try{
      const newBal=depositType==="set"?amt:(showDeposit.balance||0)+amt;
      const r=await fetch(API_URL+"/api/savings/"+showDeposit.id,{
        method:"PATCH",headers:{"Content-Type":"application/json","X-Init-Data":getInitData()},
        body:JSON.stringify({balance:newBal})});
      const updated=await r.json();
      const upd=prev=>prev.map(j=>j.id===showDeposit.id?updated:j);
      setJars(upd);setData(prev=>({...prev,savingsJars:upd(prev.savingsJars)}));
      setShowDeposit(null);setDepositAmt("");
    }catch{}
    setSaving(false);
  }

  function openAdd(){setForm({name:"",emoji:"💰",note:"",target:""});setEditJar(null);setShowAdd(true);}
  function openEdit(jar){setForm({name:jar.name,emoji:jar.emoji,note:jar.note||"",target:jar.target?String(jar.target):""});setEditJar(jar);setShowAdd(true);}

  const totalSaved=jars.reduce((s,j)=>s+(j.balance||0),0);

  return h("div",{className:"screen anim-fade"},
    // Header
    h("div",{style:{display:"flex",alignItems:"center",gap:12,padding:"16px 16px 0"}},
      h("div",{onClick:onBack,style:{fontSize:22,cursor:"pointer",color:C.ink3,width:36,height:36,display:"flex",alignItems:"center",justifyContent:"center",borderRadius:12,background:C.bg}},"←"),
      h("div",{style:{flex:1}},
        h("div",{style:{fontFamily:F,fontSize:20,fontWeight:800,color:C.ink}},"Копилки"),

      h("div",{onClick:openAdd,style:{background:C.ink,color:C.sur,borderRadius:12,padding:"8px 16px",fontFamily:F,fontSize:13,fontWeight:700,cursor:"pointer"}},"+")
    ),

    // Summary banner

      h("div",{style:{fontFamily:F,fontSize:28,fontWeight:800,color:"#fff"}},fmt(totalSaved)+" сум"),

          h("div",{style:{fontFamily:F,fontSize:18,fontWeight:800,color:C.ink}},editJar?"Редактировать копилку":"Новая копилка"),
          h("div",{onClick:()=>{setShowAdd(false);setEditJar(null);},style:{fontSize:20,color:C.ink3,cursor:"pointer",width:32,height:32,display:"flex",alignItems:"center",justifyContent:"center"}},"✕")

/* ── GOALS SCREEN ── */
function GoalsScreen({data,setData,onBack}){
  const API_URL=window.FINLY_API_URL||"";
  const getInitData=()=>window.Telegram?.WebApp?.initData||"";
  const[goals,setGoals]=useState(data.personalGoals||[]);
  const[goalsLoading,setGoalsLoading]=useState(!(data.personalGoals&&data.personalGoals.length));
  const[view,setView]=useState("list"); // list | detail | completion
  const[activeGoal,setActiveGoal]=useState(null);
  const[showCreate,setShowCreate]=useState(false);
  const[sharedGoals,setSharedGoals]=useState([]);
  const[deleteConfirm,setDeleteConfirm]=useState(null);

  useEffect(()=>{
    // Only re-fetch if no data pre-loaded
    if(!data.personalGoals||!data.personalGoals.length){
      fetch(API_URL+"/api/personal_goals",{headers:{"X-Init-Data":getInitData()}})
        .then(r=>r.ok?r.json():[]).then(d=>{
          setGoals(d);
          if(setData)setData(prev=>({...prev,personalGoals:d}));
          setGoalsLoading(false);
        }).catch(()=>setGoalsLoading(false));
    } else {
      setGoalsLoading(false);
    }
    fetch(API_URL+"/api/shared_goals",{headers:{"X-Init-Data":getInitData()}})
      .then(r=>r.ok?r.json():null).then(d=>{if(d)setSharedGoals(d);}).catch(()=>{});
  },[]);

  async function handleSharedGoal(id,action){
    try{
      await fetch(API_URL+"/api/shared_goals/"+id,{
        method:"PATCH",
        headers:{"Content-Type":"application/json","X-Init-Data":getInitData()},
        body:JSON.stringify({action})
      });
      setSharedGoals(prev=>prev.map(g=>g.id===id?{...g,status:action==="accept"?"active":"rejected"}:g));
    }catch{}
  }

  async function addGoal(g){
    const now=new Date();
    const startY=now.getFullYear(),startM=now.getMonth()+1;
    const dur=parseInt(g.duration)||6;
    let deadlineM=startM+dur,deadlineY=startY;
    while(deadlineM>12){deadlineM-=12;deadlineY++;}
    try{
      const r=await fetch(API_URL+"/api/personal_goals",{
        method:"POST",
        headers:{"Content-Type":"application/json","X-Init-Data":getInitData()},
        body:JSON.stringify({emoji:g.emoji||"🎯",name:g.name,target:parseInt(g.target)||0,
          duration:dur,start_year:startY,start_month:startM,deadline_year:deadlineY,deadline_month:deadlineM})
      });
      if(r.ok){
        const newGoal=await r.json();
        setGoals(prev=>{
          const updated=[...prev,newGoal];
          if(setData)setData(d=>({...d,personalGoals:updated}));
          return updated;
        });
      }
    }catch(e){console.error("addGoal:",e);}
    setShowCreate(false);
  }

  async function addContribution(goalId,amount,label){
    const g=goals.find(x=>x.id===goalId);
    if(!g)return;
    const newSaved=g.saved+amount;
    const contrib={label:label||"Пополнение",date:today(),amount:String(amount)};
    const newContributions=[contrib,...(g.contributions||[])];
    const done=newSaved>=g.target;
    try{
      const r=await fetch(API_URL+"/api/personal_goals/"+goalId,{
        method:"PATCH",
        headers:{"Content-Type":"application/json","X-Init-Data":getInitData()},
        body:JSON.stringify({saved:newSaved,contributions:newContributions,done})
      });
      if(r.ok){
        const upd=await r.json();
        setGoals(prev=>prev.map(x=>x.id===goalId?upd:x));
        setActiveGoal(upd);
        if(upd.saved>=upd.target)setView("completion");
      }
    }catch(e){console.error("addContribution:",e);}
  }

  async function deleteGoal(goalId,returnMoney){
    try{
      const r=await fetch(API_URL+"/api/personal_goals/"+goalId,{
        method:"DELETE",
        headers:{"X-Init-Data":getInitData()}
      });
      if(r.ok){
        if(returnMoney){
          const g=goals.find(x=>x.id===goalId);
          if(g&&g.saved>0){
            await fetch(API_URL+"/api/transactions",{
              method:"POST",
              headers:{"Content-Type":"application/json","X-Init-Data":getInitData()},
              body:JSON.stringify({
                type:"income",
                cat_icon:g.emoji||"🎯",
                cat_name:"Возврат из цели",
                note:"Возврат: "+g.name,
                amount:g.saved,
                date_str:today(),
                time_str:new Date().toTimeString().slice(0,5),
                currency:"UZS",
                recurring:false,
                account:"Наличка"
              })
            });
          }
        }
        setGoals(prev=>{
          const updated=prev.filter(g=>g.id!==goalId);
          if(setData)setData(d=>({...d,personalGoals:updated}));
          return updated;
        });
      }
    }catch(e){console.error("deleteGoal:",e);}
  }

  async function completeGoal(goalId){
    const g=goals.find(x=>x.id===goalId);
    try{
      const r=await fetch(API_URL+"/api/personal_goals/"+goalId,{
        method:"PATCH",
        headers:{"Content-Type":"application/json","X-Init-Data":getInitData()},
        body:JSON.stringify({done:true,done_date:today()})
      });
      if(r.ok){
        const upd=await r.json();
        setGoals(prev=>prev.map(x=>x.id===goalId?upd:x));
      }
    }catch(e){console.error("completeGoal:",e);}
    setView("list");
    track("goal_completed",{name:g?.name,target:g?.target,saved:g?.saved});
  }

  // ── Empty state ──
  if(goals.length===0&&!showCreate&&!goalsLoading){
    return h("div",{className:"screen anim-fade",style:{background:C.bg,position:"relative"}},
      h("div",{className:"ph"},
        h("div",{className:"back",onClick:onBack},"←"),
        h("div",{className:"ph-title"},"Цели"),
        h("div",{className:"ph-action",style:{cursor:"pointer",fontFamily:F,fontSize:11,fontWeight:700,letterSpacing:1},onClick:()=>setShowCreate(true)},
          "+ Новая"
        )
      ),
      h("div",{className:"scroll",style:{padding:"0 16px",display:"flex",flexDirection:"column",alignItems:"center"}},
        h("div",{style:{height:60}}),
        // Amber glow halo
        h("div",{style:{position:"relative",marginBottom:24,display:"flex",alignItems:"center",justifyContent:"center"}},
          h("div",{style:{position:"absolute",width:160,height:160,borderRadius:"50%",background:"radial-gradient(circle,rgba(245,158,11,0.18) 0%,transparent 70%)"}}),
          h("div",{style:{width:96,height:96,borderRadius:"50%",background:"#F59E0B",display:"flex",alignItems:"center",justifyContent:"center",fontSize:44,position:"relative",zIndex:1,boxShadow:"0 8px 32px rgba(245,158,11,0.35)"}},"🎯")
        ),
        h("div",{style:{fontFamily:F,fontSize:24,fontWeight:800,color:C.ink,marginBottom:10,textAlign:"center"}},"Поставьте первую цель."),
        h("div",{style:{fontSize:14,color:C.ink2,textAlign:"center",lineHeight:1.6,marginBottom:28,maxWidth:260}},
          "Откладывайте на мечту шаг за шагом. Цели помогут вам копить осознанно."),
        h("div",{onClick:()=>setShowCreate(true),style:{background:C.ink,color:C.sur,borderRadius:28,padding:"16px 36px",fontFamily:F,fontSize:14,fontWeight:700,letterSpacing:1,cursor:"pointer",marginBottom:36}},
          "＋ Создать цель"),
        // Popular shortcuts
        h("div",{style:{width:"100%",maxWidth:340}},
          h("div",{style:{fontFamily:F,fontSize:10,fontWeight:700,color:C.ink3,letterSpacing:2,textTransform:"uppercase",marginBottom:10,textAlign:"center"}},"ПОПУЛЯРНЫЕ ЦЕЛИ"),
          [
            {emoji:"✈️",name:"Путешествие",hint:"от 8 000 000"},
            {emoji:"📱",name:"Новый гаджет",hint:"от 5 000 000"},
            {emoji:"🛡️",name:"Подушка безопасности",hint:"3× расходов"},
          ].map(item=>h("div",{key:item.name,onClick:()=>setShowCreate(true),
            style:{background:C.card,borderRadius:16,padding:"14px 16px",marginBottom:8,display:"flex",alignItems:"center",gap:14,cursor:"pointer",border:"1px solid "+C.bdr}},
            h("div",{style:{fontSize:26,flexShrink:0}},item.emoji),
            h("div",{style:{flex:1}},
              h("div",{style:{fontFamily:F,fontSize:14,fontWeight:700,color:C.ink}},item.name),
              h("div",{style:{fontSize:12,color:C.ink3,marginTop:2}},item.hint)
            ),
            h("div",{style:{color:C.ink3,fontSize:18}},"›")
          ))
        ),
        h("div",{style:{height:30}})
      ),
      // Create sheet
      h(GoalBottomSheet,{open:showCreate,onClose:()=>setShowCreate(false)},
        h(GoalCreateForm,{onClose:()=>setShowCreate(false),onSubmit:addGoal})
      )
    );
  }

  // ── Completion state ──
  if(view==="completion"&&activeGoal){
    const months=monthsBetween(activeGoal.startY,activeGoal.startM,
      new Date().getFullYear(),new Date().getMonth()+1)||1;
    return h("div",{className:"screen anim-fade",style:{background:"#1C1C1E",position:"relative",overflow:"hidden"}},
      // Glows
      h("div",{style:{position:"absolute",top:-60,left:-60,width:220,height:220,borderRadius:"50%",background:"radial-gradient(circle,rgba(245,158,11,0.18) 0%,transparent 70%)",pointerEvents:"none"}}),
      h("div",{style:{position:"absolute",bottom:-80,right:-80,width:280,height:280,borderRadius:"50%",background:"radial-gradient(circle,rgba(245,158,11,0.10) 0%,transparent 70%)",pointerEvents:"none"}}),
      // Confetti dots
      ...[...Array(12)].map((_,i)=>h("div",{key:i,style:{position:"absolute",
        top:Math.random()*60+"%",left:Math.random()*100+"%",
        width:6+Math.random()*6,height:6+Math.random()*6,
        borderRadius:"50%",background:["#F59E0B","#16A34A","#DC2626","#fff","#D97706"][i%5],
        opacity:.6,pointerEvents:"none"}})),
      h("div",{className:"scroll",style:{padding:"0 20px",display:"flex",flexDirection:"column",alignItems:"center",paddingTop:60}},
        // Medallion
        h("div",{style:{position:"relative",marginBottom:24}},
          h("div",{style:{position:"absolute",inset:-16,borderRadius:"50%",background:"radial-gradient(circle,rgba(245,158,11,0.25) 0%,transparent 70%)"}}),
          h("div",{style:{width:96,height:96,borderRadius:"50%",background:"linear-gradient(135deg,#D97706,#F59E0B)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:44,position:"relative",zIndex:1,boxShadow:"0 8px 40px rgba(245,158,11,0.5)"}},activeGoal.emoji)
        ),
        h("div",{style:{fontFamily:F,fontSize:10,fontWeight:700,color:"rgba(255,255,255,0.4)",letterSpacing:2,textTransform:"uppercase",marginBottom:8}},"ЦЕЛЬ ДОСТИГНУТА"),
        h("div",{style:{fontFamily:F,fontSize:26,fontWeight:800,color:"#fff",textAlign:"center",marginBottom:28}},activeGoal.name+" 🎉"),
        // Result card
        h("div",{style:{background:"rgba(255,255,255,0.06)",borderRadius:20,padding:"20px 16px",width:"100%",marginBottom:28}},
          h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1px 1fr 1px 1fr",gap:0}},
            h("div",{style:{textAlign:"center"}},
              h("div",{style:{fontFamily:F,fontSize:18,fontWeight:800,color:"#F59E0B"}},compactFmt(activeGoal.saved)),

            ),
            h("div",{style:{background:"rgba(255,255,255,0.08)"}}),
            h("div",{style:{textAlign:"center"}},

            h("div",{style:{background:"rgba(255,255,255,0.08)"}}),
            h("div",{style:{textAlign:"center"}},

        h("div",{onClick:()=>setShowCreate(true),style:{background:"linear-gradient(90deg,#D97706,#F59E0B)",color:"#fff",borderRadius:20,padding:"16px",fontFamily:F,fontSize:13,fontWeight:700,letterSpacing:1,cursor:"pointer",width:"100%",textAlign:"center",marginBottom:10}},
          "Создать новую цель"),
        h("div",{onClick:onBack,style:{color:"rgba(255,255,255,0.5)",fontFamily:F,fontSize:13,fontWeight:700,cursor:"pointer",padding:"12px",textAlign:"center"}},
          "На главную")
      ),
      h(GoalBottomSheet,{open:showCreate,onClose:()=>setShowCreate(false)},
        h(GoalCreateForm,{onClose:()=>setShowCreate(false),onSubmit:addGoal})
      )
    );
  }

  // ── Detail state ──
  if(view==="detail"&&activeGoal){
    return h(GoalDetailView,{goal:activeGoal,onBack:()=>setView("list"),onContribution:addContribution,onComplete:()=>{completeGoal(activeGoal.id);setView("completion");}});
  }

  // ── List state ──
  const now=new Date();
  const activeGoals=goals.filter(g=>!g.done);
  const doneGoals=goals.filter(g=>g.done);
  const totalSaved=activeGoals.reduce((s,g)=>s+g.saved,0);
  const totalTarget=activeGoals.reduce((s,g)=>s+g.target,0);
  const overallPct=totalTarget>0?Math.min(Math.round(totalSaved/totalTarget*100),100):0;
  const totalMonthlyNeeded=activeGoals.reduce((s,g)=>{
    const moLeft=Math.max(monthsBetween(now.getFullYear(),now.getMonth()+1,g.deadlineY,g.deadlineM),1);
    return s+Math.ceil(Math.max(g.target-g.saved,0)/moLeft);
  },0);
  // Find nearest deadline
  const nearest=activeGoals.slice().sort((a,b)=>{
    const ma=a.deadlineY*12+a.deadlineM,mb=b.deadlineY*12+b.deadlineM;return ma-mb;
  })[0];
  const nearestStr=nearest?RU_MONTHS_SHORT[nearest.deadlineM-1]+" "+nearest.deadlineY:"—";

  return h("div",{className:"screen anim-fade",style:{background:C.bg,position:"relative"}},
    h("div",{className:"ph"},
      h("div",{className:"back",onClick:onBack},"←"),
      h("div",{className:"ph-title"},"Цели"),
      h("div",{className:"ph-action",style:{cursor:"pointer",fontFamily:F,fontSize:11,fontWeight:700,letterSpacing:1},onClick:()=>setShowCreate(true)},
        "+ Новая"
      )
    ),
    h("div",{className:"scroll",style:{padding:"0 16px"}},
      // Dark summary card
      h("div",{style:{background:"#1C1C1E",borderRadius:22,padding:"20px 18px",marginBottom:12,color:"#fff"}},
        h("div",{style:{fontFamily:F,fontSize:9,fontWeight:700,color:"rgba(255,255,255,0.45)",letterSpacing:2,textTransform:"uppercase",marginBottom:6}},
          "Накоплено · сум"),
        h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:10}},
          h("div",{style:{fontFamily:F,fontSize:32,fontWeight:700,color:"#fff"}},compactFmt(totalSaved)),
          h("div",{style:{fontFamily:F,fontSize:14,fontWeight:700,color:"#F59E0B"}},overallPct+"%")

          h("div",{style:{textAlign:"center"}},
            h("div",{style:{fontFamily:F,fontSize:16,fontWeight:800,color:"#fff"}},goals.length),
            h("div",{style:{fontSize:9,fontWeight:700,color:"rgba(255,255,255,0.35)",letterSpacing:1,textTransform:"uppercase",marginTop:3}},"Активные")),
          h("div",{style:{background:"rgba(255,255,255,0.08)"}}),
          h("div",{style:{textAlign:"center",padding:"0 4px"}},
            h("div",{style:{fontFamily:F,fontSize:16,fontWeight:800,color:"#fff"}},compactFmt(totalMonthlyNeeded)),
            h("div",{style:{fontSize:9,fontWeight:700,color:"rgba(255,255,255,0.35)",letterSpacing:1,textTransform:"uppercase",marginTop:3}},"В месяц")),
          h("div",{style:{background:"rgba(255,255,255,0.08)"}}),
          h("div",{style:{textAlign:"center",padding:"0 4px"}},
            h("div",{style:{fontFamily:F,fontSize:14,fontWeight:800,color:"#F59E0B"}},nearestStr),
            h("div",{style:{fontSize:9,fontWeight:700,color:"rgba(255,255,255,0.35)",letterSpacing:1,textTransform:"uppercase",marginTop:3}},"Ближайшая"))
        )
      ),
      // Shared goals — incoming pending invites (not mine, I need to accept/reject)
      ...sharedGoals.filter(sg=>!sg.is_mine&&sg.status==="pending"&&sg.my_member_status==="pending").map(sg=>
        h("div",{key:"sg-inv-"+sg.id,style:{background:C.card,borderRadius:18,border:"1.5px solid #D97706",padding:"14px 16px",marginBottom:8}},
          h("div",{style:{display:"flex",alignItems:"center",gap:10,marginBottom:10}},
            h("div",{style:{fontSize:24}},"🤝"),
            h("div",{style:{flex:1}},
              h("div",{style:{fontFamily:F,fontSize:11,fontWeight:700,color:"#D97706",letterSpacing:1,textTransform:"uppercase"}},"ПРИГЛАШЕНИЕ · СОВМЕСТНАЯ ЦЕЛЬ"),
              h("div",{style:{fontFamily:F,fontSize:14,fontWeight:700,color:C.ink}},sg.emoji+" "+sg.name),
              h("div",{style:{fontSize:11,color:C.ink3,marginTop:2}},(sg.creator?.name||"Друг")+" · цель: "+fmt(sg.target)+" сум")
            )
          ),
          h("div",{style:{display:"flex",gap:8}},
            h("div",{onClick:()=>handleSharedGoal(sg.id,"accept"),
              style:{flex:1,padding:"9px",borderRadius:12,background:C.grBg,fontFamily:F,fontSize:12,fontWeight:700,color:C.gr,textAlign:"center",cursor:"pointer"}},
              "✅ Принять"),
            h("div",{onClick:()=>handleSharedGoal(sg.id,"reject"),
              style:{flex:1,padding:"9px",borderRadius:12,background:C.rdBg,fontFamily:F,fontSize:12,fontWeight:700,color:C.rd,textAlign:"center",cursor:"pointer"}},
              "❌ Отклонить")
          )
        )
      ),
      // Shared goals — mine pending (waiting for partners to accept)
      ...sharedGoals.filter(sg=>sg.is_mine&&sg.status==="pending").map(sg=>
        h("div",{key:"sg-wait-"+sg.id,style:{background:C.card,borderRadius:18,border:"1.5px dashed #6366F1",padding:"14px 16px",marginBottom:8,opacity:.9}},
          h("div",{style:{display:"flex",alignItems:"center",gap:10}},
            h("div",{style:{fontSize:22}},"⏳"),
            h("div",{style:{flex:1}},
              h("div",{style:{fontFamily:F,fontSize:11,fontWeight:700,color:"#6366F1",letterSpacing:1,textTransform:"uppercase"}},"ОЖИДАЕТ ПОДТВЕРЖДЕНИЯ"),
              h("div",{style:{fontFamily:F,fontSize:14,fontWeight:700,color:C.ink}},sg.emoji+" "+sg.name),
              h("div",{style:{fontSize:11,color:C.ink3,marginTop:2}},
                (sg.members||[]).map(m=>m.name).join(", ")||"Нет участников")
            ),
            h("div",{style:{fontSize:11,fontWeight:700,color:"#6366F1",background:"rgba(99,102,241,0.10)",padding:"4px 10px",borderRadius:8}},fmt(sg.target))
          )
        )
      ),
      // Shared goals — active (both mine and partner's) — shown as ONE widget
      ...sharedGoals.filter(sg=>sg.status==="active").map(sg=>{
        const pct=sg.target>0?Math.min(Math.round(sg.saved/sg.target*100),100):0;
        const otherMembers=(sg.members||[]).filter(m=>m.id!==(window.Telegram?.WebApp?.initDataUnsafe?.user?.id));
        const partnerLabel=otherMembers.map(m=>m.name).join(", ")||(sg.is_mine?"":(sg.creator?.name||"Друг"));
        return h("div",{key:"sg-act-"+sg.id,
          onClick:()=>{
            setActiveGoal({

      }),
      h("div",{style:{fontFamily:F,fontSize:11,fontWeight:700,color:"#B0B7C3",letterSpacing:2,textTransform:"uppercase",marginBottom:10}},
        "АКТИВНЫЕ · "+activeGoals.length),
      // Goal cards (active only)
      ...activeGoals.map(g=>{
        const pct=g.target>0?Math.min(Math.round(g.saved/g.target*100),100):0;
        const moLeft=Math.max(monthsBetween(now.getFullYear(),now.getMonth()+1,g.deadlineY,g.deadlineM),0);
        const deadlineStr=RU_MONTHS_SHORT[g.deadlineM-1]+" "+g.deadlineY;
        return h("div",{key:g.id,style:{background:C.card,borderRadius:20,border:"1px solid "+C.bdr,padding:"16px",marginBottom:8}},
          h("div",{style:{display:"flex",alignItems:"center",gap:12,marginBottom:10},onClick:()=>{setActiveGoal(g);setView("detail");},style:{cursor:"pointer",display:"flex",alignItems:"center",gap:12,marginBottom:10}},
            h("div",{style:{width:42,height:42,borderRadius:12,background:C.bg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}},g.emoji),
            h("div",{style:{flex:1}},
              h("div",{style:{fontFamily:F,fontSize:15,fontWeight:700,color:C.ink}},g.name),
              h("div",{style:{fontSize:12,color:C.ink2,marginTop:2}},
                deadlineStr+" · "+(g.onPlan?"по плану":"отстаём"))
            ),
            h("div",{style:{fontFamily:F,fontSize:20,fontWeight:800,color:C.ink}},pct+"%"),
            h("div",{onClick:e=>{e.stopPropagation();setDeleteConfirm({goal:g});},
              style:{width:28,height:28,borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",
                background:"#FEF2F2",color:"#DC2626",fontSize:14,cursor:"pointer",flexShrink:0}},
              "🗑")
          ),
          h(GoalProgressBar,{value:g.saved,max:g.target,height:6,tone:"flame",track:C.bdr}),
          h("div",{style:{display:"flex",justifyContent:"space-between",marginTop:8},onClick:()=>{setActiveGoal(g);setView("detail");},style:{cursor:"pointer",display:"flex",justifyContent:"space-between",marginTop:8}},
            h("div",{style:{fontSize:12,color:C.ink2}},compactFmt(g.saved)+" сум"),
            h("div",{style:{fontSize:12,color:C.ink3}},moLeft+" мес. осталось")
          )
        );
      }),
      // Add dashed card
      h("div",{onClick:()=>setShowCreate(true),style:{borderRadius:20,border:"2px dashed "+C.bdr,padding:"20px 16px",marginBottom:8,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:8}},

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Finly</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;height:100dvh;background:#F4F5F7;font-family:'DM Sans',sans-serif;overflow:hidden;}
/* Space Grotesk numerals: tabular (column-aligned) + lining figures — critical for readable money amounts */
[style*="Space Grotesk"],.finput,.kpi-val,.logo{font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum" 1,"lnum" 1;}
::-webkit-scrollbar{display:none;}*{scrollbar-width:none;}
#app{width:100%;height:100%;height:100dvh;background:#F4F5F7;overflow:hidden;display:flex;flex-direction:column;position:relative;}

@keyframes slideUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
@keyframes pwUp{from{opacity:0;transform:translateY(22px);}to{opacity:1;transform:translateY(0);}}
@keyframes rankBounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-14px);}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}
.anim-up{animation:slideUp .22s ease forwards;}
.anim-fade{animation:fadeIn .18s ease forwards;}
.screen{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;z-index:1;}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
/* NAV */
.navbar{background:#fff;padding:6px 4px 18px;display:flex;gap:2px;flex-shrink:0;}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:12px;cursor:pointer;transition:all .12s;position:relative;}
.ni.act{background:#F4F5F7;}
.ni-icon{font-size:20px;line-height:1;}
.ni-lbl{font-family:'Space Grotesk',sans-serif;font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#B0B7C3;}
.ni.act .ni-lbl{color:#111318;}
.ni-dot{position:absolute;top:6px;right:8px;width:7px;height:7px;border-radius:50%;background:#DC2626;border:2px solid #F4F5F7;}
/* STATUS BAR */
.sb{display:flex;justify-content:space-between;align-items:center;padding:14px 22px 4px;font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:700;flex-shrink:0;}
.sb.light{color:#111318;background:#F4F5F7;}
.sb.dark{color:rgba(255,255,255,.7);background:#1C1C1E;}
/* PAGE HEADER */
.ph{display:flex;align-items:center;gap:12px;padding:8px 20px 14px;background:#F4F5F7;flex-shrink:0;}
.back{font-size:24px;cursor:pointer;color:#111318;line-height:1;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:#F4F5F7;}
.ph-title{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:800;color:#111318;flex:1;}
.ph-action{font-size:12px;font-weight:700;color:#6B7280;cursor:pointer;padding:8px 12px;border-radius:10px;background:#F4F5F7;}
/* CARDS */
.card{background:#fff;border-radius:20px;}
/* BUTTONS */
.btn{border-radius:16px;padding:16px;font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;text-align:center;cursor:pointer;transition:all .12s;border:none;outline:none;-webkit-tap-highlight-color:transparent;}
.btn:active{transform:scale(.97);}
.btn-ink{background:#111318;color:#fff;}
.btn-ink:active{background:#2a2a30;}
.btn-red{background:#DC2626;color:#fff;}
.btn-gray{background:#F0F0F2;color:#111318;}
.btn-red-out{background:#FEF2F2;color:#DC2626;}
/* TX CARD */
.txc{background:#fff;border-radius:18px;padding:14px 16px;margin-bottom:8px;cursor:pointer;transition:all .1s;}
.txc:active{transform:scale(.98);background:#FAFAFA;}
.tx-icon{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
/* FORM */
.flabel{font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:700;color:#B0B7C3;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:7px;display:block;}
.finput{width:100%;background:#F4F5F7;border:none;border-radius:14px;padding:14px 16px;font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#111318;outline:none;}

.finput.sm{font-size:15px;font-family:'DM Sans',sans-serif;font-weight:600;}
textarea.finput{font-size:14px;font-family:'DM Sans',sans-serif;resize:none;height:70px;font-weight:400;}
/* TOGGLE */
.tog{width:44px;height:26px;border-radius:13px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;}
.tog.on{background:#111318;}.tog.off{background:#D1D5DB;}
.tog-k{width:20px;height:20px;border-radius:50%;background:#fff;position:absolute;top:3px;transition:left .15s;box-shadow:0 1px 4px rgba(0,0,0,.2);}
.tog.on .tog-k{left:21px;}.tog.off .tog-k{left:3px;}
/* CAT GRID */
.catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;}
.catbtn{padding:14px 6px;border-radius:14px;background:#F4F5F7;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;transition:all .1s;border:1.5px solid transparent;}
.catbtn:active{transform:scale(.96);}
.catbtn.sel-e,.catbtn.sel-i{background:#111318;border-color:#111318;}
.catbtn-icon{font-size:24px;}
.catbtn-name{font-size:11px;font-weight:600;color:#111318;text-align:center;line-height:1.2;}
.catbtn.sel-e .catbtn-name,.catbtn.sel-i .catbtn-name{color:#fff;}
/* CURRENCY */
.currrow{display:flex;background:#F0F0F2;border-radius:12px;padding:3px;flex-shrink:0;}
.currp{padding:10px 14px;border-radius:10px;font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all .15s;color:#6B7280;}
.currp.act{background:#111318;color:#fff;}
/* CHIPS */
.chip-green{background:#F0FDF4;color:#16A34A;}.chip-red{background:#FEF2F2;color:#DC2626;}.chip-amber{background:#FFFBEB;color:#D97706;}.chip{font-size:10px;font-weight:700;letter-spacing:.8px;padding:4px 10px;border-radius:8px;display:inline-block;text-transform:uppercase;}
.chip-g{background:#F0FDF4;color:#16A34A;}
.chip-r{background:#FEF2F2;color:#DC2626;}
.chip-a{background:#FFFBEB;color:#D97706;}
.chip-b{background:#EFF6FF;color:#2563EB;}
.chip-p{background:#FAF5FF;color:#7C3AED;}
/* PROG BAR */
.ptrack{height:6px;background:#ECEEF2;border-radius:3px;overflow:hidden;}
.pfill{height:100%;border-radius:3px;transition:width .4s ease;}
.pfill.g{background:#16A34A;}.pfill.a{background:#D97706;}.pfill.r{background:#DC2626;}
.pfill.xp{background:linear-gradient(90deg,#D97706,#F59E0B);}
/* SETTINGS */
.scard{background:#fff;border-radius:20px;overflow:hidden;}
.srow{display:flex;align-items:center;padding:15px 16px;gap:13px;cursor:pointer;transition:background .1s;position:relative;}
.srow:active{background:#F4F5F7;}
.srow+.srow::before{content:'';position:absolute;top:0;left:48px;right:0;height:1px;background:#ECEEF2;}
.s-ic{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
/* MODAL OVERLAY */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:flex;align-items:flex-end;animation:fadeIn .15s ease;overscroll-behavior:none;touch-action:none;}
.overlay>.msheet{touch-action:pan-y;}
.msheet{background:#fff;border-radius:28px 28px 0 0;width:100%;padding:16px 20px 36px;animation:slideUp .2s ease;max-height:90%;overflow-y:auto;-webkit-overflow-scrolling:touch;box-sizing:border-box;}
body.modal-open{overflow:hidden;position:fixed;width:100%;}
.mhandle{width:40px;height:4px;border-radius:2px;background:#ECEEF2;margin:0 auto 18px;}
/* TOAST */
.toast{position:absolute;top:16px;left:12px;right:12px;z-index:100;background:#1C1C1E;border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 32px rgba(0,0,0,.4);animation:slideDown .25s ease;}
/* STREAK BANNER */
.streak-ban{background:linear-gradient(135deg,#FFFBEB,#FEF3C7);border:1.5px solid rgba(245,158,11,.2);border-radius:20px;padding:14px 16px;display:flex;align-items:center;gap:14px;margin-bottom:10px;position:relative;overflow:hidden;}
.streak-ban::after{content:'';position:absolute;right:-20px;top:-20px;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,rgba(245,158,11,.2) 0%,transparent 70%);}
.sdot{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;}
.sdot.dn{background:#F59E0B;color:#1C1C1E;}
.sdot.td{background:rgba(245,158,11,.15);border:1.5px solid #F59E0B;color:#F59E0B;}
.sdot.ms{background:rgba(17,19,24,.1);border:1.5px solid rgba(17,19,24,.08);color:rgba(17,19,24,.2);}
/* TYPE ROW */
.typerow{display:flex;gap:5px;margin-bottom:16px;background:#F4F5F7;border-radius:14px;padding:4px;}
.typebtn{flex:1;padding:12px 6px;border-radius:11px;font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:700;text-align:center;cursor:pointer;transition:all .15s;color:#6B7280;}
.typebtn.exp-on,.typebtn.inc-on{background:#111318;color:#fff;}
/* FILTER */
.fbar{display:flex;gap:6px;overflow-x:auto;flex-shrink:0;padding:0 16px 10px;}
.fpill{padding:8px 16px;border-radius:999px;font-size:11px;font-weight:700;background:#ECEEF2;color:#6B7280;flex-shrink:0;cursor:pointer;transition:all .12s;}
.fpill.act{background:#111318;color:#fff;border-color:#111318;}
/* KPI ROW */
.kpi-row{display:grid;grid-template-columns:1fr 1px 1fr 1px 1fr;background:#fff;border-radius:18px;margin-bottom:12px;overflow:hidden;}
.kpi-cell{text-align:center;padding:18px 4px;}
.kpi-val{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:800;}
.kpi-lab{font-size:9px;font-weight:700;color:#B0B7C3;letter-spacing:.5px;text-transform:uppercase;margin-top:3px;}
/* BUDGET */
.budg-item{background:#fff;border-radius:18px;padding:14px 16px;margin-bottom:8px;cursor:pointer;transition:all .1s;}
.budg-item:active{transform:scale(.98);}
/* SEARCH */
.sinput{width:100%;border:none;border-radius:14px;padding:12px 16px;font-size:14px;font-family:'DM Sans',sans-serif;color:#111318;background:#F4F5F7;outline:none;}

/* SUMMARY CARDS */
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.sum-card{border-radius:18px;padding:14px 16px;border:1px solid;}
/* PROFILE HERO */
.prof-hero{background:#1C1C1E;padding:16px 20px 0;position:relative;overflow:hidden;flex-shrink:0;}
.prof-hero::before{content:'';position:absolute;top:-50px;right:-50px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(245,158,11,.08) 0%,transparent 70%);}
.ph-stat-row{display:grid;grid-template-columns:1fr 1px 1fr 1px 1fr;background:rgba(255,255,255,.04);border-top:1px solid rgba(255,255,255,.06);padding:10px 0;margin-top:12px;}
/* SUCCESS */
.success-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;background:#F4F5F7;}
/* LOGO */
.logo{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:800;color:#111318;letter-spacing:-1px;}
.logo span{color:#111318;}
/* WALLET CARD */
.wallet{background:#111318;border-radius:22px;padding:22px 20px;margin-bottom:10px;position:relative;overflow:hidden;}
.wallet::before{content:'';position:absolute;top:-40px;right:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.03);}
/* REWARDS HERO */
.rw-hero{background:linear-gradient(160deg,#1a0a3e,#2d1069,#1C1C1E);padding:20px 20px 0;position:relative;overflow:hidden;flex-shrink:0;}
.rw-hero::before{content:'';position:absolute;top:-60px;right:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,.25) 0%,transparent 70%);}
/* DARK MODE */
.dark{background:#111318!important;}
.dark .navbar{background:#1C1C1E;border-top:1px solid rgba(255,255,255,.06);}
.dark .ni.act{background:rgba(255,255,255,.07);}
.dark .ni-lbl{color:#4B5563;}
.dark .ni.act .ni-lbl{color:#fff;}
.dark .ni-dot{border-color:#111318;}
.dark .ph{background:#111318;}
.dark .back{background:#1C1C1E;color:#fff;}
.dark .ph-title{color:#fff;}
.dark .ph-action{background:#1C1C1E;color:#9CA3AF;}
.dark .card{background:#1C1C1E;}
.dark .txc{background:#1C1C1E;}
.dark .txc:active{background:#252529;}
.dark .finput{background:#252529;color:#fff;}
.dark textarea.finput{color:#fff;}
.dark .sinput{background:#252529;color:#fff;}
.dark .flabel{color:#4B5563;}
.dark .catbtn{background:#252529;}
.dark .catbtn-name{color:#e5e7eb;}
.dark .catbtn.sel-e,.dark .catbtn.sel-i{background:#fff;border-color:#fff;}
.dark .catbtn.sel-e .catbtn-name,.dark .catbtn.sel-i .catbtn-name{color:#111318;}
.dark .typerow{background:#252529;}
.dark .typebtn{color:#9CA3AF;}
.dark .fpill{background:#252529;color:#9CA3AF;}
.dark .fpill.act{background:#fff;color:#111318;}
.dark .kpi-row{background:#1C1C1E;}
.dark .kpi-lab{color:#4B5563;}
.dark .budg-item{background:#1C1C1E;}
.dark .msheet{background:#1C1C1E;}
.dark .mhandle{background:rgba(255,255,255,.1);}
.dark .wallet{background:linear-gradient(160deg,#1a1a2e,#16213e);}
.dark .prof-hero{background:linear-gradient(180deg,#0A0A0C 0%,#111318 100%);}
.dark .scard{background:#1C1C1E;}
.dark .srow{background:#1C1C1E;}
.dark .scard{background:#1C1C1E;}
.dark .srow:active{background:#252529;}
.dark .srow+.srow::before{background:rgba(255,255,255,.06);}
.dark .btn-gray{background:#252529;color:#fff;}
.dark .ptrack{background:#252529;}
.dark .currrow{background:#252529;}
.dark .currp{color:#9CA3AF;}
.dark .currp.act{background:#fff;color:#111318;}
.dark .tog.off{background:#374151;}
.dark .streak-ban{background:linear-gradient(135deg,#1C1C1E,#252529);}
.dark .sdot.dn{background:#4ADE80;color:#111318;}
.dark .sdot.td{background:rgba(74,222,128,.15);border-color:#4ADE80;color:#4ADE80;}
.dark .sdot.ms{background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.1);color:rgba(255,255,255,.2);}
.dark .wallet{background:#252529;}
.dark .hero-card{background:#1C1C1E;}
.dark .sum-card{border-color:rgba(255,255,255,.08)!important;}
.dark .success-wrap{background:#111318;}
.dark .logo{color:#fff;}
.dark .logo span{color:#fff;}
.dark .streak-ban{background:linear-gradient(135deg,#1C1C1E,#25252A);}
.dark .sdot.dn{background:#4ADE80;color:#111318;}
.dark .sdot.td{background:rgba(74,222,128,.15);border-color:#4ADE80;color:#4ADE80;}
.dark .prof-hero{background:#0d0d11;border-bottom:1px solid rgba(255,255,255,.06);}
.dark .rw-hero{background:linear-gradient(160deg,#12072a,#1d0a44,#111318);}
.hero-card{background:#fff;border:1.5px solid rgba(17,19,24,.07);}
.dark .hero-card{background:#1C1C1E;border-color:transparent;}
.dark .btn-ink{background:#fff;color:#111318;}
.dark .btn-ink:active{background:#e5e7eb;}
.mpill{padding:8px 16px;border-radius:999px;font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:700;cursor:pointer;flex-shrink:0;white-space:nowrap;background:#ECEEF2;color:#6B7280;transition:all .12s;}
.mpill.act{background:#111318;color:#fff;}
.dark .mpill{background:#252529;color:#9CA3AF;}
.dark .mpill.act{background:#fff;color:#111318;}
.cchip{display:flex;align-items:center;gap:4px;padding:7px 12px;border-radius:999px;background:#ECEEF2;font-size:11px;font-weight:700;color:#6B7280;cursor:pointer;flex-shrink:0;transition:all .12s;}
.cchip.act{background:#111318;color:#fff;}
.dark .cchip{background:#252529;color:#9CA3AF;}
.dark .cchip.act{background:#fff;color:#111318;}

  <script>
  /* ── API CLIENT ── */
  const API_URL = window.FINLY_API_URL || "";
  /* Lazy getter so initData is always read at request time, not at parse time */
  const _getInitData = () => window.Telegram?.WebApp?.initData || "";

  async function _req(method, path, body) {
    const opts = {
      method,
      headers: {
        "Content-Type": "application/json",
        "X-Init-Data": _getInitData(),
      },
    };
    if (body !== undefined) opts.body = JSON.stringify(body);
    const res = await fetch(API_URL + path, opts);
    if (!res.ok) {
      const text = await res.text();
      throw new Error(`API ${method} ${path} → ${res.status}: ${text}`);
    }
    return res.json();
  }

    delTx:        (id)        => _req("DELETE",`/api/transactions/${id}`),
    addDraft:     (body)      => _req("POST", "/api/drafts", body),
    delDraft:     (id)        => _req("DELETE",`/api/drafts/${id}`),
    addBudget:    (body)      => _req("POST", "/api/budgets", body),

    delBudget:    (id)        => _req("DELETE",`/api/budgets/${id}`),
    addCategory:  (body)      => _req("POST", "/api/categories", body),
    delCategory:  (id)        => _req("DELETE",`/api/categories/${id}`),

function PriorityWidget({alerts,budgetAlerts,setTab}){
  // Aggregate all alert items into a clean list
  const items=[];
  if(alerts.friends>0) items.push({icon:"👥",label:alerts.friends===1?"1 заявка в друзья":alerts.friends+" заявки в друзья",color:"#3B82F6",bg:"#EFF6FF",tab:"profile"});
  if(alerts.debts>0)   items.push({icon:"💸",label:alerts.debts===1?"1 долг ждёт подтверждения":alerts.debts+" долга ждут подтверждения",color:"#D97706",bg:"#FFF7ED",tab:"profile"});
  if(alerts.goals>0)   items.push({icon:"🎯",label:alerts.goals===1?"1 приглашение на цель":alerts.goals+" приглашения на цель",color:"#16A34A",bg:"#F0FDF4",tab:"profile"});
  budgetAlerts.forEach(b=>items.push({icon:b.pct>=90?"🚨":"⚠️",label:"Бюджет «"+b.name+"»: "+b.pct+"%",color:b.pct>=90?"#DC2626":"#D97706",bg:b.pct>=90?"#FFF1F2":"#FFFBEB",tab:"profile"}));

  // Show ONE alert at a time, rotate through them, auto-dismiss after 8s
  const[idx,setIdx]=useState(0);
  const[dismissed,setDismissed]=useState([]);
  const visible=items.filter((_,i)=>!dismissed.includes(i));

  useEffect(()=>{
    if(visible.length===0)return;
    const t=setTimeout(()=>{
      setDismissed(prev=>[...prev,items.indexOf(visible[0])]);
    },8000);
    return()=>clearTimeout(t);
  },[visible.length,dismissed.length]);

  if(visible.length===0)return null;
  const it=visible[0];
  const origIdx=items.indexOf(it);
  return h("div",{style:{marginBottom:10,animation:"slideDown .25s ease"}},
    h("div",{onClick:()=>setTab(it.tab),
      style:{display:"flex",alignItems:"center",gap:10,padding:"11px 14px",borderRadius:14,background:it.bg,cursor:"pointer",border:"1px solid "+it.color+"22",position:"relative"}},
      h("div",{style:{fontSize:18,flexShrink:0}},it.icon),
      h("div",{style:{flex:1,fontFamily:F,fontSize:13,fontWeight:700,color:it.color}},it.label),
      visible.length>1&&h("div",{style:{fontSize:10,fontWeight:700,color:it.color,opacity:.5,marginRight:6}},visible.length+" alerts"),
      h("div",{onClick:e=>{e.stopPropagation();setDismissed(prev=>[...prev,origIdx]);},
        style:{fontSize:16,color:it.color,opacity:.5,cursor:"pointer",padding:"2px 4px"}},"✕")
    )
  );
}

/* ── Quick Debt Modal ── */
function QuickDebtModal({onClose,onSaved,data,setData}){
  const[debtType,setDebtType]=useState("lent");       // lent=дал, borrowed=взял
  const[amount,setAmount]=useState("");
  const[who,setWho]=useState("");
  const[note,setNote]=useState("");
  const[dueDate,setDueDate]=useState("");
  const[saving,setSaving]=useState(false);

  async function save(){
    if(!amount.trim()||saving) return;
    setSaving(true);
    const amt=parseInt(amount.replace(/\D/g,""))||0;
    if(amt<=0){setSaving(false);return;}
    const initData=window.Telegram?.WebApp?.initData||"";
    const hdrs={"Content-Type":"application/json","X-Init-Data":initData};
    try{
      // 1. Create debt record (shows in debts page)
      const debtBody={type:debtType,amount:amt,name:who.trim()||"Без имени",note:note.trim(),due_date:dueDate||null};
      const debtRes=await fetch(API_URL+"/api/personal_debts",{method:"POST",headers:hdrs,body:JSON.stringify(debtBody)});
      const newDebt=await debtRes.json();

      // 2. Create corresponding transaction (affects balance)
      const txType=debtType==="lent"?"expense":"income";
      const catIcon=debtType==="lent"?"🤝":"💸";
      const catName=debtType==="lent"?("Долг → "+(who.trim()||"Без имени")):("Долг от "+(who.trim()||"Без имени"));
      const txBody={type:txType,cat_icon:catIcon,cat_name:catName,note:note.trim()||catName,
        amount:amt,date_str:today(),time_str:nowTime(),currency:"UZS",account:"Наличка"};
      const txRes=await fetch(API_URL+"/api/transactions",{method:"POST",headers:hdrs,body:JSON.stringify(txBody)});
      if(txRes.ok){
        const txData=await txRes.json();
        // Update app state with new transaction and debt
        if(setData){
          setData(d=>({
            ...d,
            transactions:[txData.tx,...(d.transactions||[])],
            personalDebts:[newDebt,...(d.personalDebts||[])],
          }));
        }
      }
      showToast({icon:debtType==="lent"?"🤝":"💸",title:debtType==="lent"?"Долг записан":"Долг получен",sub:fmt(amt)+" сум · "+catName});
      onSaved?.();
      onClose();
    }catch(e){console.error(e);showToast({icon:"⚠️",title:"Ошибка",sub:"Не удалось сохранить долг"});}
    setSaving(false);
  }

  return h("div",{style:{position:"fixed",inset:0,zIndex:300,display:"flex",flexDirection:"column",justifyContent:"flex-end"}},
    h("div",{style:{position:"absolute",inset:0,background:"rgba(0,0,0,0.5)"},onClick:onClose}),
    h("div",{style:{position:"relative",background:C.bg,borderRadius:"24px 24px 0 0",padding:"0 0 32px",zIndex:1}},
      h("div",{style:{width:40,height:4,borderRadius:2,background:C.bdr,margin:"12px auto 0"}}),
      h("div",{style:{padding:"14px 20px 16px",borderBottom:"1px solid "+C.bdr}},
        h("div",{style:{fontFamily:F,fontSize:17,fontWeight:800,color:C.ink}},"Новый долг"),
        h("div",{style:{fontSize:12,color:C.ink3,marginTop:2}},"Быстрое добавление долга")
      ),
      h("div",{style:{padding:"16px 20px 8px"}},
        // Lent / Borrowed toggle
        h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14}},
          h("div",{onClick:()=>setDebtType("lent"),style:{padding:"12px 8px",borderRadius:14,textAlign:"center",cursor:"pointer",
              background:debtType==="lent"?"rgba(22,163,74,.12)":C.card,border:"1.5px solid "+(debtType==="lent"?C.gr:C.bdr),transition:"all .12s"}},
            h("div",{style:{fontSize:18,marginBottom:3}},"🤝"),
            h("div",{style:{fontFamily:F,fontSize:12,fontWeight:700,color:debtType==="lent"?C.gr:C.ink2}},"Я дал"),
            h("div",{style:{fontSize:10,color:C.ink3,marginTop:1}},"мне должны")
          ),
          h("div",{onClick:()=>setDebtType("borrowed"),style:{padding:"12px 8px",borderRadius:14,textAlign:"center",cursor:"pointer",
              background:debtType==="borrowed"?"rgba(220,38,38,.08)":C.card,border:"1.5px solid "+(debtType==="borrowed"?C.rd:C.bdr),transition:"all .12s"}},
            h("div",{style:{fontSize:18,marginBottom:3}},"💸"),
            h("div",{style:{fontFamily:F,fontSize:12,fontWeight:700,color:debtType==="borrowed"?C.rd:C.ink2}},"Я взял"),
            h("div",{style:{fontSize:10,color:C.ink3,marginTop:1}},"я должен")
          )
        ),
        // Amount
        h("div",{style:{marginBottom:10}},
          h("div",{style:{fontSize:11,fontWeight:700,color:C.ink3,letterSpacing:1,textTransform:"uppercase",marginBottom:6}},"СУММА"),
          h("input",{className:"finput",inputMode:"numeric",style:{marginBottom:0},placeholder:"50 000",value:amount,
            onChange:e=>setAmount(e.target.value)})
        ),
        // Who
        h("div",{style:{marginBottom:10}},
          h("div",{style:{fontSize:11,fontWeight:700,color:C.ink3,letterSpacing:1,textTransform:"uppercase",marginBottom:6}},
            debtType==="lent"?"КОМУ ДАЛ":"У КОГО ВЗЯЛ"),
          h("input",{className:"finput",style:{marginBottom:0},placeholder:"Имя или никнейм",value:who,onChange:e=>setWho(e.target.value)})
        ),
        // Note + Due date
        h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:16}},
          h("div",null,
            h("div",{style:{fontSize:11,fontWeight:700,color:C.ink3,letterSpacing:1,textTransform:"uppercase",marginBottom:6}},"ЗАМЕТКА"),
            h("input",{className:"finput",style:{marginBottom:0},placeholder:"Зачем…",value:note,onChange:e=>setNote(e.target.value)})
          ),
          h("div",null,
            h("div",{style:{fontSize:11,fontWeight:700,color:C.ink3,letterSpacing:1,textTransform:"uppercase",marginBottom:6}},"ВЕРНУТЬ ДО"),
            h("input",{type:"date",className:"finput",style:{marginBottom:0,background:C.card,color:C.ink,border:"1px solid "+C.bdr},
              value:dueDate,onChange:e=>setDueDate(e.target.value)})
          )
        ),
        h("div",{onClick:save,className:"btn btn-ink",style:{width:"100%",padding:"14px",borderRadius:16,fontFamily:F,fontSize:15,fontWeight:800,textAlign:"center",cursor:"pointer",opacity:saving?0.6:1}},
          saving?"Сохранение…":"✅ Добавить долг")
      )
    )
  );
}

function AddScreen({data,setData,onSaved,setTab,prefill,onPrefillUsed}){
  const[type,setType]=useState(prefill?.type||"expense");
  const[amount,setAmount]=useState(prefill?.amount?String(prefill.amount):"");
  const[currency,setCurrency]=useState("UZS");
  const[usdRate,setUsdRate]=useState("12700");
  const[selCat,setSelCat]=useState(prefill?.cat?{icon:prefill.cat,name:prefill.catName}:null);
  const[selGoal,setSelGoal]=useState(null);
  const[selDebt,setSelDebt]=useState(null);
  const[pickerTab,setPickerTab]=useState(null);
  const[note,setNote]=useState(prefill?.note||"");
  const[recurring,setRecurring]=useState(false);
  const[excludeFromBudget,setExcludeFromBudget]=useState(false);
  const[draftMsg,setDraftMsg]=useState(false);
  const[showDrafts,setShowDrafts]=useState(false);
  const[showDebtModal,setShowDebtModal]=useState(false);
  const[pendingSave,setPendingSave]=useState(null); // holds save params while awaiting account confirm
  // Clear prefill after first mount so navigating back doesn't re-apply it
  useEffect(()=>{ if(prefill&&onPrefillUsed) onPrefillUsed(); },[]);
  const cats=type==="expense"?(data.exp_cats||EXP_CATS):(data.inc_cats||INC_CATS);
  const effectiveCat = selCat || (selGoal ? {icon:"🏁",name:"Цель"} : null) || (selDebt ? {icon:"🤝",name:"Долг"} : null);
  const canSave=amount.trim()&&effectiveCat;

  const[account,setAccount]=useState(()=>prefill?.account||localStorage.getItem("finly_default_account")||"Наличка");
  const[saving,setSaving]=useState(false);
  const[budgetAlert,setBudgetAlert]=useState(null);
  async function save(){
    if(!canSave||saving)return;
    // If "account confirmation" setting is on, pause and ask user before saving
    const confirmAccountOn=(()=>{try{return localStorage.getItem("finly_confirm_account")==="1";}catch{return false;}})();
    if(confirmAccountOn){
      setPendingSave({type,cat:effectiveCat,note,amount,currency,usdRate,recurring,account,excludeFromBudget,selGoal,selDebt});
      return;
    }
    await _doSave(account);
  }
  async function _doSave(chosenAccount){
    if(saving)return;
    setSaving(true);
    const raw=parseInt(amount.replace(/\D/g,""))||0;
    const rate=parseInt(usdRate.replace(/\D/g,""))||12700;
    const finalAmt=currency==="$"?raw*rate:raw;

    // ── DEBT PAYMENT FLOW ──
    // Expense mode: pay from your pocket → expense tx (balance ↓) + debt ↓.
    // Income mode:  close debt with external money → NO balance impact, debt ↓ only.
    if(selDebt){
      try{
        const affectsBalance=type==="expense";
        const r=await fetch(API_URL+"/api/personal_debts/"+selDebt.id+"/pay",{
          method:"POST",
          headers:{"Content-Type":"application/json","X-Init-Data":_getInitData()},
          body:JSON.stringify({amount:finalAmt,affects_balance:affectsBalance,account:chosenAccount})
        });
        const updated=await r.json();
        // Refresh debts in state
        setData(d=>({...d,personalDebts:(d.personalDebts||[]).map(x=>x.id===selDebt.id?{...x,...updated}:x)}));
        // Re-sync transactions so the balance reflects the expense (if any)
        fetch(API_URL+"/api/personal_debts",{headers:{"X-Init-Data":_getInitData()}})
          .then(rr=>rr.ok?rr.json():null).then(dd=>{if(dd)setData(p=>({...p,personalDebts:dd}));}).catch(()=>{});
        showToast({icon:"🤝",
          title:updated.paid?"Долг закрыт!":"Долг частично погашен",
          sub:(affectsBalance?"Списано с баланса · ":"Без списания · ")+fmt(finalAmt)+" сум · осталось "+fmt(updated.remaining)+" сум"});
      }catch(e){console.error(e);showToast({icon:"⚠️",title:"Ошибка",sub:"Не удалось погасить долг"});}
      finally{setSaving(false);}
      setAmount("");setNote("");setSelDebt(null);setSelGoal(null);setSelCat(null);
      setTab("home");
      return;
    }

    const body={type,cat_icon:effectiveCat.icon,cat_name:effectiveCat.name,
      note:note||effectiveCat.name,amount:finalAmt,date_str:today(),
      time_str:nowTime(),currency,recurring,account:chosenAccount,
      ...(currency!=="UZS"&&{original_amount:raw,original_currency:currency,exchange_rate:rate})};
    try{
      const res=await API.addTx(body);
      if(selGoal){
        try{
          const newSaved=(selGoal.saved||0)+finalAmt;
          const contrib={label:effectiveCat.name,date:today(),amount:String(finalAmt)};
          const newContribs=[contrib,...(selGoal.contributions||[])];
          const done=newSaved>=selGoal.target;
          await fetch(API_URL+"/api/personal_goals/"+selGoal.id,{
            method:"PATCH",
            headers:{"Content-Type":"application/json","X-Init-Data":_getInitData()},
            body:JSON.stringify({saved:newSaved,contributions:newContribs,done})
          });
        }catch(ge){console.error(ge);}
      }
      // If user toggled "exclude from budget", persist tx ID in localStorage
      if(excludeFromBudget && res.tx?.id){
        try{
          const ex=new Set(JSON.parse(localStorage.getItem("budget_excluded_txs")||"[]"));
          ex.add(res.tx.id);
          localStorage.setItem("budget_excluded_txs",JSON.stringify([...ex]));
        }catch{}
      }
      onSaved(res.tx, res.xp_earned, res.total_xp);
      // Budget alert check
      try{
        const budgets=data.budgets||[];
        const msgs=[];
        budgets.forEach(b=>{
          if(!b.limit)return;
          const added=type==="expense"&&effectiveCat.name===b.name?finalAmt:0;
          const curSpent=(b.spent||0)+added;
          const pct=curSpent/b.limit*100;
          if(pct>=100)msgs.push({icon:"🚨",text:"Превышен бюджет «"+b.name+"»",color:C.rd});
          else if(pct>=80)msgs.push({icon:"⚠️",text:"Осталось "+Math.round(100-pct)+"% бюджета «"+b.name+"»",color:C.am});
        });
        if(msgs.length>0)setBudgetAlert(msgs[0]);
      }catch{}
    }catch(e){
      console.error(e);
      const tx={id:Date.now(),type,cat:effectiveCat.icon,catName:effectiveCat.name,note:note||effectiveCat.name,amount:finalAmt,dateStr:today(),time:nowTime(),currency,recurring,account};
      onSaved(tx,15,data.xp+15);
    } finally{ setSaving(false); }
  } // end _doSave
  async function draft(){
    if(!amount.trim())return;
    const raw=parseInt(amount.replace(/\D/g,""))||0;
    const body={type,cat_icon:selCat?.icon||"❓",cat_name:selCat?.name||"Без категории",
      note,amount:raw,date_str:today(),time_str:nowTime(),currency,account};
    try{
      const dr=await API.addDraft(body);
      setData(d=>({...d,drafts:[dr,...d.drafts]}));
    }catch(e){
      const dr={id:Date.now(),type,cat:selCat?.icon||"❓",catName:selCat?.name||"Без категории",note,amount:raw,dateStr:today(),time:nowTime(),currency,account,isDraft:true};
      setData(d=>({...d,drafts:[dr,...d.drafts]}));
    }
    setDraftMsg(true);setTimeout(()=>setDraftMsg(false),2200);
    setAmount("");setSelCat(null);setNote("");
  }

  if(showDrafts)return h(DraftsScreen,{data,setData,onClose:()=>setShowDrafts(false),onComplete:(dr)=>{
    setShowDrafts(false);
    setType(dr.type);setAmount(String(dr.amount));setNote(dr.note);
    setSelCat({icon:dr.cat,name:dr.catName});
    if(dr.account)setAccount(dr.account);
    // Delete draft from server (it's being completed)
    API.delDraft(dr.id).catch(e=>console.error("delDraft on complete:",e));
    setData(d=>({...d,drafts:d.drafts.filter(x=>x.id!==dr.id)}));
  }});

  return h("div",{className:"screen anim-fade"},
    showDebtModal&&h(QuickDebtModal,{onClose:()=>setShowDebtModal(false),data,setData,onSaved:()=>{}}),
    // Account confirmation modal
    pendingSave&&h("div",{style:{position:"fixed",inset:0,zIndex:400,display:"flex",flexDirection:"column",justifyContent:"flex-end"}},
      h("div",{style:{position:"absolute",inset:0,background:"rgba(0,0,0,0.5)"},onClick:()=>setPendingSave(null)}),
      h("div",{style:{position:"relative",background:C.bg,borderRadius:"24px 24px 0 0",padding:"0 0 36px",zIndex:1,animation:"slideUp .22s ease"}},
        h("div",{style:{width:40,height:4,borderRadius:2,background:C.bdr,margin:"12px auto 16px"}}),
        h("div",{style:{padding:"0 20px 16px",textAlign:"center"}},
          h("div",{style:{fontSize:22,marginBottom:6}},"💳"),
          h("div",{style:{fontFamily:F,fontSize:17,fontWeight:800,color:C.ink,marginBottom:6}},"Верный счёт?"),
          h("div",{style:{fontSize:13,color:C.ink3,marginBottom:20,lineHeight:1.5}},
            "Запись пойдёт на счёт ",h("b",{style:{color:C.ink}},account)
          ),
          // Account quick-switch chips — from user's real accounts
          h("div",{style:{display:"flex",gap:8,flexWrap:"wrap",justifyContent:"center",marginBottom:20}},
            ...([...new Set([
              ...(()=>{try{return JSON.parse(localStorage.getItem("finly_accounts")||"[]").map(a=>a.name);}catch{return[];}})(),
              ...((data.txs||[]).map(t=>t.account).filter(Boolean)),
              "Наличка"
            ])].slice(0,8).map(acc=>
              h("div",{key:acc,onClick:()=>setAccount(acc),style:{
                padding:"8px 16px",borderRadius:12,cursor:"pointer",fontFamily:F,fontSize:12,fontWeight:700,
                background:account===acc?C.ink:C.card,color:account===acc?C.sur:C.ink2,
                border:"1px solid "+(account===acc?C.ink:C.bdr),transition:"all .12s"
              }},acc)
            ))
          ),
          h("div",{onClick:async()=>{const a=account;setPendingSave(null);await _doSave(a);},
            className:"btn btn-ink",style:{width:"100%",borderRadius:16,padding:"14px",fontFamily:F,fontSize:14,fontWeight:800,cursor:"pointer",marginBottom:10}},
            "Да, всё верно · "+account+" ✓"
          ),
          h("div",{onClick:()=>setPendingSave(null),style:{textAlign:"center",cursor:"pointer",fontSize:13,fontWeight:500,color:C.ink3,padding:"4px 0"}},"Отмена")
        )
      )
    ),
    h("div",{className:"ph"},
      h("div",{className:"back",onClick:()=>setTab("home")},"←"),
      h("div",{className:"ph-title"},"Новая запись"),
      h("div",{style:{display:"flex",alignItems:"center",gap:6}},
        h("div",{onClick:()=>setShowDebtModal(true),className:"ph-action",style:{background:"rgba(220,38,38,.08)",color:C.rd}},"🤝 Долг"),
        h("div",{className:"ph-action",onClick:()=>setShowDrafts(true),style:{position:"relative"}},
          "Черновики",
          data.drafts.length>0?h("div",{style:{position:"absolute",top:-3,right:-3,width:8,height:8,borderRadius:"50%",background:C.rd,border:`2px solid ${C.bg}`}}):null
        )
      )
    ),
    draftMsg&&h("div",{style:{margin:"0 16px 8px",background:C.amBg,borderRadius:12,padding:"10px 14px",fontSize:13,fontWeight:700,color:C.am}},"✓ Черновик сохранён"),
    h("div",{className:"scroll",style:{padding:"0 16px 80px"}},
      h("div",{className:"card",style:{padding:18,marginBottom:8}},
        // type
        h("div",{className:"typerow"},
          ["expense","income"].map(t=>h("div",{key:t,className:"typebtn "+(type===t?(t==="expense"?"exp-on":"inc-on"):""),onClick:()=>{setType(t);setSelCat(null);}},
            t==="expense"?"Расход":"Доход"))
        ),
        // amount + currency
        h("label",{className:"flabel"},"СУММА"),
        h("div",{style:{display:"flex",gap:8,marginBottom:14,alignItems:"center"}},
          h("div",{className:"currrow"},
            ["$","UZS"].map(c=>h("div",{key:c,className:"currp"+(currency===c?" act":""),onClick:()=>setCurrency(c)},c))
          ),
          h("input",{className:"finput",style:{flex:1,marginBottom:0,fontSize:26},placeholder:currency==="$"?"0":"0",inputMode:"numeric",value:amount,onChange:e=>setAmount(e.target.value)})
        ),
        currency==="$"&&h("div",{style:{marginBottom:14}},
          h("label",{className:"flabel"},"КУРС (1$ = ? СУМ)"),
          h("input",{className:"finput sm",style:{marginBottom:0},value:usdRate,inputMode:"numeric",onChange:e=>setUsdRate(e.target.value)})
        ),
        // cats — hidden when a goal or debt is linked
        !(selGoal||selDebt)&&h("label",{className:"flabel"},"КАТЕГОРИЯ"),
        !(selGoal||selDebt)&&h("div",{className:"catgrid"},
          cats.map(c=>h("div",{key:c.name,className:"catbtn"+(selCat?.name===c.name?" sel-"+(type==="expense"?"e":"i"):""),onClick:()=>setSelCat(c)},
            h("div",{className:"catbtn-icon"},c.icon),
            h("div",{className:"catbtn-name"},c.name)
          ))
        ),
        // account
        h("label",{className:"flabel"},"СЧЁТ"),
        h("div",{style:{display:"flex",gap:6,flexWrap:"wrap",marginBottom:14}},
          (()=>{
            const hidden=new Set((()=>{try{return JSON.parse(localStorage.getItem("finly_hidden_accounts")||"[]");}catch{return[];}})());
            const custom=(()=>{try{return JSON.parse(localStorage.getItem("finly_accounts")||"[]").map(a=>a.name);}catch{return[];}})();
            const fromTx=[...new Set((data.txs||[]).map(t=>t.account||"Наличка"))];
            const jarNames=(data.savingsJars||[]).map(j=>j.emoji+" "+j.name);
            return [...new Set([...custom,...fromTx,"Наличка",...jarNames])].filter(n=>!hidden.has(n));
          })()
          .map(name=>h("div",{key:name,onClick:()=>setAccount(name),
            style:{padding:"8px 14px",borderRadius:22,fontFamily:F,fontSize:12,fontWeight:700,cursor:"pointer",
              background:account===name?C.ink:C.bg,color:account===name?C.sur:C.ink2,transition:"all .12s"}},name))
        ),
        // note
        h("label",{className:"flabel"},"ПРИМЕЧАНИЕ"),
        h("textarea",{className:"finput",style:{marginBottom:12},placeholder:"Необязательно...",value:note,onChange:e=>setNote(e.target.value)}),
        // recurring
        h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 0",borderBottom:"1px solid "+C.bdr}},
          h("div",null,
            h("div",{style:{fontSize:14,fontWeight:600,color:C.ink}},"Повторяющаяся"),
            h("div",{style:{fontSize:11,color:C.ink3,marginTop:2}},"Добавлять каждый месяц")),
          h(Toggle,{on:recurring,cb:()=>setRecurring(!recurring)})
        ),
        // exclude from smart budget
        type==="expense"&&h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 0",marginBottom:10}},
          h("div",null,
            h("div",{style:{fontSize:14,fontWeight:600,color:C.ink}},"Вне бюджета"),
            h("div",{style:{fontSize:11,color:C.ink3,marginTop:2}},"Не учитывать в умном бюджете")),
          h(Toggle,{on:excludeFromBudget,cb:()=>setExcludeFromBudget(!excludeFromBudget)})
        ),
        // Goals + Debts picker
        (()=>{
          const goals=(data.personalGoals||[]).filter(g=>!g.done);
          const debts=(data.personalDebts||[]).filter(d=>!d.paid);
          if(!goals.length&&!debts.length)return null;
          const tabBtn=(id,icon,label,count,activeColor)=>h("div",{
            onClick:()=>{
              setPickerTab(pickerTab===id?null:id);
              if(id==="goals")setSelDebt(null);
              else setSelGoal(null);
            },
            style:{display:"flex",alignItems:"center",gap:5,padding:"5px 10px",borderRadius:20,cursor:"pointer",transition:"all .12s",
              background:pickerTab===id?C.ink:"transparent",
              border:"1.5px solid "+(pickerTab===id?C.ink:C.bdr),
              color:pickerTab===id?C.sur:C.ink3}},
            h("span",{style:{fontSize:13}},icon),
            h("span",{style:{fontFamily:F,fontSize:10,fontWeight:700,letterSpacing:.5}},label),
            count>0&&h("span",{style:{fontFamily:F,fontSize:9,fontWeight:700,
              background:pickerTab===id?"rgba(255,255,255,.25)":"#ECEEF2",
              color:pickerTab===id?C.sur:C.ink3,
              borderRadius:99,padding:"1px 5px",marginLeft:2}},count)
          );
          return h("div",{style:{marginBottom:14}},
            // Tab row
            h("div",{style:{display:"flex",gap:6,marginBottom:pickerTab?10:0}},
              goals.length>0&&tabBtn("goals","🏁","Цели",goals.length,"#111318"),
              debts.length>0&&tabBtn("debts","🤝","Долги",debts.length,"#DC2626")
            ),
            // Goals chips
            pickerTab==="goals"&&h("div",{style:{display:"flex",gap:6,flexWrap:"wrap"}},
              goals.map(g=>h("div",{key:g.id,onClick:()=>setSelGoal(selGoal?.id===g.id?null:g),
                style:{display:"flex",alignItems:"center",gap:6,padding:"7px 11px",borderRadius:18,cursor:"pointer",border:"1.5px solid",transition:"all .12s",
                  borderColor:selGoal?.id===g.id?C.ink:C.bdr,
                  background:selGoal?.id===g.id?C.ink:C.card,
                  color:selGoal?.id===g.id?C.sur:C.ink2}},
                h("span",{style:{fontSize:13}},g.emoji),
                h("span",{style:{fontFamily:F,fontSize:11,fontWeight:700}},g.name)
              ))
            ),
            // Debt chips
            pickerTab==="debts"&&h("div",{style:{display:"flex",gap:6,flexWrap:"wrap"}},
              debts.map(d=>h("div",{key:d.id,onClick:()=>setSelDebt(selDebt?.id===d.id?null:d),

                  borderColor:selDebt?.id===d.id?"#DC2626":C.bdr,
                  background:selDebt?.id===d.id?"#DC2626":C.card,
                  color:selDebt?.id===d.id?"#fff":C.ink2}},
                h("span",{style:{fontSize:12}},d.type==="borrowed"?"🔴":"🟢"),
                h("span",{style:{fontFamily:F,fontSize:11,fontWeight:700}},d.name),

                  fmt(d.remaining!=null?d.remaining:d.amount))

            ),
            // payment hint when a debt is selected — explains partial + mode behaviour
            selDebt&&pickerTab==="debts"&&(()=>{
              const rem=selDebt.remaining!=null?selDebt.remaining:selDebt.amount;
              return h("div",{style:{marginTop:8,padding:"9px 12px",borderRadius:10,background:C.sur,border:"1px solid "+C.bdr}},

                  type==="expense"?"💸 Платёж из вашего баланса":"💰 Закрытие без списания"),
                h("div",{style:{fontSize:11,color:C.ink3,lineHeight:1.4}},
                  type==="expense"
                    ?"Сумма спишется с баланса и уменьшит долг. Осталось: "+fmt(rem)+" сум"
                    :"Долг уменьшится, баланс не изменится. Осталось: "+fmt(rem)+" сум")
              );
            })()
          );
        })(),
        // xp hint
        h("div",{style:{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",background:C.sur,borderRadius:12,marginBottom:16,border:"1px solid "+C.bdr}},
          h("div",{style:{fontSize:16}},"⚡"),
          h("div",{style:{fontSize:12,fontWeight:600,color:C.ink3}},"+10 XP за запись · серия продолжается")
        )
      ),
      h("div",{style:{height:20}})
    ),
    budgetAlert&&h("div",{style:{
      position:"absolute",bottom:70,left:16,right:16,
      background:C.card,borderRadius:14,
      padding:"12px 16px",
      display:"flex",alignItems:"center",gap:10,
      boxShadow:"0 4px 20px rgba(0,0,0,.12)",
      border:"1.5px solid "+budgetAlert.color,
      zIndex:25,
    }},
      h("div",{style:{fontSize:20}},budgetAlert.icon),
      h("div",{style:{flex:1,fontFamily:F,fontSize:13,fontWeight:700,color:budgetAlert.color}},budgetAlert.text),
      h("div",{onClick:()=>setBudgetAlert(null),style:{fontSize:18,color:C.ink3,cursor:"pointer"}},"×")
    ),
    // Floating action bar
    (()=>{const isDark=document.getElementById("app")?.classList.contains("dark");return h("div",{style:{
      position:"absolute",bottom:0,left:0,right:0,
      background:isDark?C.dk:C.bg,
      padding:"12px 16px",paddingBottom:"calc(12px + env(safe-area-inset-bottom,0px))",
      display:"flex",gap:10,zIndex:20,
      borderTop:"1px solid "+(isDark?"rgba(255,255,255,0.06)":"#ECEEF2"),
    }},
      h("div",{className:"btn btn-gray",style:{flex:1,fontSize:12},onClick:draft},"Черновик"),
      h("div",{className:"btn "+(canSave?"btn-ink":""),style:{flex:2,fontSize:12,background:canSave?C.ink:C.bdr,color:canSave?C.sur:C.ink3,cursor:canSave?"pointer":"default",borderRadius:16,padding:16,fontFamily:F,fontWeight:700,letterSpacing:1.5,textTransform:"uppercase",textAlign:"center"},onClick:save},"Сохранить")
    );})()
  );
}

/* ── DRAFTS ── */
function DraftsScreen({data,setData,onClose,onComplete}){
  return h("div",{className:"screen anim-fade"},
    h("div",{className:"ph"},
      h("div",{className:"back",onClick:onClose},"←"),
      h("div",{className:"ph-title"},"Черновики")
    ),
    h("div",{className:"scroll",style:{padding:"0 16px"}},
      data.drafts.length===0
        ?h("div",{style:{textAlign:"center",padding:"60px 20px"}},
          h("div",{style:{fontSize:48,marginBottom:12}},"📝"),
          h("div",{style:{fontFamily:F,fontSize:16,fontWeight:700,color:C.ink,marginBottom:6}},"Черновиков нет"),
          h("div",{style:{fontSize:13,color:C.ink3}},"Сохраните запись как черновик\nчтобы вернуться к ней позже")

            h("div",{style:{display:"flex",alignItems:"center",gap:10}},
              h("div",{style:{width:38,height:38,borderRadius:12,background:dr.type==="income"?C.grBg:C.rdBg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}},dr.cat),
              h("div",null,
                h("div",{style:{fontFamily:F,fontSize:13,fontWeight:700,color:C.ink}},dr.catName),
                h("div",{style:{fontSize:10,color:C.ink3,marginTop:2}},dr.dateStr)
              )
            ),
            h("div",{style:{fontFamily:F,fontSize:16,fontWeight:700,color:C.ink}},(dr.type==="income"?"+":"−")+fmt(dr.amount))
          ),
          h("div",{style:{display:"flex",gap:8}},
            h("div",{className:"btn btn-gray",style:{flex:1,padding:"11px",fontSize:11},onClick:()=>{

/* ── ANALYTICS ── */
function AnalyticsScreen({data,onTxTap}){
  const{txs}=data;
  const[filterSheet,setFilterSheet]=useState(false);
  const[search,setSearch]=useState("");
  const[filterType,setFilterType]=useState("all");
  const[selCats,setSelCats]=useState([]);
  const[dateMode,setDateMode]=useState("all"); // all | month | range | day
  const[sortBy,setSortBy]=useState("date");
  const[sortDir,setSortDir]=useState("desc");
  const[showAllLegend,setShowAllLegend]=useState(false);

  const MONTH_RU=["Янв","Фев","Мар","Апр","Май","Июн","Июл","Авг","Сен","Окт","Ноя","Дек"];
  const fmtMonth=ym=>{const[y,m]=ym.split("-");return MONTH_RU[parseInt(m)-1]+" "+y;};
  const curYM=new Date().getFullYear()+"-"+String(new Date().getMonth()+1).padStart(2,"0");
  const monthsMap={};txs.forEach(t=>{if(t.dateStr)monthsMap[t.dateStr.slice(0,7)]=true;});
  const availMonths=Object.keys(monthsMap).sort().reverse();
  const defaultMonth=availMonths.length>0?(availMonths.includes(curYM)?curYM:availMonths[0]):curYM;
  const[selMonth,setSelMonth]=useState(defaultMonth);
  const[rangeFrom,setRangeFrom]=useState("");
  const[rangeTo,setRangeTo]=useState("");
  const[singleDay,setSingleDay]=useState(today());

  const[selCurrencies,setSelCurrencies]=useState([]);
  const catIcons={};txs.forEach(t=>{catIcons[t.catName]=t.cat;});
  const typedTxs=txs.filter(t=>filterType==="all"||t.type===filterType);
  const allCats=[...new Set(typedTxs.map(t=>t.catName))];
  // Separate goal/debt linked categories from regular ones
  const specialCatIcons=new Set(["🏁","🤝","🎯","🤲"]);
  const specialCatPrefixes=["Цель","Долг","Копилка"];
  const isSpecialCat=name=>specialCatPrefixes.some(p=>name.startsWith(p))||specialCatIcons.has(catIcons[name]);
  const regularCats=allCats.filter(n=>!isSpecialCat(n));
  const linkedCats=allCats.filter(isSpecialCat);
  const availCurrencies=[...new Set(txs.map(t=>t.originalCurrency||"UZS"))].sort();

  function getDateBounds(){
    if(dateMode==="all") return["0000-00-00","9999-99-99"];
    if(dateMode==="month"){
      const[mY,mM]=[parseInt(selMonth.slice(0,4)),parseInt(selMonth.slice(5,7))];
      return[selMonth+"-01",selMonth+"-"+String(new Date(mY,mM,0).getDate()).padStart(2,"0")];
    }
    if(dateMode==="range") return[rangeFrom||"0000-00-00",rangeTo||"9999-99-99"];
    return[singleDay,singleDay];
  }
  const[dateFrom,dateTo]=getDateBounds();

  const filtered=txs.filter(t=>{
    if(filterType!=="all"&&t.type!==filterType)return false;
    if(selCats.length>0&&!selCats.includes(t.catName))return false;
    if(selCurrencies.length>0&&!selCurrencies.includes(t.originalCurrency||"UZS"))return false;
    if(search&&!(t.catName.toLowerCase().includes(search.toLowerCase())||t.note.toLowerCase().includes(search.toLowerCase())))return false;
    if(t.dateStr<dateFrom||t.dateStr>dateTo)return false;
    return true;
  }).sort((a,b)=>{
    const mul=sortDir==="asc"?1:-1;
    if(sortBy==="amount")return(a.amount-b.amount)*mul;
    return(a.dateStr.localeCompare(b.dateStr)||a.time.localeCompare(b.time))*mul;
  });

  const income=filtered.filter(t=>t.type==="income").reduce((s,t)=>s+t.amount,0);
  const expense=filtered.filter(t=>t.type==="expense").reduce((s,t)=>s+t.amount,0);
  const net=income-expense;
  const catMap={};
  filtered.filter(t=>t.type==="expense").forEach(t=>{catMap[t.catName]=(catMap[t.catName]||0)+t.amount;});
  const catRows=Object.entries(catMap).sort((a,b)=>b[1]-a[1]);
  const maxCat=catRows[0]?.[1]||1;

  const activeFilterCount=[
    filterType!=="all",
    selCats.length>0,
    selCurrencies.length>0,
    search.length>0,
    dateMode!=="all",
    sortBy!=="date"||sortDir!=="desc",
  ].filter(Boolean).length;

  function resetFilters(){setFilterType("all");setSelCats([]);setSelCurrencies([]);setSearch("");setDateMode("all");setSortBy("date");setSortDir("desc");setFilterSheet(false);}

  // Format date range label for title
  const titleDateLabel=(()=>{
    if(dateMode==="all") return "Всё время";
    if(dateMode==="day"){const[dy,dm,dd]=singleDay.split("-");return dd+"."+dm+"."+dy;}
    if(dateMode==="range"){
      if(rangeFrom&&rangeTo){const[fy,fm,fd]=rangeFrom.split("-");const[ty,tm,td]=rangeTo.split("-");return fd+"."+fm+"–"+td+"."+tm;}
      return"Диапазон";
    }
    // month mode
    const MONTH_FULL_RU=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
    const[my,mm]=selMonth.split("-");
    return MONTH_FULL_RU[parseInt(mm)-1]+" "+my;
  })();



  // ── Donut chart helpers ──
  const PIE_COLORS=["#6366F1","#F87171","#FBBF24","#4ADE80","#60A5FA","#A78BFA","#FB923C","#34D399","#F472B6","#94A3B8"];
  function buildDonutPaths(rows,total,cx,cy,outerR,innerR){
    if(!rows.length||!total)return[];
    const GAP=rows.length>1?0.04:0;
    let angle=-Math.PI/2;
    return rows.map((r,i)=>{
      const frac=r[1]/total;
      const sweep=Math.max(0,frac*2*Math.PI-GAP);
      const x1=cx+outerR*Math.cos(angle),y1=cy+outerR*Math.sin(angle);
      const x2=cx+outerR*Math.cos(angle+sweep),y2=cy+outerR*Math.sin(angle+sweep);
      const ix1=cx+innerR*Math.cos(angle+sweep),iy1=cy+innerR*Math.sin(angle+sweep);
      const ix2=cx+innerR*Math.cos(angle),iy2=cy+innerR*Math.sin(angle);
      const large=sweep>Math.PI?1:0;
      const d=`M${x1},${y1} A${outerR},${outerR},0,${large},1,${x2},${y2} L${ix1},${iy1} A${innerR},${innerR},0,${large},0,${ix2},${iy2} Z`;
      const path={d,color:PIE_COLORS[i%PIE_COLORS.length],name:r[0],amt:r[1]};
      angle+=sweep+GAP;
      return path;
    });
  }

  return h("div",{className:"screen anim-fade"},
    // ── Sticky header ──
    h("div",{style:{flexShrink:0}},
      // Header row
      h("div",{style:{display:"flex",alignItems:"center",padding:"8px 16px 8px",gap:10}},
        h("div",{style:{flex:1}},
          h("div",{style:{fontFamily:F,fontSize:22,fontWeight:800,color:C.ink,lineHeight:1.1}},"Отчёты"),
          h("div",{style:{fontSize:11,color:C.ink3,fontWeight:600,marginTop:2}},titleDateLabel)
        ),
        activeFilterCount>0&&h("div",{onClick:resetFilters,style:{fontSize:11,fontWeight:700,color:C.rd,cursor:"pointer",padding:"6px 10px",background:C.rdBg,borderRadius:20}},"Сбросить"),
        h("div",{onClick:()=>setFilterSheet(true),
          style:{position:"relative",display:"flex",alignItems:"center",gap:6,padding:"9px 16px",borderRadius:20,cursor:"pointer",
            background:activeFilterCount>0?C.ink:C.card,border:"1.5px solid "+(activeFilterCount>0?C.ink:C.bdr),
            color:activeFilterCount>0?C.sur:C.ink,transition:"all .15s"}},
          h("div",{style:{fontSize:14}},"⚙️"),
          h("div",{style:{fontFamily:F,fontSize:12,fontWeight:700}},"Фильтры"),
          activeFilterCount>0&&h("div",{style:{position:"absolute",top:-5,right:-5,background:"#F59E0B",color:"#fff",borderRadius:"50%",width:17,height:17,
            fontSize:10,fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center"}},activeFilterCount)
        )
      ),
      // KPI strip
      h("div",{style:{display:"flex",gap:8,padding:"0 16px 8px",flexShrink:0}},
        h("div",{style:{flex:1,background:C.rdBg,borderRadius:14,padding:"10px 12px"}},
          h("div",{style:{fontSize:9,fontWeight:700,color:C.rd,letterSpacing:1.5,textTransform:"uppercase",marginBottom:3}},"Расходы"),
          h("div",{style:{fontFamily:F,fontSize:15,fontWeight:800,color:C.rd}},fmt(expense))
        ),
        h("div",{style:{flex:1,background:C.grBg,borderRadius:14,padding:"10px 12px"}},
          h("div",{style:{fontSize:9,fontWeight:700,color:C.gr,letterSpacing:1.5,textTransform:"uppercase",marginBottom:3}},"Доходы"),
          h("div",{style:{fontFamily:F,fontSize:15,fontWeight:800,color:C.gr}},fmt(income))
        ),
        h("div",{style:{flex:1,background:net>=0?C.grBg:C.rdBg,borderRadius:14,padding:"10px 12px"}},
          h("div",{style:{fontSize:9,fontWeight:700,color:net>=0?C.gr:C.rd,letterSpacing:1.5,textTransform:"uppercase",marginBottom:3}},"Итог"),
          h("div",{style:{fontFamily:F,fontSize:15,fontWeight:800,color:net>=0?C.gr:C.rd}},(net>=0?"+":"")+fmt(net))
        )

      // Month quick-select scroll row
      availMonths.length>0&&h("div",{style:{overflowX:"auto",WebkitOverflowScrolling:"touch",padding:"0 16px 10px",flexShrink:0}},
        h("div",{style:{display:"inline-flex",gap:8}},

          ...availMonths.map(ym=>h("div",{key:ym,

    // ── Filter bottom sheet ──
    filterSheet&&h("div",{style:{position:"fixed",inset:0,zIndex:200,display:"flex",flexDirection:"column",justifyContent:"flex-end"}},

          h("div",{style:{fontFamily:F,fontSize:17,fontWeight:800,color:C.ink}},"Фильтры"),
          h("div",{style:{display:"flex",gap:8,alignItems:"center"}},
            activeFilterCount>0&&h("div",{onClick:resetFilters,style:{fontSize:12,fontWeight:700,color:C.rd,cursor:"pointer",padding:"6px 14px",background:C.rdBg,borderRadius:20}},"Сбросить"),
            h("div",{onClick:()=>setFilterSheet(false),style:{width:32,height:32,borderRadius:10,background:C.card,border:"1px solid "+C.bdr,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",fontSize:16,color:C.ink3}},"✕")

        const size=160,cx=size/2,cy=size/2,outerR=62,innerR=40;

        const legendLimit=showAllLegend?paths.length:5;

        return h("div",{className:"card",style:{padding:"16px 16px 14px",marginBottom:10}},

            h("div",{style:{flexShrink:0}},
              h("svg",{width:size,height:size,viewBox:`0 0 ${size} ${size}`},
                paths.map((p,i)=>h("path",{key:i,d:p.d,fill:p.color})),
                h("circle",{cx,cy,r:innerR,fill:C.card}),
                h("text",{x:cx,y:cy-7,textAnchor:"middle",fill:C.ink3,fontSize:9,fontWeight:"600",fontFamily:"sans-serif"},"расходы"),
                h("text",{x:cx,y:cy+8,textAnchor:"middle",fill:C.ink,fontSize:11,fontWeight:"800",fontFamily:"sans-serif"},
                  compactFmt(chartTotal))
              )
            ),
            // Legend — expandable
            h("div",{style:{flex:1,minWidth:0,display:"flex",flexDirection:"column",gap:6}},
              ...paths.slice(0,legendLimit).map((p,i)=>h("div",{key:i,
                onClick:()=>setSelCats(s=>s.includes(p.name)?s.filter(c=>c!==p.name):[...s,p.name]),
                style:{display:"flex",alignItems:"center",gap:7,cursor:"pointer",padding:"2px 0",
                  opacity:selCats.length>0&&!selCats.includes(p.name)?0.45:1,transition:"opacity .15s"}},
                h("div",{style:{width:10,height:10,borderRadius:3,background:p.color,flexShrink:0}}),
                h("div",{style:{flex:1,minWidth:0,fontSize:11,fontWeight:600,color:C.ink,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},

                h("div",{style:{display:"flex",gap:4,flexShrink:0}},
                  h("div",{style:{fontSize:10,fontWeight:700,color:C.ink3}},Math.round(p.amt/chartTotal*100)+"%"),

                )
              )),
              hiddenCount>0
                ? h("div",{onClick:()=>setShowAllLegend(true),
                    style:{fontSize:11,fontWeight:700,color:"#6366F1",paddingLeft:17,cursor:"pointer",marginTop:2}},

                : showAllLegend&&paths.length>5&&h("div",{onClick:()=>setShowAllLegend(false),
                    style:{fontSize:11,fontWeight:600,color:C.ink3,paddingLeft:17,cursor:"pointer",marginTop:2}},
                    "Свернуть ↑")
            )
          )
        );
      })(),
      // Month balance summary (only when viewing a specific month)
      dateMode==="month"&&(()=>{

        const monthStart=selMonth+"-01";
        const txsBefore=txs.filter(t=>t.dateStr<monthStart);
        const openBal=txsBefore.reduce((s,t)=>t.type==="income"?s+t.amount:s-t.amount,0);
        const closeBal=openBal+income-expense;

            h("div",{style:{fontSize:9,fontWeight:700,color:C.ink3,letterSpacing:1.5,textTransform:"uppercase",marginBottom:4}},"ВЫХОД ИЗ МЕСЯЦА"),
            h("div",{style:{fontFamily:F,fontSize:14,fontWeight:800,color:closeBal>=0?C.gr:C.rd}},compactFmt(Math.abs(closeBal))),
            h("div",{style:{fontSize:9,color:C.ink3,marginTop:2}},"сум")

          h("div",{className:"card",style:{padding:"12px 10px",textAlign:"center",background:diff>=0?C.grBg:C.rdBg}},
            h("div",{style:{fontSize:9,fontWeight:700,color:diff>=0?C.gr:C.rd,letterSpacing:1.5,textTransform:"uppercase",marginBottom:4}},"ИТОГ"),

      // Goals + Debts insight strip
      (()=>{

          // Goals row
          goals.length>0&&h("div",{style:{marginBottom:8}},
            ...goals.map(g=>{
              const pct=g.target>0?Math.min(Math.round(g.saved/g.target*100),100):0;
              return h("div",{key:g.id,className:"card",style:{padding:"10px 14px",marginBottom:6,display:"flex",alignItems:"center",gap:10}},
                h("div",{style:{fontSize:18,flexShrink:0}},g.emoji||"🏁"),
                h("div",{style:{flex:1,minWidth:0}},
                  h("div",{style:{display:"flex",justifyContent:"space-between",marginBottom:4}},
                    h("div",{style:{fontFamily:F,fontSize:12,fontWeight:700,color:C.ink,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},g.name),
                    h("div",{style:{fontFamily:F,fontSize:11,fontWeight:700,color:C.ink3,flexShrink:0,marginLeft:8}},pct+"%")
                  ),
                  h("div",{style:{height:4,borderRadius:4,background:C.bdr,overflow:"hidden"}},
                    h("div",{style:{height:"100%",borderRadius:4,background:C.ink,width:pct+"%",transition:"width .3s"}}))

                h("div",{style:{fontFamily:F,fontSize:11,fontWeight:700,color:C.ink2,flexShrink:0,textAlign:"right"}},

            })

          debts.length>0&&(()=>{
            const totalBorrow=debts.filter(d=>d.type==="borrowed").reduce((s,d)=>s+d.amount,0);
            const totalLent=debts.filter(d=>d.type==="lent").reduce((s,d)=>s+d.amount,0);
            return h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}},

                h("div",{style:{fontFamily:F,fontSize:16,fontWeight:800,color:C.rd}},fmt(totalBorrow)),
                h("div",{style:{fontSize:10,color:C.rd,fontFamily:F,opacity:.7}},"по "+debts.filter(d=>d.type==="borrowed").length+" долгу")
              ),
              totalLent>0&&h("div",{className:"card",style:{padding:"10px 12px",background:C.grBg,border:"none"}},
                h("div",{style:{fontSize:9,fontWeight:700,color:C.gr,letterSpacing:1.5,textTransform:"uppercase",marginBottom:3,fontFamily:F}},"МНЕ ДОЛЖНЫ"),
                h("div",{style:{fontFamily:F,fontSize:16,fontWeight:800,color:C.gr}},fmt(totalLent)),
                h("div",{style:{fontSize:10,color:C.gr,fontFamily:F,opacity:.7}},"по "+debts.filter(d=>d.type==="lent").length+" долгу")
              )
            );
          })()
        );
      })(),
      h("div",{style:{fontFamily:F,fontSize:13,fontWeight:800,color:C.ink,marginBottom:10,letterSpacing:.5}},
        "ОПЕРАЦИИ ("+filtered.length+")"),
      filtered.length===0
        ?h("div",{style:{textAlign:"center",padding:"40px 20px"}},
          h("div",{style:{fontSize:44,marginBottom:12}},"📭"),
          h("div",{style:{fontFamily:F,fontSize:15,fontWeight:800,color:C.ink,marginBottom:4}},txs.length===0?"Нет записей":"Нет результатов"),
          h("div",{style:{fontSize:12,color:C.ink3}},txs.length===0?"Добавьте первую запись":"Попробуйте изменить фильтры")
        )
        :filtered.map(tx=>h(TxCard,{key:tx.id,tx,onTap:onTxTap})),
      h("div",{style:{height:20}})
    )
  );
}

  "Uzcard":"#1E3A5F","HUMO":"#7C3AED","Kapitalbank":"#0F766E",
  "Hamkorbank":"#B45309","TBC":"#0369A1","Alif":"#047857","MyUzcard":"#4338CA","Другой":"#374151"
};

// Bank cards double as accounts: every card gets a matching entry in the
// localStorage-backed account list (finly_accounts) so it shows up in the
// Accounts screen and every account picker in the app. Cards are tagged with
// cardId so renames stay in sync with the card's alias on the server.
function syncCardAccounts(cards){
  if(!cards||!cards.length)return;
  try{
    const accs=JSON.parse(localStorage.getItem("finly_accounts")||"[]");
    let changed=false;
    cards.forEach(card=>{
      const idx=accs.findIndex(a=>a.cardId===card.id);
      if(idx===-1){
        accs.push({name:card.alias,icon:"🏦",initial:0,cardId:card.id});
        changed=true;
      }else if(accs[idx].name!==card.alias){
        accs[idx]={...accs[idx],name:card.alias};
        changed=true;
      }
    });
    if(changed)localStorage.setItem("finly_accounts",JSON.stringify(accs));
  }catch{}
}

  const[loading,setLoading]=useState(true);
  const[addForm,setAddForm]=useState({bank:"HUMO",card_full:"",alias:""});
  const[saving,setSaving]=useState(false);
  const[showSetup,setShowSetup]=useState(false);

  useEffect(()=>{
    fetch(API_URL+"/api/bank_cards",{headers:{"X-Init-Data":getInitData()}})
      .then(r=>r.ok?r.json():[]).then(d=>{setCards(d);syncCardAccounts(d);setLoading(false);}).catch(()=>setLoading(false));
  },[]);

  async function addCard(){
    if(saving)return;
    const digits=(addForm.card_full||"").replace(/\D/g,"");
    if(digits.length<4){alert("Введите номер карты");return;}
    if(!addForm.alias.trim()){alert("Введите название карты");return;}
    const last4=digits.slice(-4);
    setSaving(true);
    try{
      const r=await fetch(API_URL+"/api/bank_cards",{
        method:"POST",headers:{"Content-Type":"application/json","X-Init-Data":getInitData()},
        body:JSON.stringify({bank:addForm.bank,card_last4:last4,alias:addForm.alias,balance:0,include_in_balance:true})
      });
      if(r.ok){
        const c=await r.json();
        setCards(prev=>[...prev,c]);
        syncCardAccounts([c]);
        setShowAdd(false);setAddForm({bank:"HUMO",card_full:"",alias:""});
      }
    }catch{}
    setSaving(false);
  }

  async function toggleAutoLog(card){
    try{
      const r=await fetch(API_URL+"/api/bank_cards/"+card.id,{
        method:"PATCH",headers:{"Content-Type":"application/json","X-Init-Data":getInitData()},
        body:JSON.stringify({auto_log:!card.auto_log})
      });
      if(r.ok)setCards(prev=>prev.map(c=>c.id===card.id?{...c,auto_log:!c.auto_log}:c));
    }catch{}
  }

  async function deleteCard(id){
    if(!confirm("Удалить карту? Связанный счёт тоже будет скрыт."))return;
    try{
      await fetch(API_URL+"/api/bank_cards/"+id,{method:"DELETE",headers:{"X-Init-Data":getInitData()}});
      setCards(prev=>prev.filter(c=>c.id!==id));
      // Remove the linked account entry and hide its name so past transactions
      // stop resurrecting it, mirroring how account deletion works elsewhere.
      try{
        const accs=JSON.parse(localStorage.getItem("finly_accounts")||"[]");
        const gone=accs.find(a=>a.cardId===id);
        localStorage.setItem("finly_accounts",JSON.stringify(accs.filter(a=>a.cardId!==id)));
        if(gone){
          const hidden=JSON.parse(localStorage.getItem("finly_hidden_accounts")||"[]");
          if(!hidden.includes(gone.name)){
            localStorage.setItem("finly_hidden_accounts",JSON.stringify([...hidden,gone.name]));
          }
        }
      }catch{}
    }catch{}

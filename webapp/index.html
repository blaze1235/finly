<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Finly</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;height:100dvh;background:#F4F5F7;font-family:'DM Sans',sans-serif;overflow:hidden;}
::-webkit-scrollbar{display:none;}*{scrollbar-width:none;}
#app{width:100%;height:100%;height:100dvh;background:#F4F5F7;overflow:hidden;display:flex;flex-direction:column;position:relative;}

@keyframes slideUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}
.anim-up{animation:slideUp .22s ease forwards;}
.anim-fade{animation:fadeIn .18s ease forwards;}
.screen{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;z-index:1;}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
/* NAV */
.navbar{background:#fff;padding:6px 4px 18px;display:flex;gap:2px;flex-shrink:0;}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:12px;cursor:pointer;transition:all .12s;position:relative;}
.ni.act{background:#F4F5F7;}
.ni-icon{font-size:20px;line-height:1;}
.ni-lbl{font-family:'Syne',sans-serif;font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#B0B7C3;}
.ni.act .ni-lbl{color:#111318;}
.ni-dot{position:absolute;top:6px;right:8px;width:7px;height:7px;border-radius:50%;background:#DC2626;border:2px solid #F4F5F7;}
/* STATUS BAR */
.sb{display:flex;justify-content:space-between;align-items:center;padding:14px 22px 4px;font-family:'Syne',sans-serif;font-size:12px;font-weight:700;flex-shrink:0;}
.sb.light{color:#111318;background:#F4F5F7;}
.sb.dark{color:rgba(255,255,255,.7);background:#1C1C1E;}
/* PAGE HEADER */
.ph{display:flex;align-items:center;gap:12px;padding:8px 20px 14px;background:#F4F5F7;flex-shrink:0;}
.back{font-size:24px;cursor:pointer;color:#111318;line-height:1;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:#F4F5F7;}
.ph-title{font-family:'Syne',sans-serif;font-size:19px;font-weight:800;color:#111318;flex:1;}
.ph-action{font-size:12px;font-weight:700;color:#6B7280;cursor:pointer;padding:8px 12px;border-radius:10px;background:#F4F5F7;}
/* CARDS */
.card{background:#fff;border-radius:20px;}
/* BUTTONS */
.btn{border-radius:16px;padding:16px;font-family:'Syne',sans-serif;font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;text-align:center;cursor:pointer;transition:all .12s;border:none;outline:none;-webkit-tap-highlight-color:transparent;}
.btn:active{transform:scale(.97);}
.btn-ink{background:#111318;color:#fff;}
.btn-ink:active{background:#2a2a30;}
.btn-red{background:#DC2626;color:#fff;}
.btn-gray{background:#F0F0F2;color:#111318;}
.btn-red-out{background:#FEF2F2;color:#DC2626;}
/* TX CARD */
.txc{background:#fff;border-radius:18px;padding:14px 16px;margin-bottom:8px;cursor:pointer;transition:all .1s;}
.txc:active{transform:scale(.98);background:#FAFAFA;}
.tx-icon{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
/* FORM */
.flabel{font-family:'Syne',sans-serif;font-size:10px;font-weight:700;color:#B0B7C3;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:7px;display:block;}
.finput{width:100%;background:#F4F5F7;border:none;border-radius:14px;padding:14px 16px;font-family:'Syne',sans-serif;font-size:24px;font-weight:700;color:#111318;outline:none;}

.finput.sm{font-size:15px;font-family:'DM Sans',sans-serif;font-weight:600;}
textarea.finput{font-size:14px;font-family:'DM Sans',sans-serif;resize:none;height:70px;font-weight:400;}
/* TOGGLE */
.tog{width:44px;height:26px;border-radius:13px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;}
.tog.on{background:#111318;}.tog.off{background:#D1D5DB;}
.tog-k{width:20px;height:20px;border-radius:50%;background:#fff;position:absolute;top:3px;transition:left .15s;box-shadow:0 1px 4px rgba(0,0,0,.2);}
.tog.on .tog-k{left:21px;}.tog.off .tog-k{left:3px;}
/* CAT GRID */
.catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;}
.catbtn{padding:14px 6px;border-radius:14px;background:#F4F5F7;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;transition:all .1s;}
.catbtn:active{transform:scale(.96);}
.catbtn.sel-e{background:#FEF2F2;}
.catbtn.sel-i{background:#F0FDF4;}
.catbtn-icon{font-size:24px;}
.catbtn-name{font-size:11px;font-weight:600;color:#111318;text-align:center;line-height:1.2;}
.catbtn.sel-e .catbtn-name{color:#DC2626;}
.catbtn.sel-i .catbtn-name{color:#16A34A;}
/* CURRENCY */
.currrow{display:flex;background:#F0F0F2;border-radius:12px;padding:3px;flex-shrink:0;}
.currp{padding:10px 14px;border-radius:10px;font-family:'Syne',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all .15s;color:#6B7280;}
.currp.act{background:#111318;color:#fff;}
/* CHIPS */
.chip-green{background:#F0FDF4;color:#16A34A;}.chip-red{background:#FEF2F2;color:#DC2626;}.chip-amber{background:#FFFBEB;color:#D97706;}.chip{font-size:10px;font-weight:700;letter-spacing:.8px;padding:4px 10px;border-radius:8px;display:inline-block;text-transform:uppercase;}
.chip-g{background:#F0FDF4;color:#16A34A;}
.chip-r{background:#FEF2F2;color:#DC2626;}
.chip-a{background:#FFFBEB;color:#D97706;}
.chip-b{background:#EFF6FF;color:#2563EB;}
.chip-p{background:#FAF5FF;color:#7C3AED;}
/* PROG BAR */
.ptrack{height:6px;background:#ECEEF2;border-radius:3px;overflow:hidden;}
.pfill{height:100%;border-radius:3px;transition:width .4s ease;}
.pfill.g{background:#16A34A;}.pfill.a{background:#D97706;}.pfill.r{background:#DC2626;}
.pfill.xp{background:linear-gradient(90deg,#D97706,#F59E0B);}
/* SETTINGS */
.scard{background:#fff;border-radius:20px;overflow:hidden;}
.srow{display:flex;align-items:center;padding:15px 16px;gap:13px;cursor:pointer;transition:background .1s;position:relative;}
.srow:active{background:#F4F5F7;}
.srow+.srow::before{content:'';position:absolute;top:0;left:48px;right:0;height:1px;background:#ECEEF2;}
.s-ic{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
/* MODAL OVERLAY */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:flex;align-items:flex-end;animation:fadeIn .15s ease;}
.msheet{background:#fff;border-radius:28px 28px 0 0;width:100%;padding:16px 20px 36px;animation:slideUp .2s ease;max-height:90%;}
.mhandle{width:40px;height:4px;border-radius:2px;background:#ECEEF2;margin:0 auto 18px;}
/* TOAST */
.toast{position:absolute;top:16px;left:12px;right:12px;z-index:100;background:#1C1C1E;border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 32px rgba(0,0,0,.4);animation:slideDown .25s ease;}
/* STREAK BANNER */
.streak-ban{background:linear-gradient(135deg,#1C1C1E,#28282C);border-radius:20px;padding:14px 16px;display:flex;align-items:center;gap:14px;margin-bottom:10px;position:relative;overflow:hidden;}
.streak-ban::after{content:'';position:absolute;right:-20px;top:-20px;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,rgba(245,158,11,.12) 0%,transparent 70%);}
.sdot{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;}
.sdot.dn{background:#F59E0B;color:#1C1C1E;}
.sdot.td{background:rgba(245,158,11,.15);border:1.5px solid #F59E0B;color:#F59E0B;}
.sdot.ms{background:#222;color:#444;}
/* TYPE ROW */
.typerow{display:flex;gap:5px;margin-bottom:16px;background:#F4F5F7;border-radius:14px;padding:4px;}
.typebtn{flex:1;padding:12px 6px;border-radius:11px;font-family:'Syne',sans-serif;font-size:13px;font-weight:700;text-align:center;cursor:pointer;transition:all .15s;color:#6B7280;}
.typebtn.exp-on{background:#DC2626;color:#fff;}
.typebtn.inc-on{background:#16A34A;color:#fff;}
/* FILTER */
.fbar{display:flex;gap:6px;overflow-x:auto;flex-shrink:0;padding:0 16px 10px;}
.fpill{padding:8px 16px;border-radius:999px;font-size:11px;font-weight:700;background:#ECEEF2;color:#6B7280;flex-shrink:0;cursor:pointer;transition:all .12s;}
.fpill.act{background:#111318;color:#fff;border-color:#111318;}
/* KPI ROW */
.kpi-row{display:grid;grid-template-columns:1fr 1px 1fr 1px 1fr;background:#fff;border-radius:18px;margin-bottom:12px;overflow:hidden;}
.kpi-cell{text-align:center;padding:18px 4px;}
.kpi-val{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;}
.kpi-lab{font-size:9px;font-weight:700;color:#B0B7C3;letter-spacing:.5px;text-transform:uppercase;margin-top:3px;}
/* BUDGET */
.budg-item{background:#fff;border-radius:18px;padding:14px 16px;margin-bottom:8px;cursor:pointer;transition:all .1s;}
.budg-item:active{transform:scale(.98);}
/* SEARCH */
.sinput{width:100%;border:none;border-radius:14px;padding:12px 16px;font-size:14px;font-family:'DM Sans',sans-serif;color:#111318;background:#F4F5F7;outline:none;}

/* SUMMARY CARDS */
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.sum-card{border-radius:18px;padding:14px 16px;border:1px solid;}
/* PROFILE HERO */
.prof-hero{background:#1C1C1E;padding:16px 20px 0;position:relative;overflow:hidden;flex-shrink:0;}
.prof-hero::before{content:'';position:absolute;top:-50px;right:-50px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(245,158,11,.08) 0%,transparent 70%);}
.ph-stat-row{display:grid;grid-template-columns:1fr 1px 1fr 1px 1fr;background:rgba(255,255,255,.04);border-top:1px solid rgba(255,255,255,.06);padding:10px 0;margin-top:12px;}
/* SUCCESS */
.success-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;background:#F4F5F7;}
/* LOGO */
.logo{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;color:#111318;letter-spacing:-1px;}
.logo span{color:#111318;}
/* WALLET CARD */
.wallet{background:#111318;border-radius:22px;padding:22px 20px;margin-bottom:10px;position:relative;overflow:hidden;}
.wallet::before{content:'';position:absolute;top:-40px;right:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.03);}
/* REWARDS HERO */
.rw-hero{background:linear-gradient(160deg,#1a0a3e,#2d1069,#1C1C1E);padding:20px 20px 0;position:relative;overflow:hidden;flex-shrink:0;}
.rw-hero::before{content:'';position:absolute;top:-60px;right:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,.25) 0%,transparent 70%);}
/* DARK MODE */
.dark{background:#111318!important;}
.dark .navbar{background:#1C1C1E;border-top:1px solid rgba(255,255,255,.06);}
.dark .ni.act{background:rgba(255,255,255,.07);}
.dark .ni-lbl{color:#4B5563;}
.dark .ni.act .ni-lbl{color:#fff;}
.dark .ni-dot{border-color:#111318;}
.dark .ph{background:#111318;}
.dark .back{background:#1C1C1E;color:#fff;}
.dark .ph-title{color:#fff;}
.dark .ph-action{background:#1C1C1E;color:#9CA3AF;}
.dark .card{background:#1C1C1E;}
.dark .txc{background:#1C1C1E;}
.dark .txc:active{background:#252529;}
.dark .finput{background:#252529;color:#fff;}
.dark textarea.finput{color:#fff;}
.dark .sinput{background:#252529;color:#fff;}
.dark .flabel{color:#4B5563;}
.dark .catbtn{background:#252529;}
.dark .catbtn-name{color:#e5e7eb;}
.dark .typerow{background:#252529;}
.dark .typebtn{color:#9CA3AF;}
.dark .fpill{background:#252529;color:#9CA3AF;}
.dark .fpill.act{background:#fff;color:#111318;}
.dark .kpi-row{background:#1C1C1E;}
.dark .kpi-lab{color:#4B5563;}
.dark .budg-item{background:#1C1C1E;}
.dark .msheet{background:#1C1C1E;}
.dark .mhandle{background:rgba(255,255,255,.1);}
.dark .scard{background:#1C1C1E;}
.dark .srow:active{background:#252529;}
.dark .srow+.srow::before{background:rgba(255,255,255,.06);}
.dark .btn-gray{background:#252529;color:#fff;}
.dark .ptrack{background:#252529;}
.dark .currrow{background:#252529;}
.dark .currp{color:#9CA3AF;}
.dark .currp.act{background:#fff;color:#111318;}
.dark .tog.off{background:#374151;}
.dark .streak-ban{background:linear-gradient(135deg,#1C1C1E,#252529);}
.dark .sdot.dn{background:#4ADE80;color:#111318;}
.dark .sdot.td{background:rgba(74,222,128,.15);border-color:#4ADE80;color:#4ADE80;}
.dark .sdot.ms{background:#1C1C1E;color:#374151;}
.dark .wallet{background:#252529;}
.dark .hero-card{background:#1C1C1E;}
.dark .sum-card{border-color:rgba(255,255,255,.08)!important;}
.dark .success-wrap{background:#111318;}
.dark .logo{color:#fff;}
.dark .logo span{color:#fff;}
.dark .streak-ban{background:linear-gradient(135deg,#1C1C1E,#25252A);}
.dark .sdot.dn{background:#4ADE80;color:#111318;}
.dark .sdot.td{background:rgba(74,222,128,.15);border-color:#4ADE80;color:#4ADE80;}
.dark .prof-hero{background:#0d0d11;border-bottom:1px solid rgba(255,255,255,.06);}
.dark .rw-hero{background:linear-gradient(160deg,#12072a,#1d0a44,#111318);}
/* Hero cards — always dark but adapt between themes */
.hero-card{background:#111318;}
.dark .hero-card{background:#1C1C1E;}

  <!-- Telegram WebApp SDK must load before the API client so initData is available -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Set your Railway API URL here, or inject via build -->
  <script>window.FINLY_API_URL = "https://finly-tracker.up.railway.app";</script>
  <script>
  /* ── API CLIENT ── */
  const API_URL = window.FINLY_API_URL || "";
  /* Lazy getter so initData is always read at request time, not at parse time */
  const _getInitData = () => window.Telegram?.WebApp?.initData || "";

  async function _req(method, path, body) {
    const opts = {
      method,
      headers: {
        "Content-Type": "application/json",
        "X-Init-Data": _getInitData(),
      },
    };
    if (body !== undefined) opts.body = JSON.stringify(body);
    const res = await fetch(API_URL + path, opts);
    if (!res.ok) {
      const text = await res.text();
      throw new Error(`API ${method} ${path} → ${res.status}: ${text}`);
    }
    return res.json();
  }

  const API = {
    auth:         ()          => _req("POST", "/api/auth"),
    addTx:        (body)      => _req("POST", "/api/transactions", body),
    editTx:       (id, body)  => _req("PUT",  `/api/transactions/${id}`, body),
    delTx:        (id)        => _req("DELETE",`/api/transactions/${id}`),
    addDraft:     (body)      => _req("POST", "/api/drafts", body),
    delDraft:     (id)        => _req("DELETE",`/api/drafts/${id}`),
    addBudget:    (body)      => _req("POST", "/api/budgets", body),
    editBudget:   (id, body)  => _req("PUT",  `/api/budgets/${id}`, body),
    delBudget:    (id)        => _req("DELETE",`/api/budgets/${id}`),
    addCategory:  (body)      => _req("POST", "/api/categories", body),
    delCategory:  (id)        => _req("DELETE",`/api/categories/${id}`),
    patchUser:    (body)      => _req("PATCH", "/api/user", body),
    leaderboard:  ()          => _req("GET",  "/api/leaderboard"),
    analytics:    ()          => _req("GET",  "/api/analytics"),
  };
  </script>

<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
const{useState,useEffect,useRef,useCallback}=React;
const h=React.createElement;

/* ── TELEGRAM USER (global so all components can access) ── */
const TGUser = window.Telegram?.WebApp?.initDataUnsafe?.user || null;
if (window.Telegram?.WebApp) {
  window.Telegram.WebApp.ready();
  window.Telegram.WebApp.expand();
}
const TG_NAME = TGUser?.first_name || "Абдулазиз";
const TG_INITIAL = (TGUser?.first_name || "А")[0].toUpperCase();
const TG_USERNAME = TGUser?.username ? "@"+TGUser.username : "@alisherjon";

/* ── TOKENS ── */
const C_LIGHT={bg:"#F4F5F7",sur:"#FFFFFF",ink:"#111318",ink2:"#6B7280",ink3:"#B0B7C3",bdr:"#ECEEF2",
  gr:"#16A34A",grBg:"#F0FDF4",grMd:"#DCFCE7",rd:"#DC2626",rdBg:"#FEF2F2",rdMd:"#FEE2E2",
  am:"#D97706",amBg:"#FFFBEB",bl:"#2563EB",blBg:"#EFF6FF",pu:"#7C3AED",puBg:"#FAF5FF",
  dk:"#1C1C1E",am2:"#F59E0B"};
const C_DARK={bg:"#111318",sur:"#1C1C1E",ink:"#FFFFFF",ink2:"#9CA3AF",ink3:"#4B5563",bdr:"rgba(255,255,255,.08)",
  gr:"#4ADE80",grBg:"rgba(74,222,128,.12)",grMd:"rgba(74,222,128,.2)",
  rd:"#F87171",rdBg:"rgba(248,113,113,.12)",rdMd:"rgba(248,113,113,.2)",
  am:"#FCD34D",amBg:"rgba(252,211,77,.1)",bl:"#60A5FA",blBg:"rgba(96,165,250,.1)",
  pu:"#A78BFA",puBg:"rgba(167,139,250,.1)",dk:"#0A0A0C",am2:"#F59E0B"};
let C=Object.assign({},C_LIGHT);
const F="'Syne',sans-serif";
const fmt=n=>Math.round(n).toLocaleString("ru-RU");
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const nowTime=()=>{const d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");};
const dispDate=s=>{const t=today();if(s===t)return"Сегодня";const y=new Date();y.setDate(y.getDate()-1);const ys=y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");if(s===ys)return"Вчера";return s.slice(8)+"."+s.slice(5,7);};

/* ── GLOBAL TOAST ── */
let _setToast=null;
function showToast(t){if(_setToast)_setToast(t);}

const EXP_CATS=[
  {icon:"🛒",name:"Продукты"},{icon:"🏠",name:"Жильё"},{icon:"🚌",name:"Транспорт"},
  {icon:"🍕",name:"Кафе"},{icon:"💊",name:"Здоровье"},{icon:"🎬",name:"Развлечения"},
  {icon:"👕",name:"Одежда"},{icon:"📚",name:"Образование"},{icon:"🤷",name:"Забыл"},{icon:"•••",name:"Прочее"},
];
const INC_CATS=[
  {icon:"💼",name:"Зарплата"},{icon:"💹",name:"Подработка"},{icon:"🏦",name:"Инвестиции"},{icon:"🎁",name:"Подарок"},
];

const INIT_TXS=[];

const INIT_DRAFTS=[];

const INIT_BUDGETS=[];

const INIT_ACHS=[];

const XP_LOG=[
  {icon:"🔥",label:"Серия сохранена",sub:"14:32 · Streak ×14",pts:20,dateStr:"2025-05-13"},
  {icon:"➕",label:"Добавлена операция",sub:"14:32 · Продукты",pts:10,dateStr:"2025-05-13"},
  {icon:"📊",label:"Открыта аналитика",sub:"13:10",pts:5,dateStr:"2025-05-13"},
  {icon:"🔥",label:"Серия сохранена",sub:"10:00 · Streak ×13",pts:20,dateStr:"2025-05-12"},
  {icon:"➕",label:"Добавлена операция",sub:"09:15 · Зарплата",pts:10,dateStr:"2025-05-12"},
];

/* ── SHARED COMPONENTS ── */

function Logo(){
  return h("div",{className:"logo"},"Finly.");
}
function Toggle({on,cb}){
  return h("div",{className:"tog "+(on?"on":"off"),onClick:cb},h("div",{className:"tog-k"}));
}
function Streak({streak}){
  const days=Array.from({length:7},(_,i)=>{
    const pct=(streak%7)||7;
    if(i<pct-1)return"dn";
    if(i===pct-1)return"td";
    return"ms";
  });
  return h("div",{className:"streak-ban"},

/* ── ADD SCREEN ── */
function AddScreen({data,setData,onSaved,setTab}){
  const[type,setType]=useState("expense");
  const[amount,setAmount]=useState("");
  const[currency,setCurrency]=useState("UZS");
  const[usdRate,setUsdRate]=useState("12700");
  const[selCat,setSelCat]=useState(null);
  const[note,setNote]=useState("");
  const[recurring,setRecurring]=useState(false);
  const[draftMsg,setDraftMsg]=useState(false);
  const[showDrafts,setShowDrafts]=useState(false);
  const cats=type==="expense"?EXP_CATS:INC_CATS;
  const canSave=amount.trim()&&selCat;

  const[saving,setSaving]=useState(false);
  async function save(){
    if(!canSave||saving)return;
    setSaving(true);
    const raw=parseInt(amount.replace(/\D/g,""))||0;
    const finalAmt=currency==="$"?raw*(parseInt(usdRate.replace(/\D/g,""))||12700):raw;
    const body={type,cat_icon:selCat.icon,cat_name:selCat.name,
      note:note||selCat.name,amount:finalAmt,date_str:today(),
      time_str:nowTime(),currency,recurring,account:"Карта"};
    try{
      const res=await API.addTx(body);
      setData(d=>({...d,txs:[res.tx,...d.txs],xp:res.total_xp,level:res.level,streak:res.streak}));
      onSaved(res.tx, res.xp_earned, res.total_xp);
    }catch(e){
      console.error(e);
      // Optimistic fallback so UI doesn't freeze
      const tx={id:Date.now(),type,cat:selCat.icon,catName:selCat.name,note:note||selCat.name,amount:finalAmt,dateStr:today(),time:nowTime(),currency,recurring,account:"Карта"};
      setData(d=>({...d,txs:[tx,...d.txs],xp:d.xp+15}));
      onSaved(tx,15,data.xp+15);
    } finally{ setSaving(false); }
  }
  async function draft(){
    if(!amount.trim())return;
    const raw=parseInt(amount.replace(/\D/g,""))||0;
    const body={type,cat_icon:selCat?.icon||"❓",cat_name:selCat?.name||"Без категории",
      note,amount:raw,date_str:today(),time_str:nowTime(),currency};
    try{
      const dr=await API.addDraft(body);
      setData(d=>({...d,drafts:[dr,...d.drafts]}));
    }catch(e){
      const dr={id:Date.now(),type,cat:selCat?.icon||"❓",catName:selCat?.name||"Без категории",note,amount:raw,dateStr:today(),time:nowTime(),currency,isDraft:true};
      setData(d=>({...d,drafts:[dr,...d.drafts]}));
    }
    setDraftMsg(true);setTimeout(()=>setDraftMsg(false),2200);
    setAmount("");setSelCat(null);setNote("");
  }

  if(showDrafts)return h(DraftsScreen,{data,setData,onClose:()=>setShowDrafts(false),onComplete:(dr)=>{
    setShowDrafts(false);
    setType(dr.type);setAmount(String(dr.amount));setNote(dr.note);
    setSelCat({icon:dr.cat,name:dr.catName});
    setData(d=>({...d,drafts:d.drafts.filter(x=>x.id!==dr.id)}));
  }});

  return h("div",{className:"screen anim-fade"},
    h("div",{className:"ph"},
      h("div",{className:"back",onClick:()=>setTab("home")},"←"),
      h("div",{className:"ph-title"},"Новая запись"),
      h("div",{className:"ph-action",onClick:()=>setShowDrafts(true),style:{position:"relative"}},
        "Черновики",
        data.drafts.length>0?h("div",{style:{position:"absolute",top:-3,right:-3,width:8,height:8,borderRadius:"50%",background:C.rd,border:`2px solid ${C.bg}`}}):null
      )
    ),
    draftMsg&&h("div",{style:{margin:"0 16px 8px",background:C.amBg,borderRadius:12,padding:"10px 14px",fontSize:13,fontWeight:700,color:C.am}},"✓ Черновик сохранён"),
    h("div",{className:"scroll",style:{padding:"0 16px"}},
      h("div",{className:"card",style:{padding:18,marginBottom:8}},
        // type
        h("div",{className:"typerow"},
          ["expense","income"].map(t=>h("div",{key:t,className:"typebtn "+(type===t?(t==="expense"?"exp-on":"inc-on"):""),onClick:()=>{setType(t);setSelCat(null);}},
            t==="expense"?"Расход":"Доход"))
        ),
        // amount + currency
        h("label",{className:"flabel"},"СУММА"),
        h("div",{style:{display:"flex",gap:8,marginBottom:14,alignItems:"center"}},
          h("div",{className:"currrow"},
            ["$","UZS"].map(c=>h("div",{key:c,className:"currp"+(currency===c?" act":""),onClick:()=>setCurrency(c)},c))
          ),
          h("input",{className:"finput",style:{flex:1,marginBottom:0,fontSize:26},placeholder:currency==="$"?"0":"0",inputMode:"numeric",value:amount,onChange:e=>setAmount(e.target.value)})
        ),
        currency==="$"&&h("div",{style:{marginBottom:14}},
          h("label",{className:"flabel"},"КУРС (1$ = ? СУМ)"),
          h("input",{className:"finput sm",style:{marginBottom:0},value:usdRate,inputMode:"numeric",onChange:e=>setUsdRate(e.target.value)})
        ),
        // cats
        h("label",{className:"flabel"},"КАТЕГОРИЯ"),
        h("div",{className:"catgrid"},
          cats.map(c=>h("div",{key:c.name,className:"catbtn"+(selCat?.name===c.name?" sel-"+(type==="expense"?"e":"i"):""),onClick:()=>setSelCat(c)},
            h("div",{className:"catbtn-icon"},c.icon),
            h("div",{className:"catbtn-name"},c.name)
          ))
        ),
        // note
        h("label",{className:"flabel"},"ПРИМЕЧАНИЕ"),
        h("textarea",{className:"finput",style:{marginBottom:12},placeholder:"Необязательно...",value:note,onChange:e=>setNote(e.target.value)}),
        // recurring
        h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 0",marginBottom:10}},
          h("div",null,
            h("div",{style:{fontSize:14,fontWeight:600,color:C.ink}},"Повторяющаяся"),
            h("div",{style:{fontSize:11,color:C.ink3,marginTop:2}},"Добавлять каждый месяц")),
          h(Toggle,{on:recurring,cb:()=>setRecurring(!recurring)})
        ),
        // xp hint
        h("div",{style:{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",background:"rgba(245,158,11,.06)",borderRadius:12,marginBottom:16}},
          h("div",{style:{fontSize:18}},"⭐"),
          h("div",{style:{fontSize:12,fontWeight:600,color:C.am}},"+10 XP за запись · серия продолжается")
        ),
        // actions
        h("div",{style:{display:"flex",gap:10}},
          h("div",{className:"btn btn-gray",style:{flex:1,fontSize:12},onClick:draft},"Черновик"),
          h("div",{className:"btn "+(canSave?"btn-ink":""),style:{flex:2,fontSize:12,background:canSave?C.ink:C.bdr,color:canSave?"#fff":C.ink3,cursor:canSave?"pointer":"default",borderRadius:16,padding:16,fontFamily:F,fontWeight:700,letterSpacing:1.5,textTransform:"uppercase",textAlign:"center"},onClick:save},"Сохранить")
        )
      ),
      h("div",{style:{height:20}})
    )
  );
}

/* ── ANALYTICS ── */
function AnalyticsScreen({data,onTxTap}){
  const{txs}=data;
  const[search,setSearch]=useState("");
  const[filterType,setFilterType]=useState("all");
  const[selCats,setSelCats]=useState([]);

  // Derive available months from real transaction data, sorted newest first
  const monthsMap={};txs.forEach(t=>{if(t.dateStr)monthsMap[t.dateStr.slice(0,7)]=true;});
  const availMonths=Object.keys(monthsMap).sort().reverse();
  const MONTH_RU=["Янв","Фев","Мар","Апр","Май","Июн","Июл","Авг","Сен","Окт","Ноя","Дек"];
  const fmtMonth=ym=>{const[y,m]=ym.split("-");return MONTH_RU[parseInt(m)-1]+" "+y;};
  const curYM=new Date().getFullYear()+"-"+String(new Date().getMonth()+1).padStart(2,"0");
  const defaultMonth=availMonths.length>0?(availMonths.includes(curYM)?curYM:availMonths[0]):curYM;
  const[selMonth,setSelMonth]=useState(defaultMonth);

  // Date range for selected month
  const[mY,mM]=[parseInt(selMonth.slice(0,4)),parseInt(selMonth.slice(5,7))];
  const lastDay=new Date(mY,mM,0).getDate();
  const dateFrom=selMonth+"-01";
  const dateTo=selMonth+"-"+String(lastDay).padStart(2,"0");

  // Category icons map
  const catIcons={};txs.forEach(t=>{catIcons[t.catName]=t.cat;});
  // Categories filtered by currently selected type
  const allCats=[...new Set(txs.filter(t=>filterType==="all"||t.type===filterType).map(t=>t.catName))];

  const filtered=txs.filter(t=>{
    if(filterType!=="all"&&t.type!==filterType)return false;
    if(selCats.length>0&&!selCats.includes(t.catName))return false;
    if(search&&!(t.catName.toLowerCase().includes(search.toLowerCase())||t.note.toLowerCase().includes(search.toLowerCase())))return false;
    if(t.dateStr<dateFrom||t.dateStr>dateTo)return false;
    return true;
  }).sort((a,b)=>b.dateStr.localeCompare(a.dateStr)||b.time.localeCompare(a.time));

  const income=filtered.filter(t=>t.type==="income").reduce((a,b)=>a+b.amount,0);
  const expense=filtered.filter(t=>t.type==="expense").reduce((a,b)=>a+b.amount,0);
  const catMap={};
  filtered.filter(t=>t.type==="expense").forEach(t=>{catMap[t.catName]=(catMap[t.catName]||0)+t.amount;});
  const catRows=Object.entries(catMap).sort((a,b)=>b[1]-a[1]);
  const maxCat=catRows[0]?.[1]||1;

  function selectType(ft){setFilterType(ft);setSelCats([]);}
  function selectMonth(ym){setSelMonth(ym);setSelCats([]);}

  return h("div",{className:"screen anim-fade"},
    h("div",{style:{display:"flex",alignItems:"center",padding:"6px 20px 12px",background:C.bg}},
      h("div",{style:{fontFamily:F,fontSize:22,fontWeight:800,color:C.ink,flex:1}},"Аналитика")
    ),
    // month pills — derived from real data
    availMonths.length>0
      ?h("div",{style:{display:"flex",gap:6,overflow:"auto",padding:"0 16px 10px",flexShrink:0}},
        availMonths.map(ym=>h("div",{key:ym,onClick:()=>selectMonth(ym),
          style:{padding:"8px 16px",borderRadius:999,fontFamily:F,fontSize:11,fontWeight:700,cursor:"pointer",flexShrink:0,whiteSpace:"nowrap",
            background:selMonth===ym?C.ink:"#fff",color:selMonth===ym?"#fff":C.ink2,transition:"all .12s"}},
          fmtMonth(ym)))
      )
      :h("div",{style:{height:6}}),
    // type pills
    h("div",{className:"fbar"},
      [{id:"all",l:"Все"},{id:"expense",l:"Расходы"},{id:"income",l:"Доходы"}].map(({id,l})=>
        h("div",{key:id,className:"fpill"+(filterType===id?" act":""),onClick:()=>selectType(id)},l))
    ),
    // category chips — only show cats matching selected type
    allCats.length>0&&h("div",{style:{display:"flex",gap:6,overflow:"auto",padding:"0 16px 10px",flexShrink:0}},
      allCats.map(name=>h("div",{key:name,onClick:()=>setSelCats(p=>p.includes(name)?p.filter(c=>c!==name):[...p,name]),
        style:{display:"flex",alignItems:"center",gap:4,padding:"7px 12px",borderRadius:999,
          background:selCats.includes(name)?C.ink:"#fff",fontSize:11,fontWeight:700,
          color:selCats.includes(name)?"#fff":C.ink2,cursor:"pointer",flexShrink:0,transition:"all .12s"}},
        (catIcons[name]||"")+" "+name))
    ),
    // search
    h("div",{style:{padding:"0 16px 8px",flexShrink:0}},
      h("input",{className:"sinput",placeholder:"🔍  Поиск...",value:search,onChange:e=>setSearch(e.target.value)})
    ),
    h("div",{className:"scroll",style:{padding:"0 16px"}},
      h("div",{className:"kpi-row"},
        h("div",{className:"kpi-cell"},
          h("div",{className:"kpi-val",style:{color:C.rd}},fmt(expense)),
          h("div",{className:"kpi-lab"},"Расходы")),
        h("div",{style:{background:C.bdr}}),
        h("div",{className:"kpi-cell"},
          h("div",{className:"kpi-val"},filtered.length),
          h("div",{className:"kpi-lab"},"Операций")),
        h("div",{style:{background:C.bdr}}),
        h("div",{className:"kpi-cell"},
          h("div",{className:"kpi-val",style:{color:C.gr}},fmt(income)),
          h("div",{className:"kpi-lab"},"Доход"))
      ),
      catRows.length>0&&h("div",{className:"card",style:{padding:16,marginBottom:10}},
        h("div",{style:{fontFamily:F,fontSize:14,fontWeight:800,color:C.ink,marginBottom:14}},"По категориям"),
        ...catRows.map(([name,amt])=>h("div",{key:name,style:{display:"flex",alignItems:"center",gap:10,marginBottom:10}},
          h("div",{style:{fontSize:18,width:26,textAlign:"center",flexShrink:0}},catIcons[name]||"·"),
          h("div",{style:{fontSize:12,fontWeight:600,color:C.ink,width:76,flexShrink:0,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},name),
          h("div",{className:"ptrack",style:{flex:1}},h("div",{className:"pfill r",style:{width:Math.round(amt/maxCat*100)+"%"}})),
          h("div",{style:{fontSize:11,fontWeight:700,color:C.ink2,width:72,textAlign:"right",flexShrink:0}},fmt(amt))
        ))
      ),
      h("div",{style:{fontFamily:F,fontSize:14,fontWeight:800,color:C.ink,marginBottom:10}},"Операции ("+filtered.length+")"),
      filtered.length===0
        ?h("div",{style:{textAlign:"center",padding:"40px 20px"}},
          h("div",{style:{fontSize:44,marginBottom:12}},"📭"),
          h("div",{style:{fontFamily:F,fontSize:15,fontWeight:800,color:C.ink,marginBottom:4}},txs.length===0?"Нет записей":"Нет операций"),
          h("div",{style:{fontSize:12,color:C.ink3}},txs.length===0?"Добавьте первую запись":"За этот период ничего нет")
        )
        :filtered.map(tx=>h(TxCard,{key:tx.id,tx,onTap:onTxTap})),
      h("div",{style:{height:20}})
    )
  );
}

    API.leaderboard()
      .then(r=>setRows(r))
      .catch(()=>setRows([]));
  },[]);

  if(rows===null)return h("div",{style:{padding:20,textAlign:"center",color:C.ink3,fontSize:13}},"Загрузка рейтинга...");

          const h_=heightMap[f.rank]||26;
          return h("div",{key:f.id,style:{display:"flex",flexDirection:"column",alignItems:"center"}},

/* ── ACCOUNTS SCREEN ── */
function AccountsScreen({data,onBack}){
  const{txs}=data;
  const[showAdd,setShowAdd]=useState(false);
  const[newName,setNewName]=useState("");
  const[newBal,setNewBal]=useState("");

  const accMap={};
  txs.forEach(t=>{
    const acc=t.account||"Карта";
    accMap[acc]=(accMap[acc]||0)+(t.type==="income"?t.amount:-t.amount);
  });

  const[customAccs,setCustomAccs]=useState(()=>{
    try{return JSON.parse(localStorage.getItem("finly_accounts")||"[]");}catch{return [];}
  });

  const allNames=new Set([...Object.keys(accMap),...customAccs.map(a=>a.name)]);
  const accList=[...allNames].map(name=>{
    const custom=customAccs.find(a=>a.name===name);
    return{name,icon:custom?.icon||"💳",balance:(custom?.initial||0)+(accMap[name]||0)};
  });
  const total=accList.reduce((s,a)=>s+a.balance,0);

  function addAccount(){
    if(!newName.trim())return;
    const upd=[...customAccs,{name:newName.trim(),icon:"💳",initial:parseInt(newBal)||0}];
    setCustomAccs(upd);
    localStorage.setItem("finly_accounts",JSON.stringify(upd));
    setNewName("");setNewBal("");setShowAdd(false);
  }

  return h("div",{className:"screen anim-fade"},
    h("div",{className:"ph"},
      h("div",{className:"back",onClick:onBack},"←"),
      h("div",{className:"ph-title"},"Счета"),
      h("div",{className:"ph-action",onClick:()=>setShowAdd(true),style:{cursor:"pointer"}},"+")
    ),
    h("div",{className:"scroll",style:{padding:"0 16px"}},
      h("div",{className:"wallet",style:{marginBottom:10}},
        h("div",{style:{fontFamily:F,fontSize:10,fontWeight:700,color:"rgba(255,255,255,.35)",letterSpacing:2,textTransform:"uppercase",marginBottom:4}},"ОБЩИЙ БАЛАНС"),
        h("div",{style:{fontFamily:F,fontSize:32,fontWeight:800,color:total>=0?"#fff":C.rd,lineHeight:1.1,marginBottom:4}},
          fmt(Math.abs(total))," ",h("span",{style:{fontSize:16,color:"rgba(255,255,255,.4)"}},"сум")),
        h("div",{style:{fontSize:12,color:"rgba(255,255,255,.4)",marginBottom:16}},"Все счета вместе"),
        h("div",{style:{height:1,background:"rgba(255,255,255,.08)",marginBottom:16}}),
        accList.length===0
          ?h("div",{style:{fontSize:12,color:"rgba(255,255,255,.3)",textAlign:"center",padding:"8px 0"}},"Счета появятся после первой записи")
          :h("div",{style:{display:"flex",flexWrap:"wrap",gap:"12px 24px"}},
            accList.map(a=>h("div",{key:a.name},
              h("div",{style:{fontFamily:F,fontSize:10,fontWeight:700,color:"rgba(255,255,255,.35)",letterSpacing:2,textTransform:"uppercase",marginBottom:4}},a.name.toUpperCase()),
              h("div",{style:{fontFamily:F,fontSize:20,fontWeight:700,color:a.balance>=0?"#4ADE80":"#F87171"}},fmt(a.balance))
            ))
          )
      ),
      h("div",{className:"btn btn-gray",style:{width:"100%"},onClick:()=>setShowAdd(true)},"+ Добавить счёт"),
      h("div",{style:{height:20}})
    ),
    showAdd&&h("div",{className:"overlay",onClick:e=>{if(e.target===e.currentTarget)setShowAdd(false)}},
      h("div",{className:"msheet"},
        h("div",{className:"mhandle"}),
        h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}},
          h("div",{style:{fontFamily:F,fontSize:18,fontWeight:800,color:C.ink}},"Новый счёт"),
          h("div",{onClick:()=>setShowAdd(false),style:{fontSize:20,color:C.ink3,cursor:"pointer"}},"✕")
        ),
        h("label",{className:"flabel"},"НАЗВАНИЕ"),
        h("input",{className:"finput sm",style:{marginBottom:14},placeholder:"Карта, Наличные…",value:newName,onChange:e=>setNewName(e.target.value)}),
        h("label",{className:"flabel"},"НАЧАЛЬНЫЙ БАЛАНС (СУМ)"),
        h("input",{className:"finput",style:{marginBottom:20},inputMode:"numeric",placeholder:"0",value:newBal,onChange:e=>setNewBal(e.target.value)}),
        h("div",{style:{display:"flex",gap:10}},
          h("div",{className:"btn btn-gray",style:{flex:1},onClick:()=>setShowAdd(false)},"Отмена"),
          h("div",{className:"btn btn-ink",style:{flex:2},onClick:addAccount},"Сохранить")
        )
      )

  );
}

/* ── BUDGETS SCREEN ── */
function BudgetsScreen({data,setData,onBack}){
  const[showAdd,setShowAdd]=useState(false);
  const[editB,setEditB]=useState(null);
  const budgets=data.budgets||[];
  const expCats=data.exp_cats||EXP_CATS;
  const curMon=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"][new Date().getMonth()];

  async function saveBudget(b){
    try{
      if(b.id){
        const res=await API.editBudget(b.id,{name:b.name,icon:b.icon,limit_amt:b.limit,color:b.color});
        setData(d=>({...d,budgets:d.budgets.map(x=>x.id===res.id?res:x)}));
      }else{
        const res=await API.addBudget({name:b.name,icon:b.icon,limit_amt:b.limit,color:b.color});
        setData(d=>({...d,budgets:[...d.budgets,res]}));
      }
    }catch(e){
      console.error(e);
      showToast({icon:"⚠️",title:"Не удалось сохранить бюджет",sub:"Проверьте соединение"});
      if(!b.id){
        const nb={...b,id:Date.now()};
        setData(d=>({...d,budgets:[...d.budgets,nb]}));
      }
    }
    setShowAdd(false);setEditB(null);
  }
  async function deleteBudget(id){
    try{await API.delBudget(id);}catch(e){console.error(e);}
    setData(d=>({...d,budgets:d.budgets.filter(b=>b.id!==id)}));
    setEditB(null);
  }

  return h("div",{className:"screen anim-fade"},
    h("div",{className:"ph"},
      h("div",{className:"back",onClick:onBack},"←"),
      h("div",{className:"ph-title"},"Бюджеты"),
      h("div",{className:"ph-action",onClick:()=>setShowAdd(true),style:{cursor:"pointer"}},"+")
    ),
    h("div",{className:"scroll",style:{padding:"0 16px"}},
      budgets.length===0
        ?h("div",{style:{textAlign:"center",padding:"60px 20px"}},
          h("div",{style:{fontSize:48,marginBottom:14}},"🎯"),
          h("div",{style:{fontFamily:F,fontSize:16,fontWeight:800,color:C.ink,marginBottom:6}},"Нет бюджетов"),
          h("div",{style:{fontSize:13,color:C.ink3,marginBottom:24}},"Установите лимиты расходов по категориям"),
          h("div",{className:"btn btn-ink",style:{display:"inline-block",padding:"14px 28px"},onClick:()=>setShowAdd(true)},"+ Добавить бюджет")
        )
        :h("div",null,
          h("div",{style:{fontFamily:F,fontSize:16,fontWeight:800,color:C.ink,marginBottom:12}},"Бюджеты · "+curMon),
          ...budgets.map(b=>{
            const pct=Math.min(Math.round((b.spent||0)/Math.max(b.limit,1)*100),100);
            const col=pct>=90?"r":pct>=70?"a":"g";
            return h("div",{key:b.id,className:"budg-item",onClick:()=>setEditB(b)},
              h("div",{style:{display:"flex",alignItems:"center",gap:12,marginBottom:10}},
                h("div",{style:{width:42,height:42,borderRadius:14,background:C.bg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0}},b.icon),
                h("div",{style:{flex:1}},
                  h("div",{style:{fontFamily:F,fontSize:15,fontWeight:700,color:C.ink}},b.name),
                  h("div",{style:{fontSize:12,color:C.ink3,marginTop:2}},fmt(b.spent||0)+" / "+fmt(b.limit)+" сум")
                ),
                h("span",{style:{fontSize:11,fontWeight:700,letterSpacing:.8,padding:"5px 10px",borderRadius:9,display:"inline-block",
                  background:pct>=90?C.rdBg:pct>=70?C.amBg:C.grBg,color:pct>=90?C.rd:pct>=70?C.am:C.gr}},pct+"%")
              ),
              h("div",{className:"ptrack"},h("div",{className:`pfill ${col}`,style:{width:pct+"%"}}))
            );
          }),
          h("div",{className:"btn btn-gray",style:{width:"100%",marginTop:4},onClick:()=>setShowAdd(true)},"+ Добавить бюджет")
        ),
      h("div",{style:{height:20}})
    ),
    showAdd&&h("div",{className:"overlay",onClick:e=>{if(e.target===e.currentTarget)setShowAdd(false)}},
      h(BudgetModal,{budget:null,expCats,onClose:()=>setShowAdd(false),onSave:saveBudget})
    ),
    editB&&h("div",{className:"overlay",onClick:e=>{if(e.target===e.currentTarget)setEditB(null)}},
      h(BudgetModal,{budget:editB,expCats,onClose:()=>setEditB(null),onSave:saveBudget,onDelete:(id)=>{deleteBudget(id);setEditB(null);}})
    )
  );
}

/* ── CATEGORIES MODAL ── */
function CategoriesModal({data,setData,onClose}){
  const[tabType,setTabType]=useState("expense");
  const[showAdd,setShowAdd]=useState(false);
  const[catName,setCatName]=useState("");
  const[catIcon,setCatIcon]=useState("📦");
  const[saving,setSaving]=useState(false);
  const allIcons=["💡","🚗","🛒","📱","🎮","✈️","🔧","🏥","🎓","🏋️","💻","🎵","🍰","🌿","🐶","📦","🏠","🚌","🍕","💊","🎬","👕","📚","🤷"];
  const cats=tabType==="expense"?(data.exp_cats||EXP_CATS):(data.inc_cats||INC_CATS);

  async function addCat(){
    if(!catName.trim()||saving)return;
    setSaving(true);
    const body={type:tabType,icon:catIcon,name:catName.trim()};
    try{
      const res=await API.addCategory(body);
      setData(d=>{const key=tabType==="expense"?"exp_cats":"inc_cats";return{...d,[key]:[...(d[key]||[]),{icon:res.icon,name:res.name,id:res.id}]};});
    }catch(e){
      console.error(e);
      showToast({icon:"⚠️",title:"Не удалось сохранить категорию",sub:"Проверьте соединение"});
      setData(d=>{const key=tabType==="expense"?"exp_cats":"inc_cats";return{...d,[key]:[...(d[key]||[]),{icon:catIcon,name:catName.trim(),id:Date.now()}]};});
    }finally{setSaving(false);}
    setCatName("");setCatIcon("📦");setShowAdd(false);
  }

  async function delCat(cat,idx){
    if(cat.id){try{await API.delCategory(cat.id);}catch(e){console.error(e);}}
    setData(d=>{const key=tabType==="expense"?"exp_cats":"inc_cats";return{...d,[key]:(d[key]||[]).filter((_,i)=>i!==idx)};});
  }

  return h("div",{className:"msheet",style:{overflowY:"auto",maxHeight:"90%"}},
    h("div",{className:"mhandle"}),
    h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}},
      h("div",{style:{fontFamily:F,fontSize:18,fontWeight:800,color:C.ink}},"Категории"),
      h("div",{onClick:onClose,style:{fontSize:20,color:C.ink3,cursor:"pointer"}},"✕")
    ),
    h("div",{className:"typerow",style:{marginBottom:14}},
      ["expense","income"].map(t=>h("div",{key:t,className:"typebtn "+(tabType===t?(t==="expense"?"exp-on":"inc-on"):""),onClick:()=>setTabType(t)},t==="expense"?"Расходы":"Доходы"))
    ),
    h("div",{style:{maxHeight:220,overflowY:"auto",marginBottom:12}},
      cats.map((c,i)=>h("div",{key:i,style:{display:"flex",alignItems:"center",gap:10,padding:"11px 0",borderBottom:`1px solid ${C.bdr}`}},
        h("div",{style:{fontSize:22,width:36,textAlign:"center"}},c.icon),
        h("div",{style:{flex:1,fontSize:14,fontWeight:600,color:C.ink}},c.name),
        h("div",{onClick:()=>delCat(c,i),style:{fontSize:16,color:C.ink3,cursor:"pointer",padding:"4px 8px"}},"✕")
      ))
    ),
    showAdd
      ? h("div",{style:{background:C.bg,borderRadius:16,padding:14,marginBottom:4}},
          h("label",{className:"flabel"},"НАЗВАНИЕ"),
          h("input",{className:"finput sm",style:{marginBottom:12},placeholder:"Название категории",value:catName,onChange:e=>setCatName(e.target.value)}),
          h("label",{className:"flabel"},"ЗНАЧОК"),
          h("div",{style:{display:"flex",flexWrap:"wrap",gap:6,marginBottom:12}},
            allIcons.map(ic=>h("div",{key:ic,onClick:()=>setCatIcon(ic),style:{width:40,height:40,borderRadius:11,background:catIcon===ic?C.ink:C.bdr,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,cursor:"pointer",transition:"all .12s"}},ic))
          ),
          h("div",{style:{display:"flex",gap:8}},
            h("div",{className:"btn btn-gray",style:{flex:1,padding:"12px"},onClick:()=>{setShowAdd(false);setCatName("");}},"Отмена"),
            h("div",{className:"btn btn-ink",style:{flex:2,padding:"12px"},onClick:addCat},saving?"...":"Добавить")
          )
        )
      : h("div",{className:"btn btn-ink",style:{width:"100%",marginTop:4},onClick:()=>setShowAdd(true)},"+ Добавить категорию")
  );
}

      h("div",{className:"scard",style:{marginBottom:10}},
        h("div",{className:"srow"},
          h("div",{className:"s-ic",style:{background:"#1C1C1E"}},"🌙"),
          h("div",{style:{flex:1}},
            h("div",{style:{fontSize:14,fontWeight:600,color:C.ink}},"Тёмная тема"),
            h("div",{style:{fontSize:11,color:C.ink3,marginTop:2}},"Переключить тёмный режим")
          ),
          h(Toggle,{on:darkMode,cb:()=>setDarkMode&&setDarkMode(v=>!v)})
        ),
        h("div",{style:{height:1,background:C.bdr,marginLeft:50}}),
        h("div",{className:"srow"},
          h("div",{className:"s-ic",style:{background:C.blBg}},"🔔"),
          h("div",{style:{flex:1}},
            h("div",{style:{fontSize:14,fontWeight:600,color:C.ink}},"Уведомления"),
            h("div",{style:{fontSize:11,color:C.ink3,marginTop:2}},"Напоминания и инсайты")
          ),
          h(Toggle,{on:notifs,cb:()=>{const v=!notifs;setNotifs(v);if(onPatchUser)onPatchUser({notifs:v});}})
        ),
        h("div",{style:{height:1,background:C.bdr,marginLeft:50}}),
        h("div",{className:"srow"},
          h("div",{className:"s-ic",style:{background:C.grBg}},"📊"),
          h("div",{style:{flex:1}},
            h("div",{style:{fontSize:14,fontWeight:600,color:C.ink}},"Еженедельный отчёт"),
            h("div",{style:{fontSize:11,color:C.ink3,marginTop:2}},"Каждое воскресенье в 18:00")
          ),
          h(Toggle,{on:weekly,cb:()=>{const v=!weekly;setWeekly(v);if(onPatchUser)onPatchUser({weekly_report:v});}})
        ),
        h("div",{style:{height:1,background:C.bdr,marginLeft:50}}),
        h(SettRow,{icon:"📤",bg:C.grBg,label:"Экспорт данных",sub:"Excel, PDF"})
      ),
      h("div",{className:"btn btn-red-out",style:{width:"100%",marginTop:4,fontSize:13}},"Выйти из аккаунта"),
      h("div",{style:{textAlign:"center",padding:14,fontSize:10,fontWeight:700,color:C.ink3,letterSpacing:1.5,textTransform:"uppercase"}},"Finly v4.0 · Personal Finance"),
      h("div",{style:{height:20}}),

      // Edit profile modal
      showEditProfile&&h("div",{className:"overlay",onClick:e=>{if(e.target===e.currentTarget)setShowEditProfile(false)}},
        h("div",{className:"msheet"},
          h("div",{className:"mhandle"}),
          h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}},
            h("div",{style:{fontFamily:F,fontSize:18,fontWeight:800,color:C.ink}},"Редактировать профиль"),
            h("div",{onClick:()=>setShowEditProfile(false),style:{fontSize:20,color:C.ink3,cursor:"pointer"}},"✕")
          ),
          h("div",{style:{display:"flex",alignItems:"center",gap:14,marginBottom:20,padding:"14px",background:C.bg,borderRadius:16}},
            h("div",{style:{width:52,height:52,borderRadius:17,background:"#111318",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:F,fontSize:20,fontWeight:800,color:"#fff"}},"А"),
            h("div",{style:{flex:1}},
              h("div",{style:{fontSize:13,fontWeight:600,color:C.ink}},"Аватар"),
              h("div",{style:{fontSize:11,color:C.ink3,marginTop:2}},"Изменить начальную букву имени")
            ),
            h("div",{className:"btn btn-ink",style:{padding:"8px 14px",fontSize:11}},"Изменить")
          ),
          h("label",{className:"flabel"},"ОТОБРАЖАЕМОЕ ИМЯ"),
          h("input",{className:"finput sm",style:{marginBottom:14},defaultValue:TG_NAME}),
          h("label",{className:"flabel"},"TELEGRAM ID"),
          h("input",{className:"finput sm",style:{marginBottom:14},defaultValue:"123456789",readOnly:true,style:{marginBottom:14,opacity:.6}}),
          h("label",{className:"flabel"},"ЯЗЫК ИНТЕРФЕЙСА"),
          h("div",{style:{display:"flex",gap:6,marginBottom:20}},
            ["РУ","UZ","EN"].map(l=>h("div",{key:l,className:"btn "+(l==="РУ"?"btn-ink":"btn-gray"),style:{flex:1,padding:"11px",fontSize:12}},l))
          ),
          h("div",{style:{display:"flex",gap:10}},
            h("div",{className:"btn btn-gray",style:{flex:1},onClick:()=>setShowEditProfile(false)},"Отмена"),
            h("div",{className:"btn btn-ink",style:{flex:2},onClick:()=>setShowEditProfile(false)},"Сохранить")
          )
        )
      ),
      // Categories modal
      showCats&&h("div",{className:"overlay",onClick:e=>{if(e.target===e.currentTarget)setShowCats(false)}},
        h(CategoriesModal,{data,setData,onClose:()=>setShowCats(false)})
      )
    )
  );
}

/* ── APP ROOT ── */
function App(){
  const[loading,setLoading]=useState(true);
  const[error,setError]=useState(null);
  const[data,setData]=useState({
    txs:[],drafts:[],budgets:[],
    streak:0,xp:0,level:1,achievements:[],
    notifs:true,weekly:false,
    exp_cats:[...EXP_CATS],inc_cats:[...INC_CATS],
    xp_log:[],streak_record:0,last_log_date:null
  });
  const[tab,setTab]=useState("home");
  const[toast,setToast]=useState(null);
  const[successInfo,setSuccessInfo]=useState(null);
  const[detailTx,setDetailTx]=useState(null);
  const[editTx,setEditTx]=useState(null);
  const[darkMode,setDarkMode]=useState(()=>{try{return localStorage.getItem("finly_dark")==="1";}catch{return false;}});

  // Wire global toast
  useEffect(()=>{_setToast=setToast;return()=>{_setToast=null;};},[setToast]);

  // Apply color tokens and dark class on every render
  Object.assign(C,darkMode?C_DARK:C_LIGHT);
  useEffect(()=>{
    try{localStorage.setItem("finly_dark",darkMode?"1":"0");}catch{}
    const el=document.getElementById("app");
    if(el){el.classList.toggle("dark",darkMode);el.style.background=darkMode?"#111318":"#F4F5F7";}
    document.body.style.background=darkMode?"#111318":"#F4F5F7";
  },[darkMode]);

  // ── Bootstrap: load all data on open ──
  useEffect(()=>{
    API.auth()
      .then(res=>{
        setData(d=>({
          ...d,
          txs:          res.txs          || [],
          drafts:       res.drafts        || [],
          budgets:      res.budgets       || [],
          achievements: res.achievements  || [],
          exp_cats:     res.exp_cats      || EXP_CATS,
          inc_cats:     res.inc_cats      || INC_CATS,
          xp_log:       res.xp_log        || [],
          streak:       res.user.streak,
          streak_record:res.user.streak_record,
          xp:           res.user.xp,
          level:        res.user.level,
          notifs:       res.user.notifs,
          weekly:       res.user.weekly_report,
          last_log_date:res.user.last_log_date,
        }));
        setLoading(false);
      })
      .catch(e=>{
        console.error("Auth failed:",e);
        // If no API_URL set or running outside Telegram, just show UI with empty data
        setError(API_URL ? e.message : null);
        setLoading(false);
      });
  },[]);

  useEffect(()=>{if(!toast)return;const id=setTimeout(()=>setToast(null),2800);return()=>clearTimeout(id);},[toast]);

  // ── Transaction handlers ──
  async function handleSaved(tx,xp_earned,total_xp){
    setSuccessInfo({tx,xp:xp_earned,totalXp:total_xp});
    setData(d=>({...d,txs:[tx,...d.txs],xp:total_xp}));
    setToast({icon:"🔥",title:"Серия × "+data.streak+"!",sub:"Запись добавлена · +"+xp_earned+" XP",pts:"+"+xp_earned});
  }
  async function handleDeleteTx(id){
    try{ await API.delTx(id); }catch(e){ console.error(e); }
    setData(d=>({...d,txs:d.txs.filter(t=>t.id!==id)}));
    setDetailTx(null);
  }
  async function handleEditSave(updated){
    try{
      const res=await API.editTx(updated.id,{
        type:updated.type,cat_icon:updated.cat,cat_name:updated.catName,
        note:updated.note,amount:updated.amount,date_str:updated.dateStr,
        time_str:updated.time,currency:updated.currency,
        recurring:updated.recurring,account:updated.account
      });
      setData(d=>({...d,txs:d.txs.map(t=>t.id===res.id?res:t)}));
    }catch(e){ console.error(e); }
  }

  // ── Draft handlers ──
  async function handleDraftDelete(id){
    try{ const r=await API.delDraft(id); if(r.xp_earned) setData(d=>({...d,xp:d.xp+r.xp_earned})); }
    catch(e){ console.error(e); }
    setData(d=>({...d,drafts:d.drafts.filter(dr=>dr.id!==id)}));
  }

  // ── Settings sync ──
  async function handlePatchUser(patch){
    try{ await API.patchUser(patch); }catch(e){ console.error(e); }
    setData(d=>({...d,...patch}));
  }

  function setTabSafe(t){setTab(t);if(t!=="add")setSuccessInfo(null);}

  const hasDraft=data.drafts.length>0;

  // Loading screen
  if(loading)return h("div",{id:"app",style:{display:"flex",alignItems:"center",justifyContent:"center",height:"100%",flexDirection:"column",gap:16}},
    h("div",{style:{fontSize:32}},"💰"),
    h("div",{style:{fontFamily:"'Syne',sans-serif",fontSize:18,fontWeight:800,color:"#111318"}},"Finly"),
    h("div",{style:{fontSize:13,color:"#B0B7C3",marginTop:4}},"Загрузка...")
  );

  // Error screen (only if API_URL is set but failed)
  if(error)return h("div",{id:"app",style:{display:"flex",alignItems:"center",justifyContent:"center",height:"100%",flexDirection:"column",gap:12,padding:24}},
    h("div",{style:{fontSize:40}},"⚠️"),
    h("div",{style:{fontFamily:"'Syne',sans-serif",fontSize:16,fontWeight:700,color:"#111318",textAlign:"center"}},"Не удалось подключиться"),
    h("div",{style:{fontSize:12,color:"#B0B7C3",textAlign:"center",lineHeight:1.5}},error),
    h("div",{className:"btn btn-ink",style:{marginTop:8},onClick:()=>window.location.reload()},"Попробовать снова")
  );

  if(tab==="add"&&successInfo)return h("div",{id:"app",style:{display:"flex",flexDirection:"column",height:"100%"}},
    h(SuccessScreen,{tx:successInfo.tx,xp:successInfo.xp,totalXp:successInfo.totalXp,onDone:()=>setSuccessInfo(null),setTab:setTabSafe})
  );

  return h("div",{id:"app",className:darkMode?"dark":""},
    toast&&h(Toast,{toast}),
    h("div",{style:{flex:1,overflow:"hidden",display:"flex",flexDirection:"column"}},
      tab==="home"&&h(HomeScreen,{data,setTab:setTabSafe,onTxTap:(tx)=>setDetailTx(tx)}),
      tab==="add"&&h(AddScreen,{data,setData,onSaved:handleSaved,setTab:setTabSafe}),
      tab==="analytics"&&h(AnalyticsScreen,{data,onTxTap:(tx)=>setDetailTx(tx)}),
      tab==="rewards"&&h(RewardsScreen,{data,setData}),
      tab==="profile"&&h(ProfileScreen,{data,setData,onPatchUser:handlePatchUser,darkMode,setDarkMode})
    ),
    h(NavBar,{tab,setTab:setTabSafe,hasDraft}),
    detailTx&&!editTx&&h(TxDetailModal,{tx:detailTx,onClose:()=>setDetailTx(null),onDelete:handleDeleteTx,onEdit:(tx)=>{setEditTx(tx);setDetailTx(null);}}),
    editTx&&h(TxEditModal,{tx:editTx,onClose:()=>setEditTx(null),onSave:handleEditSave})
  );
}
// Safety: ensure DOM is ready before mounting
if (document.getElementById("app")) {
  ReactDOM.createRoot(document.getElementById("app")).render(h(App,null));
} else {
  document.addEventListener("DOMContentLoaded", function() {
    ReactDOM.createRoot(document.getElementById("app")).render(h(App,null));
  });
}
</script>
</body>
</html>
